<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>分子結構與混成軌域模擬實驗室 v12.2 (Mobile Fix)</title>
<style>
/* --- 1. 基礎設定與變數 --- */
    :root {
        --bg-radial-inner: #000000; 
        --bg-radial-outer: #000000;
        
        /* 電腦版面板樣式 */
        --panel-glass: rgba(20, 20, 20, 0.7); 
        --panel-border: rgba(255, 255, 255, 0.15);
        --card-glass: rgba(255, 255, 255, 0.05);
        
        --text-main: #f0f4f8;
        --text-sub: #94a3b8;
        --text-highlight: #38bdf8;
        
        --accent-blue: #3b82f6;
        --accent-green: #10b981;
    }

    * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }

    body {
        margin: 0; 
        font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: radial-gradient(circle at center, var(--bg-radial-inner) 0%, var(--bg-radial-outer) 100%);
        color: var(--text-main);
        height: 100vh; overflow: hidden; display: flex; flex-direction: column;
    }

    .app-container { display: flex; width: 100%; height: 100%; flex-direction: row; }

    /* --- 2. 3D 顯示區 --- */
    .viewport-area {
        flex: 1; position: relative;
        background-image: 
            linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px), 
            linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
        background-size: 60px 60px; 
        background-position: center center;
        overflow: hidden; cursor: grab;
        /* [關鍵] 禁止瀏覽器預設手勢，交給 JS */
        touch-action: none; 
        -webkit-user-select: none;
    }
    .viewport-area:active { cursor: grabbing; } 

    .viewport-header h1 {
        margin: 0; font-size: 1.5rem; letter-spacing: 1px;
        text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
    }

    #molecule-svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
    #molecule-svg * { pointer-events: none; }

    .atom-label-text {
        font-family: 'Roboto Mono', monospace; font-weight: 700; 
        text-anchor: middle; dominant-baseline: central; 
        fill: #ffffff; text-shadow: 0 0 4px #000;
    }

    /* --- 3. 電腦版介面 (預設) --- */
    .controls-container {
        position: absolute; top: 25px; right: 25px; z-index: 50; 
        display: flex; gap: 15px; align-items: center; pointer-events: auto;
    }

    .control-button {
        padding: 8px 16px; border-radius: 20px; font-size: 0.9rem; font-weight: 600;
        border: 1px solid var(--panel-border); cursor: pointer; transition: all 0.3s;
        background: rgba(0, 0, 0, 0.4); color: var(--text-main);
        backdrop-filter: blur(4px); box-shadow: 0 4px 6px rgba(0,0,0,0.2);
    }
    .control-button:hover { transform: translateY(-2px); box-shadow: 0 0 15px rgba(59, 130, 246, 0.4); border-color: var(--accent-blue); }
    .control-button.active { background: var(--accent-blue); border-color: var(--accent-blue); box-shadow: 0 0 15px var(--accent-blue); }

    /* 電腦版面板：右側懸浮 */
    .controls-area { 
        width: 400px; min-width: 320px;
        background-color: var(--panel-glass);
        backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
        border-left: 1px solid var(--panel-border);
        display: flex; flex-direction: column; 
        padding: 25px; overflow-y: auto; 
        box-shadow: -10px 0 30px rgba(0,0,0,0.5); 
        z-index: 20;
    }

    .card { 
        background: var(--card-glass); 
        border: 1px solid var(--panel-border); 
        border-radius: 16px; padding: 20px; margin-bottom: 20px; 
        transition: transform 0.2s;
    }
    .card:hover { border-color: rgba(255,255,255,0.2); }

    .card-title { 
        font-size: 1rem; font-weight: 700; color: var(--text-highlight); 
        margin-bottom: 15px; display: flex; align-items: center; gap: 10px; text-transform: uppercase; letter-spacing: 1px;
    }

    .data-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .data-label { font-size: 0.9rem; color: var(--text-sub); }
    .data-value { 
        font-family: 'Roboto Mono', monospace; 
        font-size: 1rem; color: var(--text-main); font-weight: 500;
    }
    
    .input-group { display: flex; gap: 8px; }
    .input-group input { 
        flex-grow: 1; padding: 12px; border: 1px solid var(--panel-border); border-radius: 8px; 
        background: rgba(0,0,0,0.3); color: white; font-family: 'Roboto Mono', monospace;
        transition: border 0.3s; outline: none;
    }
    .input-group input:focus { border-color: var(--accent-blue); }
    .input-group button { 
        padding: 10px 20px; background: var(--accent-blue); color: white; border: none; border-radius: 8px; 
        cursor: pointer; font-weight: bold; transition: all 0.2s; 
    }
    .input-group button:hover { background: #2563eb; }

    .switch-container { 
        display: flex; align-items: center; gap: 10px; margin-bottom: 10px; 
        background: rgba(0,0,0,0.2); padding: 12px; border-radius: 8px; border: 1px solid transparent; transition: border 0.3s;
    }
    .switch-container:hover { border-color: var(--panel-border); }
    .switch-container input { width: 18px; height: 18px; accent-color: var(--accent-green); cursor: pointer; }

    #variant-selector {
        display: none; background: rgba(16, 185, 129, 0.05); border: 1px solid rgba(16, 185, 129, 0.2);
        padding: 15px; border-radius: 12px; margin-bottom: 15px;
    }
    .variant-option { padding: 5px 0; display: flex; align-items: center; gap: 10px; cursor: pointer; color: var(--accent-green); }

    /* 手機版把手 (預設隱藏) */
    #mobile-panel-handle {
        display: none; 
        width: 100%; height: 40px; 
        justify-content: center; align-items: center;
        cursor: pointer; flex-shrink: 0;
        border-bottom: 1px solid rgba(255,255,255,0.1);
        touch-action: none;
    }
    .handle-bar {
        width: 60px; height: 5px;
        background-color: var(--text-sub);
        border-radius: 10px; opacity: 0.6;
    }

/* --- 手機版專用 override (只在窄螢幕生效) --- */
    @media (max-width: 768px) {
        .app-container { flex-direction: column; height: 100vh; overflow: hidden; }
        .controls-container { display: none !important; } 
        #mobile-panel-handle { display: flex; }

        /* 3D 區塊佔滿全螢幕 */
        .viewport-area {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0;
        }

        /* 面板改為下方抽屜式 */
        .controls-area {
            position: fixed; bottom: 0; left: 0; width: 100%; 
            height: 60vh; /* 面板高度 */
            border-left: none; border-top: 1px solid rgba(255,255,255,0.2);
            border-radius: 24px 24px 0 0;
            
            /* 手機版背景稍微深一點，且移除模糊以提升拖曳效能 */
            background-color: rgba(20, 25, 35, 0.98); 
            backdrop-filter: none;
            
            padding: 0 25px 25px 25px;
            z-index: 100;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.8);
            
            transform: translateY(0); /* 預設展開 */
            will-change: transform;
            /* 預設的 CSS transition，拖曳時 JS 會暫時移除它 */
            transition: transform 0.35s cubic-bezier(0.25, 1, 0.5, 1);
        }
        
        /* 收起狀態：只露出一點點 */
        .controls-area.minimized {
            transform: translateY(calc(100% - 40px)); 
        }

        /* 內容區塊設為可滾動 */
        .controls-content {
            overflow-y: auto; height: calc(100% - 40px);
            padding-top: 10px;
            -webkit-overflow-scrolling: touch;
            -ms-overflow-style: none; scrollbar-width: none;
        }
        .controls-content::-webkit-scrollbar { display: none; }
    }
</style>
</head>
<body>

<div class="app-container">
    <div class="viewport-area composite-mode" id="viewport">
        <div class="viewport-header" style="position: absolute; top: 25px; left: 25px; z-index: 10; pointer-events: none;">
            <h1 style="margin: 0; font-size: 1.5rem;">MOLECULAR SIMULATOR v12.2</h1>
            <span style="font-size: 1.1rem; color: var(--text-sub);" id="viewport-subtitle"></span>
        </div>
        
        <div class="controls-container">
            <button id="mode-toggle" class="control-button mode-composite active" onclick="toggleMode()">模式: **複合**</button>
        </div>

        <svg id="molecule-svg" viewBox="-400 -300 800 600" preserveAspectRatio="xMidYMid slice" style="transition: transform 0.1s ease-out; transform: scale(1.7);">
            <defs>
                <filter id="blur-filter" x="-50%" y="-50%" width="200%" height="200%">
                    <fegaussianblur in="SourceGraphic" stdDeviation="5"></fegaussianblur>
                </filter>
            </defs>
            <g id="scene-root"></g>
        </svg>
    </div>

    <div class="controls-area" id="controls-panel">
        <div id="mobile-panel-handle"><div class="handle-bar"></div></div>
        
        <div class="controls-content">
            <div class="card">
                <div class="card-title">⚛️ 分子載入</div>
                <div class="input-group">
                    <input type="text" id="formula-input" placeholder="Ex: H2O, P4O6, C60..." value="H2O">
                    <button onclick="handleLoadBtn()">載入</button>
                </div>
                <div style="font-size:0.8rem; color:var(--text-highlight); margin-top:10px; display:none;" id="mobile-hint">
                    單指旋轉 / 雙指平移縮放 (Z軸旋轉)
                </div>
            </div>

            <div class="switch-container">
                <input type="checkbox" id="toggle-lp" checked="" onchange="renderScene()">
                <label for="toggle-lp" style="cursor: pointer; font-weight: bold;">顯示孤對電子 (3D)</label>
            </div>

            <div class="switch-container">
                <input type="checkbox" id="toggle-octet" onchange="reloadCurrentMolecule()">
                <label for="toggle-octet" style="cursor: pointer; font-weight: bold;">優先遵循八隅體</label>
            </div>

            <div id="variant-selector" style="display: none;"></div>

            <div class="card">
                <div class="card-title">📊 結構資訊</div>
                <div class="data-row"><span class="data-label">化學式</span><span class="data-value" id="disp-formula"></span></div>
                <div class="data-row"><span class="data-label">中心原子</span><span class="data-value" id="disp-center"></span></div>
                <div class="data-row"><span class="data-label">混成軌域</span><span class="data-value" id="disp-hybrid"></span></div>
                <div class="data-row"><span class="data-label">形狀</span><span class="data-value" id="disp-shape"></span></div>
                <div class="data-row"><span class="data-label">鍵角</span><span class="data-value" id="disp-angle"></span></div>
                <div class="data-row"><span class="data-label">鍵結統計</span><span class="data-value" id="disp-bonds"></span></div>
                <div class="data-row"><span class="data-label">分子量</span><span class="data-value" id="disp-mass"></span></div>
            </div>
        </div>
    </div>
</div>

<script>
// --- 1. 元素性質 ---
const ELEMENT_PROPS = {
    "H":  { ve: 1, c3d: "#FFFFFF", r3d: 12, lp: 0, mass: 1.008 }, 
    "He": { ve: 2, c3d: "#d1d5db", r3d: 10, lp: 1, mass: 4.002 },
    "Li": { ve: 1, c3d: "#d946ef", r3d: 22, lp: 0, mass: 6.94 }, 
    "Be": { ve: 2, c3d: "#94a3b8", r3d: 18, lp: 0, mass: 9.012 },
    "B":  { ve: 3, c3d: "#fbbf24", r3d: 20, lp: 0, mass: 10.81 }, 
    "C":  { ve: 4, c3d: "#64748b", r3d: 20, lp: 0, mass: 12.011 },
    "N":  { ve: 5, c3d: "#3b82f6", r3d: 19, lp: 1, mass: 14.007 }, 
    "O":  { ve: 6, c3d: "#ef4444", r3d: 18, lp: 2, mass: 15.999 }, 
    "F":  { ve: 7, c3d: "#84cc16", r3d: 17, lp: 3, mass: 18.998 }, 
    "Ne": { ve: 8, c3d: "#67e8f9", r3d: 16, lp: 4, mass: 20.180 },
    "Na": { ve: 1, c3d: "#a855f7", r3d: 24, lp: 0, mass: 22.990 },
    "Mg": { ve: 2, c3d: "#84cc16", r3d: 22, lp: 0, mass: 24.305 },
    "Al": { ve: 3, c3d: "#cbd5e1", r3d: 24, lp: 0, mass: 26.982 },
    "Si": { ve: 4, c3d: "#94a3b8", r3d: 24, lp: 0, mass: 28.085 },
    "P":  { ve: 5, c3d: "#f97316", r3d: 23, lp: 0, mass: 30.974 }, 
    "S":  { ve: 6, c3d: "#FFFF00", r3d: 22, lp: 0, mass: 32.06 }, 
    "Cl": { ve: 7, c3d: "#22c55e", r3d: 21, lp: 3, mass: 35.45 },
    "Ar": { ve: 8, c3d: "#38bdf8", r3d: 20, lp: 4, mass: 39.948 },
    "K":  { ve: 1, c3d: "#8b5cf6", r3d: 26, lp: 0, mass: 39.098 },
    "Ca": { ve: 2, c3d: "#4ade80", r3d: 26, lp: 0, mass: 40.078 },
    "Br": { ve: 7, c3d: "#b91c1c", r3d: 25, lp: 3, mass: 79.904 }, 
    "I":  { ve: 7, c3d: "#a855f7", r3d: 28, lp: 3, mass: 126.90 }, 
    "Xe": { ve: 8, c3d: "#818cf8", r3d: 28, lp: 3, mass: 131.29 },
    "Mn": { ve: 7, c3d: "#d946ef", r3d: 24, lp: 0, mass: 54.938 },
    "Cr": { ve: 6, c3d: "#64748b", r3d: 24, lp: 0, mass: 51.996 },
    "Fe": { ve: 8, c3d: "#f97316", r3d: 24, lp: 0, mass: 55.845 },
    "Cu": { ve: 11, c3d: "#f59e0b", r3d: 24, lp: 0, mass: 63.546 },
    "Zn": { ve: 12, c3d: "#94a3b8", r3d: 24, lp: 0, mass: 65.38 }, 
    "Ag": { ve: 11, c3d: "#e2e8f0", r3d: 26, lp: 0, mass: 107.87 },
    "Au": { ve: 11, c3d: "#fbbf24", r3d: 26, lp: 0, mass: 196.97 }
};

// --- 2. 數據邏輯 (資料庫) ---
let MOLECULE_DB = {};

function autoAssignLonePairs(atom, bonds, allAtoms) {
    if (atom.lp3d !== undefined && atom.lp3d.length > 0) return atom.lpCount || atom.lp3d.length;
    if (atom.lpCount !== undefined) return atom.lpCount;
    const myBonds = bonds.filter(b => allAtoms[b[0]] === atom || allAtoms[b[1]] === atom);
    const bondCount = myBonds.length;
    const elem = atom.elem;
    if (['N','P','As','Sb'].includes(elem)) {
        if (bondCount === 3) return 1; if (bondCount === 2) return 1; if (bondCount === 1) return 1;
    }
    if (['O','S','Se','Te'].includes(elem)) {
        if (bondCount === 2) return 2; if (bondCount === 1) return (myBonds[0][2] === 'double') ? 2 : 3;
    }
    if (['F','Cl','Br','I'].includes(elem) && bondCount === 1) return 3;
    if (elem === 'Xe') { if (bondCount === 2) return 3; if (bondCount === 4) return 2; }
    return 0;
}

function generateElectronDots(atom, atomIndex, allAtoms, allBonds) {
    const dots = [];
    let lpCount = atom.calculatedLP;
    if (lpCount <= 0 && !atom.radical) return dots;

    if (atom.lp3d && atom.lp3d.length > 0) {
         const pushDist = atom.r * 1.8; 
         atom.lp3d.forEach(v => {
             const len = Math.sqrt(v.x*v.x + v.y*v.y + v.z*v.z) || 1;
             addPairToDots(dots, atom, { x: (v.x/len)*pushDist, y: (v.y/len)*pushDist, z: (v.z/len)*pushDist });
         });
         return dots;
    }

    const myBonds = allBonds.filter(b => b[0] === atomIndex || b[1] === atomIndex);
    let bondVectors = [];
    myBonds.forEach(b => {
        const otherIdx = (b[0] === atomIndex) ? b[1] : b[0];
        const other = allAtoms[otherIdx];
        let vx = other.x - atom.x, vy = other.y - atom.y, vz = other.z - atom.z;
        const len = Math.sqrt(vx*vx + vy*vy + vz*vz) || 1;
        bondVectors.push({ x: vx/len, y: vy/len, z: vz/len, style: b[2] });
    });

    let sumX = 0, sumY = 0, sumZ = 0;
    if (bondVectors.length > 0) bondVectors.forEach(v => { sumX += v.x; sumY += v.y; sumZ += v.z; });
    else { sumX = 0; sumY = -1; sumZ = 0; }

    let backX = -sumX, backY = -sumY, backZ = -sumZ;
    let backLen = Math.sqrt(backX*backX + backY*backY + backZ*backZ);
    if (backLen < 0.001) { backX=0; backY=1; backZ=0; backLen=1; }
    backX /= backLen; backY /= backLen; backZ /= backLen;

    let ux = backX, uy = backY, uz = backZ;
    let tempX = 0, tempY = 1, tempZ = 0;
    if (Math.abs(ux) < 0.1 && Math.abs(uz) < 0.1) { tempX=1; tempY=0; tempZ=0; }
    let wx = uy*tempZ - uz*tempY, wy = uz*tempX - ux*tempZ, wz = ux*tempY - uy*tempX;
    let wLen = Math.sqrt(wx*wx + wy*wy + wz*wz);
    wx/=wLen; wy/=wLen; wz/=wLen;
    let vx = wy*uz - wz*uy, vy = wz*ux - wx*uz, vz = wx*uy - wy*ux;

    const lpDist = atom.r * 2.2;
    const pushLP = (dx, dy, dz) => { addPairToDots(dots, atom, { x: dx*lpDist, y: dy*lpDist, z: dz*lpDist }); };

    if (bondVectors.length === 1) {
        if (lpCount === 3) {
            const angle = 70 * (Math.PI/180); const sinA = Math.sin(angle), cosA = Math.cos(angle);
            for(let i=0; i<3; i++) {
                const theta = i * (120 * Math.PI/180);
                const px = cosA * ux + sinA * (Math.cos(theta)*vx + Math.sin(theta)*wx);
                const py = cosA * uy + sinA * (Math.cos(theta)*vy + Math.sin(theta)*wy);
                const pz = cosA * uz + sinA * (Math.cos(theta)*vz + Math.sin(theta)*wz);
                pushLP(px, py, pz);
            }
        } else if (lpCount === 2) {
            const angle = 60 * (Math.PI/180);
            pushLP(Math.cos(angle)*ux + Math.sin(angle)*vx, Math.cos(angle)*uy + Math.sin(angle)*vy, Math.cos(angle)*uz + Math.sin(angle)*vz);
            pushLP(Math.cos(angle)*ux - Math.sin(angle)*vx, Math.cos(angle)*uy - Math.sin(angle)*vy, Math.cos(angle)*uz - Math.sin(angle)*vz);
        } else if (lpCount === 1) pushLP(ux, uy, uz);
    } else if (bondVectors.length === 2) {
        if (lpCount === 2) {
            let b1 = bondVectors[0], b2 = bondVectors[1];
            let nx = b1.y*b2.z - b1.z*b2.y, ny = b1.z*b2.x - b1.x*b2.z, nz = b1.x*b2.y - b1.y*b2.x;
            let nLen = Math.sqrt(nx*nx + ny*ny + nz*nz);
            if (nLen > 0.001) { nx/=nLen; ny/=nLen; nz/=nLen; } else { nx=vx; ny=vy; nz=vz; }
            const tilt = 50 * (Math.PI/180);
            pushLP(Math.cos(tilt)*ux + Math.sin(tilt)*nx, Math.cos(tilt)*uy + Math.sin(tilt)*ny, Math.cos(tilt)*uz + Math.sin(tilt)*nz);
            pushLP(Math.cos(tilt)*ux - Math.sin(tilt)*nx, Math.cos(tilt)*uy - Math.sin(tilt)*ny, Math.cos(tilt)*uz - Math.sin(tilt)*nz);
        } else if (lpCount === 1) pushLP(ux, uy, uz);
    } else pushLP(ux, uy, uz);

    return dots;
}

function addPairToDots(dotsArray, atom, vector) {
    let lx = vector.x, ly = vector.y, lz = vector.z;
    let ox = -ly, oy = lx, oz = 0;
    if (Math.abs(lx) < 0.1 && Math.abs(ly) < 0.1) { ox = 1; oy = 0; oz = 0; }
    let oLen = Math.sqrt(ox*ox + oy*oy + oz*oz);
    const separation = 14.0;
    ox = (ox/oLen) * (separation/2); oy = (oy/oLen) * (separation/2); oz = (oz/oLen) * (separation/2);
    const eRadius = 4.5;
    dotsArray.push({ x: atom.x + lx + ox, y: atom.y + ly + oy, z: atom.z + lz + oz, isElectron: true, r: eRadius });
    if (!atom.radical) dotsArray.push({ x: atom.x + lx - ox, y: atom.y + ly - oy, z: atom.z + lz - oz, isElectron: true, r: eRadius });
}

const addMol = (key, center, hybrid, shape, angle, atoms, bonds, svgElements, variants = null) => {
    const baseData = { center, hybrid: `${hybrid} 混成 (${hybrid})`, shape: `${shape[0]} (${shape[1]})`, angle, atomsRaw: atoms, bondsRaw: bonds };
    if (variants) {
        baseData.variants = {};
        for (let vKey in variants) baseData.variants[vKey] = { ...baseData, atomsRaw: variants[vKey].atoms, bondsRaw: variants[vKey].bonds };
    }
    MOLECULE_DB[key] = baseData;
};

// ... (Geometry Helpers) ...
const di = (e, dist=60) => [{elem:e,x:-dist,y:0,z:0},{elem:e,x:dist,y:0,z:0}];
const getLinear = (c, o, r=70) => [ {elem:c,x:0,y:0,z:0, lpCount:0}, {elem:o,x:-r,y:0,z:0}, {elem:o,x:r,y:0,z:0} ];
const getTrigPlanar = (c, o, r=70) => [ {elem:c,x:0,y:0,z:0, lpCount:0}, {elem:o,x:0,y:r,z:0}, {elem:o,x:r*0.866,y:-r*0.5,z:0}, {elem:o,x:-r*0.866,y:-r*0.5,z:0} ];

const addFullerene = (name, n, r, stretch=1) => {
    const atoms = [];
    const phi = Math.PI * (3 - Math.sqrt(5)); 
    for (let i = 0; i < n; i++) {
        const y = 1 - (i / (n - 1)) * 2;
        const radiusAtY = Math.sqrt(1 - y * y);
        const theta = phi * i;
        const x = Math.cos(theta) * radiusAtY;
        const z = Math.sin(theta) * radiusAtY;
        atoms.push({ elem: "C", x: x * r, y: y * r * stretch, z: z * r, lpCount: 0 });
    }
    const bonds = [];
    const threshold = (r < 100 ? 35 : 45) * (stretch > 1 ? 1.2 : 1);
    const threshSq = threshold * threshold;
    for(let i=0; i<n; i++){
        for(let j=i+1; j<n; j++){
            const dx = atoms[i].x - atoms[j].x;
            const dy = atoms[i].y - atoms[j].y;
            const dz = atoms[i].z - atoms[j].z;
            if (dx*dx + dy*dy + dz*dz < threshSq) bonds.push([i, j, "single"]);
        }
    }
    addMol(name, "C", "sp²", ["籠狀/球狀", "Cage"], "-", atoms, bonds);
};

let currentMolecule = null;

const sceneRoot = document.getElementById("scene-root");
const viewport = document.getElementById("viewport");

function isMobileMode() {
    return window.matchMedia("(max-width: 768px)").matches;
}

function toggleMobilePanel() {
    const panel = document.getElementById('controls-panel');
    if(panel) panel.classList.toggle('minimized');
}

function toggleMode() {
    currentMode = (currentMode + 1) % 3; 
    const modes = ['平移', '旋轉', '複合'];
    const classes = ['mode-pan', 'mode-rotate', 'mode-composite'];
    modeToggleBtn.className = `control-button ${classes[currentMode]} active`;
    modeToggleBtn.innerHTML = `模式: **${modes[currentMode]}**`;
    viewport.className = `viewport-area ${classes[currentMode]}`;
}

function project(p, rotX, rotY, rotZ, panX, panY) {
    let x1 = p.x * Math.cos(rotY) - p.z * Math.sin(rotY);
    let z1 = p.z * Math.cos(rotY) + p.x * Math.sin(rotY);
    let y2 = p.y * Math.cos(rotX) - z1 * Math.sin(rotX);
    let z2 = z1 * Math.cos(rotX) + p.y * Math.sin(rotX);
    let x3 = x1 * Math.cos(rotZ) - y2 * Math.sin(rotZ);
    let y3 = x1 * Math.sin(rotZ) + y2 * Math.cos(rotZ);
    let s = (600 / (600 - z2)) * scale;
    return { x: x3 * s + panX, y: y3 * s + panY, z: z2, scale: s };
}

// [修改] 渲染與效能優化 (手機版關閉濾鏡)
function renderScene() {
    sceneRoot.innerHTML = "";
    if(!currentMolecule) return;
    
    const defs = createSVG("defs");
    const isMobile = isMobileMode();

    if (!isMobile) {
        const filter = document.createElementNS("http://www.w3.org/2000/svg", "filter");
        filter.setAttribute("id", "soft-glow");
        filter.setAttribute("x", "-50%"); filter.setAttribute("y", "-50%");
        filter.setAttribute("width", "200%"); filter.setAttribute("height", "200%");
        filter.innerHTML = '<feGaussianBlur in="SourceGraphic" stdDeviation="3.5" />';
        defs.appendChild(filter);
    }

    const usedColors = new Set();
    currentMolecule.renderObjects.forEach(obj => {
        if (obj.type === 'atom') usedColors.add(obj.color);
    });

    usedColors.forEach(color => {
        const cleanColor = color.replace('#','');
        const gradId = `atom-grad-${cleanColor}`;
        const grad = document.createElementNS("http://www.w3.org/2000/svg", "radialGradient");
        grad.setAttribute("id", gradId);
        grad.setAttribute("cx", "30%"); grad.setAttribute("cy", "30%"); grad.setAttribute("r", "70%");
        let startColor = lightenColor(color, 60); if (color === '#FFFFFF') startColor = "#FFFFFF";
        let endColor = darkenColor(color, 40);
        grad.innerHTML = `<stop offset="0%" stop-color="${startColor}" /><stop offset="45%" stop-color="${color}" /><stop offset="100%" stop-color="${endColor}" />`;
        defs.appendChild(grad);
    });
    sceneRoot.appendChild(defs);

    const showLPs = document.getElementById('toggle-lp').checked;
    const renderList = [];
    
    const projectedObjects = currentMolecule.renderObjects.map((obj, i) => {
        const p = project(obj, rotation.x, rotation.y, rotation.z, panOffset.x, panOffset.y);
        return { ...obj, px: p.x, py: p.y, pz: p.z, scale: p.scale, idx: i };
    });

    const atomProjections = projectedObjects.filter(o => o.type === 'atom');

    currentMolecule.bonds3D.forEach((bond, index) => { 
        const a1 = atomProjections[bond[0]];
        const a2 = atomProjections[bond[1]];
        if (!a1 || !a2) return;
        const dx = a2.px - a1.px, dy = a2.py - a1.py;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist > 0) {
            const nx = dx/dist, ny = dy/dist;
            const bondShorten = 0.6;
            const x1 = a1.px + nx * a1.r * a1.scale * bondShorten;
            const y1 = a1.py + ny * a1.r * a1.scale * bondShorten;
            const x2 = a2.px - nx * a2.r * a2.scale * bondShorten;
            const y2 = a2.py - ny * a2.r * a2.scale * bondShorten;
            renderList.push({
                type: "bond", z: (a1.pz+a2.pz)/2, x1, y1, x2, y2, 
                style: bond[2]||"single", scale: (a1.scale+a2.scale)/2,
                c1: a1.color, c2: a2.color, bondIdx: index
            });
        }
    });

    projectedObjects.forEach(obj => {
        if (obj.type === 'electron' && !showLPs) return;
        if (obj.type !== 'bond') renderList.push({ ...obj, z: obj.pz });
    });

    renderList.sort((a,b) => a.z - b.z).forEach(obj => {
        if (obj.type === "bond") drawBond(obj, isMobile);
        else if (obj.type === "atom") drawAtom(obj, isMobile);
        else if (obj.type === "electron") drawElectron(obj, isMobile);
    });
}

function lightenColor(col, amt) {
    let usePound = false;
    if (col[0] == "#") { col = col.slice(1); usePound = true; }
    let num = parseInt(col,16);
    let r = (num >> 16) + amt; if (r > 255) r = 255; else if (r < 0) r = 0;
    let b = ((num >> 8) & 0x00FF) + amt; if (b > 255) b = 255; else if (b < 0) b = 0;
    let g = (num & 0x0000FF) + amt; if (g > 255) g = 255; else if (g < 0) g = 0;
    return (usePound?"#":"") + (g | (b << 8) | (r << 16)).toString(16).padStart(6,'0');
}
function darkenColor(col, amt) { return lightenColor(col, -amt); }

function drawBond(b, isMobile) {
    const g = createSVG("g");
    let c1 = b.c1 === "#FFFFFF" ? "#cbd5e1" : b.c1;
    let c2 = b.c2 === "#FFFFFF" ? "#cbd5e1" : b.c2;
    const gradId = `bond-grad-${b.bondIdx}`;
    let defs = sceneRoot.querySelector("defs");
    if (!defs.querySelector(`#${gradId}`)) {
        const grad = document.createElementNS("http://www.w3.org/2000/svg", "linearGradient");
        grad.setAttribute("id", gradId);
        grad.setAttribute("gradientUnits", "userSpaceOnUse");
        grad.innerHTML = `<stop offset="0%" stop-color="${c1}"/><stop offset="40%" stop-color="${c1}"/><stop offset="60%" stop-color="${c2}"/><stop offset="100%" stop-color="${c2}"/>`; 
        defs.appendChild(grad);
    }
    const gradEl = defs.querySelector(`#${gradId}`);
    gradEl.setAttribute("x1", b.x1); gradEl.setAttribute("y1", b.y1);
    gradEl.setAttribute("x2", b.x2); gradEl.setAttribute("y2", b.y2);
    const strokeUrl = `url(#${gradId})`;
    const w = 8 * b.scale; 
    const drawLine = (ox, oy, width, color, opacity=1, useFilter=false) => {
        const el = document.createElementNS("http://www.w3.org/2000/svg", "line");
        el.setAttribute("x1", b.x1+ox); el.setAttribute("y1", b.y1+oy); 
        el.setAttribute("x2", b.x2+ox); el.setAttribute("y2", b.y2+oy); 
        el.setAttribute("stroke", color); el.setAttribute("stroke-width", width); 
        el.setAttribute("stroke-linecap", "round");
        if(opacity < 1) el.setAttribute("opacity", opacity);
        if(useFilter && !isMobile) el.setAttribute("filter", "url(#soft-glow)");
        return el;
    };
    const dx = b.x2-b.x1, dy = b.y2-b.y1, len = Math.sqrt(dx*dx+dy*dy);
    const nx = -dy/len, ny = dx/len;
    g.appendChild(drawLine(0, 0, w*1.2, strokeUrl, 0.4, true));
    if (b.style === "double") {
        const off = w * 0.55; const subW = w * 0.45;
        g.appendChild(drawLine(nx*off, ny*off, subW, strokeUrl)); g.appendChild(drawLine(-nx*off, -ny*off, subW, strokeUrl));
        g.appendChild(drawLine(nx*off, ny*off, subW*0.3, "#fff", 0.5)); g.appendChild(drawLine(-nx*off, -ny*off, subW*0.3, "#fff", 0.5));
    } else if (b.style === "triple") {
        const off = w * 0.75; const subW = w * 0.35;
        g.appendChild(drawLine(nx*off, ny*off, subW, strokeUrl)); g.appendChild(drawLine(0, 0, subW*1.1, strokeUrl)); g.appendChild(drawLine(-nx*off, -ny*off, subW, strokeUrl));
    } else {
        g.appendChild(drawLine(0, 0, w, strokeUrl)); g.appendChild(drawLine(nx*w*0.2, ny*w*0.2, w*0.3, "#ffffff", 0.4));
    }
    sceneRoot.appendChild(g);
}

function drawAtom(a, isMobile) {
    const g = createSVG("g");
    const displayColor = (a.elem === "H" && a.color === "#FFFFFF") ? "#FFFFFF" : a.color;
    const cleanColor = a.color.replace('#','');
    const gradUrl = `url(#atom-grad-${cleanColor})`;
    const glow = createSVG("circle");
    glow.setAttribute("cx", a.px); glow.setAttribute("cy", a.py); 
    if (isMobile) {
        glow.setAttribute("r", a.r * a.scale * 1.1); glow.setAttribute("fill", displayColor); glow.setAttribute("opacity", "0.3");
    } else {
        glow.setAttribute("r", a.r * a.scale * 1.3); glow.setAttribute("fill", displayColor); glow.setAttribute("opacity", "0.5"); glow.setAttribute("filter", "url(#soft-glow)");
    }
    g.appendChild(glow);
    const circle = createSVG("circle");
    circle.setAttribute("cx", a.px); circle.setAttribute("cy", a.py); 
    circle.setAttribute("r", a.r * a.scale); circle.setAttribute("fill", gradUrl); 
    g.appendChild(circle);
    const txt = createSVG("text");
    txt.setAttribute("x", a.px); txt.setAttribute("y", a.py); 
    txt.setAttribute("font-size", a.r * 0.75 * a.scale); txt.setAttribute("class", "atom-label-text"); 
    txt.textContent = a.elem; txt.style.fill = "#000000"; txt.style.fontWeight = "900"; txt.style.textShadow = "none";
    g.appendChild(txt);
    sceneRoot.appendChild(g);
}

function drawElectron(e, isMobile) {
    const g = createSVG("g");
    const r = e.r * e.scale * 0.9;
    const glow = createSVG("circle");
    glow.setAttribute("cx", e.px); glow.setAttribute("cy", e.py);
    glow.setAttribute("r", r * 1.5); glow.setAttribute("fill", "#ffffff"); glow.setAttribute("opacity", "0.3");
    if (!isMobile) glow.setAttribute("filter", "url(#soft-glow)");
    g.appendChild(glow);
    const c = createSVG("circle");
    c.setAttribute("cx", e.px); c.setAttribute("cy", e.py);
    c.setAttribute("r", r); c.setAttribute("fill", "#ffffff"); c.setAttribute("opacity", "1"); 
    g.appendChild(c);
    sceneRoot.appendChild(g);
}

function createSVG(type) { return document.createElementNS("http://www.w3.org/2000/svg", type); }

function animate() {
    if (!isDragging) { rotation.x += 0.003; rotation.y += 0.003; }
    renderScene();
    requestAnimationFrame(animate);
}

function setupInteractions() {
    window.addEventListener('keydown', (e) => { if (e.key === 'Alt') altKeyIsDown = true; });
    window.addEventListener('keyup', (e) => { if (e.key === 'Alt') altKeyIsDown = false; });
    document.getElementById("formula-input").addEventListener("keypress", (e) => { if (e.key === "Enter") handleLoadBtn(); });

    const handleStart = (x, y) => { isDragging = true; lastMouse = { x, y }; };
    const handleMove = (x, y) => {
        if (!isDragging) return;
        const dx = x - lastMouse.x, dy = y - lastMouse.y;
        if (currentMode === 1 || (currentMode === 2 && altKeyIsDown)) {
            rotation.y += dx * 0.005; rotation.x -= dy * 0.005;
        } else {
            panOffset.x += dx * 0.5; panOffset.y += dy * 0.5;
        }
        lastMouse = { x, y };
    };

    viewport.addEventListener("mousedown", e => handleStart(e.clientX, e.clientY));
    window.addEventListener("mousemove", e => handleMove(e.clientX, e.clientY));
    window.addEventListener("mouseup", () => isDragging = false);
    viewport.addEventListener("wheel", e => { scale = Math.max(0.5, Math.min(6, scale - e.deltaY * 0.001)); });

    viewport.addEventListener("touchstart", e => {
        if(e.target.closest('.control-button')) return;
        isDragging = true;
        if(e.touches.length === 1) {
            lastMouse = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        } else if (e.touches.length === 2) {
            const t1 = e.touches[0], t2 = e.touches[1];
            lastTouchDist = Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
            lastTouchCenter = { x: (t1.clientX + t2.clientX)/2, y: (t1.clientY + t2.clientY)/2 };
            lastTouchAngle = Math.atan2(t2.clientY - t1.clientY, t2.clientX - t1.clientX);
        }
    }, { passive: false });

    viewport.addEventListener("touchmove", e => {
        if(!isDragging) return;
        e.preventDefault(); 
        if(e.touches.length === 1) {
            const dx = e.touches[0].clientX - lastMouse.x;
            const dy = e.touches[0].clientY - lastMouse.y;
            rotation.y += dx * 0.006; 
            rotation.x -= dy * 0.006;
            lastMouse = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        } else if (e.touches.length === 2) {
            const t1 = e.touches[0], t2 = e.touches[1];
            const center = { x: (t1.clientX + t2.clientX)/2, y: (t1.clientY + t2.clientY)/2 };
            panOffset.x += (center.x - lastTouchCenter.x) * 0.8; 
            panOffset.y += (center.y - lastTouchCenter.y) * 0.8;
            lastTouchCenter = center;
            const dist = Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
            if (lastTouchDist > 0) {
                const zoomDelta = (dist - lastTouchDist) * 0.006; 
                scale = Math.max(0.3, Math.min(8, scale + zoomDelta));
            }
            lastTouchDist = dist;
            const angle = Math.atan2(t2.clientY - t1.clientY, t2.clientX - t1.clientX);
            let angleDelta = angle - lastTouchAngle;
            if (angleDelta > Math.PI) angleDelta -= Math.PI * 2;
            if (angleDelta < -Math.PI) angleDelta += Math.PI * 2;
            rotation.z += angleDelta * 1.2;
            lastTouchAngle = angle;
        }
    }, { passive: false });

    window.addEventListener("touchend", () => isDragging = false);

    const panel = document.getElementById('controls-panel');
    const handle = document.getElementById('mobile-panel-handle');
    
    if(handle && panel) {
        let panelStartY = 0;
        let panelStartTrans = 0; 
        let isPanelDragging = false;
        let animationFrameId = null;
        let currentTransY = 0;

        const getTranslateY = () => {
            const style = window.getComputedStyle(panel);
            const matrix = new WebKitCSSMatrix(style.transform);
            return matrix.m42;
        };

        const updatePosition = () => {
            if(isPanelDragging) {
                panel.style.transform = `translateY(${currentTransY}px)`;
                animationFrameId = requestAnimationFrame(updatePosition);
            }
        };

        handle.addEventListener('touchstart', (e) => {
            isPanelDragging = true;
            panelStartY = e.touches[0].clientY;
            panelStartTrans = getTranslateY();
            panel.style.transition = 'none';
            cancelAnimationFrame(animationFrameId);
            animationFrameId = requestAnimationFrame(updatePosition);
        }, {passive: true});

        window.addEventListener('touchmove', (e) => {
            if(!isPanelDragging) return;
            const currentY = e.touches[0].clientY;
            const deltaY = currentY - panelStartY;
            let newTrans = panelStartTrans + deltaY;
            const panelH = panel.offsetHeight;
            const minTrans = 0; 
            const maxTrans = panelH - 40; 
            if (newTrans < minTrans) newTrans = minTrans + (newTrans - minTrans) * 0.4;
            if (newTrans > maxTrans) newTrans = maxTrans + (newTrans - maxTrans) * 0.4;
            currentTransY = newTrans;
        }, {passive: false});

        window.addEventListener('touchend', (e) => {
            if(!isPanelDragging) return;
            isPanelDragging = false;
            cancelAnimationFrame(animationFrameId);
            panel.style.transition = 'transform 0.35s cubic-bezier(0.25, 1, 0.5, 1)';
            const finalY = currentTransY;
            const panelH = panel.offsetHeight;
            const maxTrans = panelH - 40; 
            const shouldClose = finalY > (maxTrans / 3); 
            if (shouldClose) {
                panel.classList.add('minimized');
                panel.style.transform = ''; 
            } else {
                panel.classList.remove('minimized');
                panel.style.transform = ''; 
            }
        });

        handle.addEventListener('click', (e) => {
            panel.classList.toggle('minimized');
        });
    }
}

window.onload = () => {
    if(Object.keys(MOLECULE_DB).length > 0) {
        // [修正] 預設載入 H2O，避免因 P4O6 資料遺失而當機
        loadMolecule("H2O"); 
    }
    animate();
    setupInteractions();
    
    if(isMobileMode()) {
        const hint = document.getElementById('mobile-hint');
        if(hint) hint.style.display = 'block';
    }
};
</script>
