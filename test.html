<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CHEM STUDIO | 重構版</title>
    
    <style>
        /* --- 1. CSS 變數系統 --- */
        :root {
            /* 顏色系統 */
            --primary-color: #6366f1;
            --primary-light: #818cf8;
            --secondary-color: #a855f7;
            --bg-dark: #0f172a;
            --bg-card: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --accent-cyan: #22d3ee;
            
            /* 玻璃擬態效果 */
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-blur: blur(12px);
            
            /* 佈局參數 */
            --nav-height: 70px;
            --panel-radius: 24px;
            --transition-speed: 0.3s;
        }

        /* --- 2. 基礎樣式重置 --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', -apple-system, system-ui, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden; /* 防止主視窗捲動，由面板自行處理 */
            background-image: radial-gradient(circle at 50% 50%, #1e293b 0%, #0f172a 100%);
        }

        /* --- 3. 主佈局結構 --- */
        .app-container {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        /* 頂部導航欄 */
        .top-nav {
            height: var(--nav-height);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            border-bottom: 1px solid var(--glass-border);
            z-index: 100;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            background: linear-gradient(to right, var(--primary-light), var(--secondary-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* 核心展示區 (3D/SVG) */
        .viewport-section {
            flex: 1;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #main-canvas-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* --- 4. 功能面板 (Panels) --- */
        .side-panel {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 70vh;
            background: var(--bg-card);
            backdrop-filter: var(--glass-blur);
            border-top: 1px solid var(--glass-border);
            border-radius: var(--panel-radius) var(--panel-radius) 0 0;
            transform: translateY(100%); /* 預設隱藏 */
            transition: transform var(--transition-speed) cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 200;
            padding: 24px;
            overflow-y: auto;
        }

        .side-panel.active {
            transform: translateY(0);
        }

        /* 面板頂部控制條 (手機版拖動感) */
        .panel-handle {
            width: 40px;
            height: 4px;
            background: var(--glass-border);
            border-radius: 2px;
            margin: -10px auto 20px;
        }

        /* --- 5. 具體功能組件樣式 --- */
        .card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        input {
            width: 100%;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            padding: 12px;
            color: white;
            outline: none;
        }

        .btn-primary {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: opacity 0.2s;
        }

        /* 底部快速切換欄 */
        .bottom-nav {
            height: 60px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            border-top: 1px solid var(--glass-border);
        }

        .nav-item {
            color: var(--text-dim);
            font-size: 0.8rem;
            text-align: center;
            cursor: pointer;
        }

        .nav-item.active {
            color: var(--primary-light);
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- 頂部導航 -->
        <header class="top-nav">
            <div class="logo">CHEM STUDIO</div>
            <div id="top-status" class="text-dim">氫 (H) - 原子序 1</div>
        </header>

        <!-- 3D 分子/軌域展示區 -->
        <section class="viewport-section">
            <div id="main-canvas-container">
                <!-- SVG 渲染將在此處生成 -->
                <svg id="molecule-svg" width="300" height="300" viewBox="0 0 400 400"></svg>
            </div>
            
            <!-- 浮動資訊卡 (原本的左上角資訊) -->
            <div style="position: absolute; top: 20px; left: 20px;" id="info-overlay">
                <h2 id="element-name">點擊元素開始</h2>
                <p id="element-desc" class="text-dim">選擇下方功能進行探索</p>
            </div>
        </section>

        <!-- 底部切換按鈕 -->
        <nav class="bottom-nav">
            <div class="nav-item active" data-target="panel-explorer">探索</div>
            <div class="nav-item" data-target="panel-balancer">平衡器</div>
            <div class="nav-item" data-target="panel-electron">電子組態</div>
            <div class="nav-item" data-target="panel-fortune">運勢</div>
        </nav>
    </div>

    <!-- 功能面板群 -->
    
    <!-- 1. 方程式平衡器面板 -->
    <div id="panel-balancer" class="side-panel">
        <div class="panel-handle"></div>
        <h3>化學方程式平衡器</h3>
        <div class="card">
            <div class="input-group">
                <input type="text" id="equation-input" placeholder="例如: H2 + O2 = H2O">
            </div>
            <button class="btn-primary" id="btn-solve">開始平衡</button>
            <div id="balancer-result" style="margin-top: 20px;"></div>
        </div>
    </div>

    <!-- 2. 電子組態面板 -->
    <div id="panel-electron" class="side-panel">
        <div class="panel-handle"></div>
        <h3>電子組態與軌域</h3>
        <div id="electron-content">
            <!-- 內容由 JS 動態生成 -->
        </div>
    </div>

    <!-- 3. 元素運勢面板 -->
    <div id="panel-fortune" class="side-panel">
        <div class="panel-handle"></div>
        <h3>🔮 每日元素運勢</h3>
        <div id="fortune-card" class="card">
            <p id="fortune-text">載入中...</p>
        </div>
    </div>

    <script>
        /**
 * UI 核心管理器 - 處理面板切換與手勢控制
 */
const UIManager = (() => {
    // 獲取 DOM 元素
    const navItems = document.querySelectorAll('.nav-item');
    const panels = document.querySelectorAll('.side-panel');
    const viewport = document.querySelector('.viewport-section');
    
    let touchStartY = 0;

    /**
     * 初始化事件監聽
     */
    const init = () => {
        // 1. 底部導航點擊事件
        navItems.forEach(item => {
            item.addEventListener('click', (e) => {
                const targetId = item.getAttribute('data-target');
                handleNavigation(targetId, item);
            });
        });

        // 2. 點擊 3D 展示區自動收起面板
        viewport.addEventListener('click', () => {
            closeAllPanels();
        });

        // 3. 手勢支援：向下滑動面板關閉
        initGestureControl();

        console.log("UI Manager Initialized.");
    };

    /**
     * 處理導航邏輯
     */
    const handleNavigation = (targetId, clickedNavItem) => {
        // 如果點擊的是 "探索" (原本的主畫面)
        if (targetId === 'panel-explorer') {
            closeAllPanels();
            updateNavState(clickedNavItem);
            return;
        }

        const targetPanel = document.getElementById(targetId);
        
        // 如果該面板已經是開啟狀態，則關閉它
        if (targetPanel && targetPanel.classList.contains('active')) {
            closeAllPanels();
        } else {
            openPanel(targetId);
            updateNavState(clickedNavItem);
        }
    };

    /**
     * 開啟指定面板
     */
    const openPanel = (id) => {
        closeAllPanels(false); // 先隱藏其他面板，但不重置 nav 狀態
        const panel = document.getElementById(id);
        if (panel) {
            panel.classList.add('active');
        }
    };

    /**
     * 關閉所有面板
     * @param {boolean} resetNav - 是否同時重置導航欄狀態
     */
    const closeAllPanels = (resetNav = true) => {
        panels.forEach(p => p.classList.remove('active'));
        
        if (resetNav) {
            const explorerNav = document.querySelector('[data-target="panel-explorer"]');
            updateNavState(explorerNav);
        }
    };

    /**
     * 更新導航列的 active 狀態
     */
    const updateNavState = (activeItem) => {
        navItems.forEach(item => item.classList.remove('active'));
        if (activeItem) {
            activeItem.classList.add('active');
        }
    };

    /**
     * 觸控手勢邏輯 - 下滑關閉面板
     */
    const initGestureControl = () => {
        panels.forEach(panel => {
            // 記錄手指觸碰位置
            panel.addEventListener('touchstart', (e) => {
                touchStartY = e.touches[0].clientY;
            }, { passive: true });

            // 偵測滑動結束
            panel.addEventListener('touchend', (e) => {
                const touchEndY = e.changedTouches[0].clientY;
                const swipeDistance = touchEndY - touchStartY;

                // 如果下滑距離超過 100px，關閉面板
                if (swipeDistance > 100) {
                    closeAllPanels();
                }
            }, { passive: true });
        });
    };

    // 公開方法
    return {
        init,
        closeAllPanels,
        openPanel
    };
})();

// 當 DOM 載入完成後執行
document.addEventListener('DOMContentLoaded', () => {
    UIManager.init();
});
    
    </script>
    
</body>
</html>
