name: Update Metal Prices
on:
  schedule:
    - cron: '0 */4 * * *' # 每 4 小時自動更新一次
  workflow_dispatch:      # 允許手動點擊執行

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Fetch Prices
        run: |
          # 抓取資料 (確保每個指令都正確執行)
          curl -H "x-access-token: ${{ secrets.GOLD_API_KEY }}" "https://www.goldapi.io/api/XAU/USD" -o gold.json
          curl -H "x-access-token: ${{ secrets.GOLD_API_KEY }}" "https://www.goldapi.io/api/XAG/USD" -o silver.json
          curl -H "x-access-token: ${{ secrets.GOLD_API_KEY }}" "https://www.goldapi.io/api/XCU/USD" -o copper.json
          
          # 整合進 prices.json (修正逗點與括號)
          echo "{" > prices.json
          echo "  \"Au\": $(cat gold.json)," >> prices.json
          echo "  \"Ag\": $(cat silver.json)," >> prices.json
          echo "  \"Cu\": $(cat copper.json)" >> prices.json
          echo "}" >> prices.json

      - name: Commit and Push
        run: |
          git config --global user.name "Price Bot"
          git config --global user.email "bot@github.com"
          git add prices.json
          git commit -m "Update prices: $(date)" || exit 0
          git push
