<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高階量子焰色實驗室 - S96/S33</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --hud-cyan: #00f2ff;
            --hud-amber: #ffb700;
            --bg-dark: #020617;
            --panel-glass: rgba(15, 23, 42, 0.95);
            --text-main: #e2e8f0;
            --glow: 0 0 20px rgba(0, 242, 255, 0.4);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0;
            background: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Rajdhani', 'Microsoft JhengHei', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            height: 70px;
            padding: 0 30px;
            background: rgba(0, 242, 255, 0.05);
            border-bottom: 2px solid var(--hud-cyan);
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(10px);
            z-index: 100;
        }

        .system-title {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 4px;
            text-shadow: var(--glow);
            color: #fff;
        }

        /* 電腦版離子名稱位置 */
        .ion-info-display {
            position: absolute;
            top: 40px;
            right: 40px;
            text-align: right;
            z-index: 50;
        }

        #target-name {
            font-size: 4rem;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 0 10px rgba(0,0,0,0.8);
        }

        .wavelength-label {
            color: #fff !important; 
            font-size: 1.1rem !important; 
            font-weight: 700;
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
        }

        .info-btn {
            cursor: pointer;
            font-size: 0.9rem;
            color: var(--hud-cyan);
            border: 1px solid var(--hud-cyan);
            border-radius: 50%;
            width: 22px; height: 22px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
            font-family: 'serif';
            font-style: italic;
            font-weight: bold;
            flex-shrink: 0;
        }

        #cobalt-popup {
            display: none;
            position: fixed;
            left: 50% !important;
            top: 50% !important;
            transform: translate(-50%, -50%);
            width: 320px;
            background: #0f172a;
            border: 2px solid var(--hud-cyan);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
            z-index: 2000;
        }

        #popup-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1999;
            background: transparent;
        }

        .main-layout { display: flex; flex: 1; overflow: hidden; }

        .side-panel {
            width: 380px;
            background: var(--panel-glass);
            border-right: 2px solid rgba(0, 242, 255, 0.2);
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 25px;
            overflow-y: auto;
        }

        .viewport {
            flex: 1;
            position: relative;
            background: radial-gradient(circle at center, #1e293b 0%, #020617 100%);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .data-panel {
            width: 420px;
            background: var(--panel-glass);
            border-left: 2px solid rgba(0, 242, 255, 0.2);
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
        }

        .hud-card {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(0, 242, 255, 0.3);
            padding: 20px;
            position: relative;
            flex-shrink: 0;
        }

        .card-label {
            font-size: 1.1rem;
            color: var(--hud-cyan);
            font-weight: 700;
            margin-bottom: 15px;
            border-left: 4px solid var(--hud-cyan);
            padding-left: 10px;
        }

        .ion-matrix { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .s33-btn {
            background: linear-gradient(145deg, #2d3748, #1a202c);
            border: 1px solid rgba(255,255,255,0.2);
            padding: 18px 10px;
            border-radius: 8px;
            color: #fff;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
        }
        .s33-btn:hover, .s33-btn.active {
            background: var(--hud-cyan); color: #000;
            box-shadow: var(--glow); border-color: #fff;
        }

        .bunsen-burner { position: relative; width: 160px; height: 320px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; margin-top: 80px; }
        .chimney { width: 28px; height: 160px; background: linear-gradient(90deg, #475569, #cbd5e1, #475569); border-radius: 2px 2px 0 0; z-index: 5; border: 1px solid rgba(0,0,0,0.3); }
        .air-collar { width: 34px; height: 32px; background: #334155; margin-top: -2px; z-index: 6; display: flex; justify-content: center; align-items: center; gap: 4px; border-radius: 2px; }
        .air-hole { width: 8px; height: 18px; background: #000; border-radius: 4px; }
        .burner-stem { width: 18px; height: 30px; background: #1e293b; margin-top: -2px; z-index: 4; }
        .base { width: 150px; height: 18px; background: #0f172a; border-radius: 75px 75px 4px 4px; z-index: 3; border-bottom: 4px solid #000; }
        .gas-inlet-tube { position: absolute; bottom: 15px; right: -50px; width: 60px; height: 10px; background: #334155; border-radius: 5px; z-index: 2; }

        .flame-vfx {
            position: absolute; bottom: 220px; left: 50%; transform: translateX(-50%);
            width: 45px; height: 150px; 
            border-radius: 50% 50% 35% 35% / 60% 60% 40% 40%;
            mix-blend-mode: screen; pointer-events: none; filter: blur(6px);
            transition: all 0.2s ease-out;
            animation: flame-wiggle 0.15s infinite alternate ease-in-out, flame-pulse 0.8s infinite alternate ease-in-out;
        }
        .flame-inner { 
            position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
            width: 40%; height: 50%; 
            background: linear-gradient(to top, #fff, transparent);
            border-radius: 50%; opacity: 0.8; filter: blur(2px);
        }
        @keyframes flame-wiggle {
            0% { transform: translateX(-51%) scaleX(1) skewX(0deg); }
            100% { transform: translateX(-49%) scaleX(1.02) skewX(1deg); }
        }
        @keyframes flame-pulse {
            from { transform: translateX(-50%) scaleX(1) scaleY(1); opacity: 0.85; }
            to { transform: translateX(-50%) scaleX(1.08) scaleY(1.05); opacity: 1; }
        }

        .spectrum-container { position: relative; width: 100%; height: 100%; display: flex; flex-direction: column; }
        .spectrum-labels { display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 0.85rem; font-weight: 700; color: #aaa; text-transform: uppercase; letter-spacing: 1px; }
        .label-uv { color: #a855f7; width: 22.5%; text-align: center; border-bottom: 2px solid #a855f7; padding-bottom: 2px; }
        .label-vis { color: #22c55e; width: 50%; text-align: center; border-bottom: 2px solid #22c55e; padding-bottom: 2px; }
        .label-ir { color: #ef4444; width: 27.5%; text-align: center; border-bottom: 2px solid #ef4444; padding-bottom: 2px; }
        .spectrum-bg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0.4;
            background: linear-gradient(to right, #000 0%, #2e003e 15%, #4b0082 22.5%, #0000ff 31.25%, #00ff00 41.25%, #ffff00 47.5%, #ff7700 52.5%, #ff0000 62.5%, #3f0000 75%, #000 100%);
        }
        .spectrum-ui { width: 100%; height: 50px; background: #000; border: 2px solid #334155; position: relative; }
        .line-marker { position: absolute; width: 2px; height: 100%; box-shadow: 0 0 15px currentColor; z-index: 10; }

        @media (max-width: 1024px) {
            body { height: 100vh; overflow: hidden; }
            .header { height: 50px; padding: 0 10px; }
            .header .system-title { font-size: 1rem; letter-spacing: 1px; }
            .header div:last-child { display: none; } 

            .main-layout { 
                display: grid !important; 
                grid-template-columns: 170px 1fr; 
                grid-template-rows: 1fr 185px; 
            }
            
            .side-panel { grid-column: 1; grid-row: 1; width: 100% !important; border-right: 1px solid rgba(0,242,255,0.2); padding: 10px 5px !important; gap: 12px !important; }
            .side-panel .hud-card { padding: 8px; }
            .side-panel .ion-matrix { grid-template-columns: 1fr; gap: 5px; }
            .s33-btn { padding: 8px 2px; font-size: 0.85rem; }
            
            .viewport { grid-column: 2; grid-row: 1; position: relative !important; align-items: flex-end; }
            .bunsen-burner { transform: scale(0.65); transform-origin: center bottom; margin-bottom: 20px; }

            /* 手機版：離子名稱鎖定右上角紅框位置 */
            .ion-info-display {
                top: 10px !important;
                right: 15px !important;
                position: absolute !important;
            }
            #target-name { font-size: 1.4rem !important; text-shadow: 0 0 10px #000; white-space: nowrap; }
            
            .data-panel { 
                grid-column: 1 / span 2; grid-row: 2;
                width: 100% !important; border-top: 1px solid rgba(0,242,255,0.2);
                padding: 10px !important; flex-direction: row !important; 
                overflow-x: auto !important; gap: 12px !important; background: #000;
            }
            
            /* 手機版卡片：寬度優化與數據直排 */
            .data-panel .hud-card { 
                flex: 0 0 200px !important; width: 200px !important; 
                padding: 12px 10px !important; display: flex !important; flex-direction: column !important;
            }
            .data-panel .hud-card .data-grid { 
                display: flex !important; flex-direction: column !important; gap: 5px !important; 
            }
            .data-panel .hud-card div { color: #fff !important; opacity: 1 !important; } 
            
            #bottom-spectra { height: 115px !important; padding: 10px !important; }
            .wavelength-label { font-size: 0.8rem !important; }
        }
    </style>
</head>

<body>
<div class="header">
    <div class="system-title">QUANTUM FLAME CORE</div>
    <div style="font-size: 0.85rem; color: #888; letter-spacing: 2px; font-weight: 600; text-transform: uppercase;">Spectroscopic Analysis System</div>
</div>
<div class="main-layout">
    <div class="side-panel" id="controls"></div>
    <div class="viewport" id="stage"></div>
    <div class="data-panel" id="analytics"></div>
</div>
<div id="bottom-spectra" style="height: 180px; border-top: 2px solid var(--hud-cyan); background: #070b14; padding: 25px; flex-shrink: 0;"></div>

<script>
    // 注入 UI - 左側控制面板 (優化結構)
    document.getElementById('controls').innerHTML = `
        <div class="hud-card">
            <div class="card-label" style="font-size:0.85rem;">儀器調節<br><small>Controls</small></div>
            <div style="margin-bottom:12px;">
                <label style="color:var(--hud-cyan); font-size:0.95rem;">燃料流量<br><small>(Fuel)</small></label>
                <input type="range" id="gasRange" style="width:100%; accent-color:var(--hud-cyan);" min="0" max="100" value="70">
            </div>
            <div style="margin-bottom:12px;">
                <label style="color:var(--hud-cyan); font-size:0.95rem;">空氣混合<br><small>(Air)</small></label>
                <input type="range" id="airRange" style="width:100%; accent-color:var(--hud-cyan);" min="0" max="100" value="80">
            </div>
            <!-- 鈷玻璃：兩行式排版修正 -->
            <div style="background:rgba(0,100,255,0.1); padding:10px; border-radius:4px; display:flex; flex-direction:column; gap:8px;">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <span style="font-size:0.95rem; color:#8bafff; font-weight:bold;">鈷玻璃濾光</span>
                    <div class="info-btn" onclick="togglePopup(event)" style="margin:0;">i</div>
                </div>
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <small style="color:#8bafff; opacity:0.8; font-family:sans-serif;">(Cobalt Glass)</small>
                    <input type="checkbox" id="cobaltGlass" style="width:18px; height:18px; cursor:pointer; margin:0;" onchange="updateFlame(window.currentIon)">
                </div>
            </div>
        </div>
        <div class="hud-card">
            <div class="card-label">離子試劑選取 (Ion Matrix)</div>
            <div class="ion-matrix">
                <button class="s33-btn" onclick="selectIon('Li')">Li⁺ 鋰</button>
                <button class="s33-btn" onclick="selectIon('Na')">Na⁺ 鈉</button>
                <button class="s33-btn" onclick="selectIon('K')">K⁺ 鉀</button>
                <button class="s33-btn" onclick="selectIon('Ca')">Ca²⁺ 鈣</button>
                <button class="s33-btn" onclick="selectIon('Sr')">Sr²⁺ 鍶</button>
                <button class="s33-btn" onclick="selectIon('Ba')">Ba²⁺ 鋇</button>
                <button class="s33-btn" onclick="selectIon('Cu')">Cu²⁺ 銅</button>
                <button class="s33-btn" onclick="selectIon('Mg')">Mg²⁺ 鎂</button>
                <button class="s33-btn" onclick="selectIon('Rb')">Rb⁺ 銣</button>
                <button class="s33-btn" onclick="selectIon('Cs')">Cs⁺ 銫</button>
                <button class="s33-btn" onclick="selectIon('In')">In³⁺ 銦</button>
                <button class="s33-btn" onclick="selectIon('B')">B³⁺ 硼</button>
            </div>
        </div>
    `;

    // 注入 UI - 中央視圖 (本生燈與離子名稱容器)
    document.getElementById('stage').innerHTML = `
        <div class="bunsen-burner" id="burner-container">
            <div id="active-flame" class="flame-vfx">
                <div id="inner-cone" class="flame-inner"></div>
            </div>
            <div class="chimney"></div>
            <div class="air-collar"><div class="air-hole"></div><div class="air-hole"></div></div>
            <div class="burner-stem"></div>
            <div class="base"></div>
            <div class="gas-inlet-tube"></div>
        </div>
        <div class="ion-info-display">
            <div id="target-name">待機中</div>
            <div id="target-symbol" style="display:none;"></div>
        </div>
    `;
</script>

<script>
    const ION_DB = {
        'Li': { name: '鋰離子', sym: 'Li⁺', color: '#ff0055', lines: [670.8], app: '常見於紅色特效煙火、求救信號彈，是提供純淨紅色的主要來源。', theory: '電子從能階 2p 回歸 2s 基態時，釋放特定能量的紅光輻射。', synthesis: '譜線單一且集中在紅光區段，因此不論光強弱，呈現出的顏色都非常穩定且鮮紅樣式。' },
        'Na': { name: '鈉離子', sym: 'Na⁺', color: '#ffcc00', lines: [589.0, 589.6], app: '金黃色特效煙火，以及穿透霧氣能力強的高壓鈉燈發光源。', theory: '著名的 D 譜線輻射，電子於能階 3p 與 3s 軌域間躍遷釋放強烈光能。', synthesis: '譜線強度極高且人眼對此黃光極為敏感，故其顯色具有極強的主導性。' },
        'K': { name: '鉀離子', sym: 'K⁺', color: '#d8b2ff', lines: [404.4, 766.5], app: '紫色特效煙火、化學實驗室中鑑定鉀鹽化合物的重要特徵依據。', theory: '電子受激後同時在短波紫光與長波紅光能階釋放混合輻射。', synthesis: '由紫與紅光混合而成，因黃光雜質干擾大，需透過藍色鈷玻璃濾光觀察其淺紫色。' },
        'Ca': { name: '鈣離子', sym: 'Ca²⁺', color: '#ff8844', lines: [422.7, 616.2, 622.0], app: '橙紅色煙火發色藥劑、特殊救難用橙色信號照明。', theory: '激發態電子回歸基態時，釋放出涵蓋紫、橙、紅等多個波段的光子。', synthesis: '雖然光譜中包含 422.7nm 的紫光線，但因其強度遠低於 610nm 以上的強烈橙紅輻射，紫光被淹沒在背景中，人眼最終判定為磚紅色。' },
        'Sr': { name: '鍶離子', sym: 'Sr²⁺', color: '#ff3300', lines: [407.7, 460.7, 606.3, 662.8], app: '高品質深紅色煙火、鐵路安全標示紅燈與航海求救信號。', theory: '電子躍遷產生多條譜線，其中位於深紅光區的輻射具有極高強度。', synthesis: '光譜包含藍與紫色譜線，但鍶在深紅區（600nm以上）發射密度極高，視覺合成後呈現比鋰更飽滿、明亮的深紅色。' },
        'Rb': { name: '銣離子', sym: 'Rb⁺', color: '#e600ff', lines: [420.2, 780.0, 794.8], app: '特殊紫色火焰特效、科學研究中的光譜頻率標準。', theory: '能階躍遷包含紅光與多條高能藍紫光譜線樣式。', synthesis: '光譜中包含豐富的短波紫光成分，使最終合成的焰色比鉀離子更具飽滿感與層次。' },
        'Cs': { name: '銫離子', sym: 'Cs⁺', color: '#2e9aff', lines: [455.5, 459.3, 852.1, 894.3], app: '特殊藍色火焰特效、高階物理實驗室的光譜分析樣品。', theory: '特徵譜線精準分布於藍光區以及不可見的近紅外光區。', synthesis: '特徵輻射強烈落在 450nm 附近的藍光頻段，呈現冷艷的藍色焰色。' },
        'Ba': { name: '鋇離子', sym: 'Ba²⁺', color: '#ccff33', lines: [455.4, 493.4, 553.5], app: '綠色煙火的核心發色劑、軍用綠色信號照明彈。', theory: '電子回歸基態時發射波長約 553nm 的光，位於黃綠色交界。', synthesis: '光譜能量集中在視覺敏感的黃綠光波段，呈現如青蘋果般的嫩綠色。' },
        'Cu': { name: '銅離子', sym: 'Cu²⁺', color: '#00ffcc', lines: [510.5, 521.8, 578.2], app: '藍綠色煙火特效，以及化學鑑定分析中判斷銅鹽的特徵依據。', theory: '能階跳遷所產生的多條譜線落於藍光與綠光的過渡波段。', synthesis: '由於同時發射藍與綠兩個波段的能量，人眼混合信號後呈現明顯的青綠色視覺。' },
        'Mg': { name: '鎂離子', sym: 'Mg²⁺', color: 'rgba(255,255,255,0.1)', lines: [285.2], app: '化學系統性分析鑑定，利用其無焰色特性排除其他鹼土金屬干擾。', theory: '鎂離子的主要輻射光譜波長在紫外區，肉眼無法感知。', synthesis: '特徵輻射完全落在 380nm 以下的紫外光區，因此實驗中呈現無色。' },
        'In': { name: '銦離子', sym: 'In³⁺', color: '#4b0082', lines: [410.2, 451.1], app: '特殊靛藍色煙火特效、半導體光學特徵分析鑑定。', theory: '電子受激釋放出兩條極強的 410nm 與 451nm 短波能量。', synthesis: '能量高度集中在深藍色與紫色譜線，形成極具科技感的靛藍色焰色。' },
        'B': { name: '硼離子', sym: 'B³⁺', color: '#00ff00', lines: [518.0, 521.0, 546.0], app: '高品質綠色火焰特效、特種防護標示與科研發色燃料。', theory: '硼化合物在高溫下釋放出多條密集的特徵綠光輻射帶。', synthesis: '光譜能量精準落在綠光的核心頻率，呈現比鋇離子更具飽和度的純綠色。' }
    };

    function nmToRGB(nm) {
        if (nm < 380) return "#a78bfa";
        if (nm > 780) return "#7f1d1d";
        let r, g, b;
        if (nm < 440) { r = -(nm-440)/60; g = 0; b = 1; }
        else if (nm < 490) { r = 0; g = (nm-440)/50; b = 1; }
        else if (nm < 510) { r = 0; g = 1; b = -(nm-510)/20; }
        else if (nm < 580) { r = (nm-510)/70; g = 1; b = 0; }
        else if (nm < 645) { r = 1; g = -(nm-645)/65; b = 0; }
        else { r = 1; g = 0; b = 0; }
        return `rgb(${r*255}, ${g*255}, ${b*255})`;
    }

    function selectIon(key) {
        const ion = ION_DB[key];
        window.currentIon = ion;
        document.querySelectorAll('.s33-btn').forEach(b => b.classList.remove('active'));
        if (event && event.target.classList.contains('s33-btn')) event.target.classList.add('active');

        document.getElementById('target-name').innerText = ion.name;

        let html = `<div class="card-label">光譜數據分析 (Data Analytics)</div>`;
        ion.lines.forEach(nm => {
            const energy = (1240 / nm).toFixed(3);
            const freq = (3.0e8 / (nm * 1e-9) / 1e12).toFixed(1);
            const color = nmToRGB(nm);
            let region = nm < 380 ? "UV" : (nm > 780 ? "IR" : "VIS");
            html += `
                <div class="hud-card" style="background: #000; border-left: 4px solid ${color}; border-top: 1px solid rgba(255,255,255,0.1); flex-shrink: 0;">
                    <div style="font-size:1.1rem; color:${color}; font-weight:bold; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; white-space:nowrap;">
                        <span>λ = ${nm} nm</span>
                        <span style="font-size:0.65rem; border:1px solid ${color}; padding:0px 3px; border-radius:2px;">${region}</span>
                    </div>
                    <div class="data-grid" style="font-size:0.85rem; display:flex; flex-direction:column; gap:5px; color: #fff; line-height:1.4;">
                        <div>能量: ${energy} eV</div>
                        <div>頻率: ${freq} THz</div>
                        <div style="color:${color}; filter:brightness(1.8); opacity:1; font-weight:bold;">波數: ${Math.round(1/(nm*1e-7))} cm⁻¹</div>
                    </div>
                </div>`;
        });
        
        html += `
        <div class="hud-card" style="background: #000; border: 1px solid rgba(0, 242, 255, 0.3); flex-shrink: 0; width: 280px;">
            <div class="card-label" style="font-size:1rem; color: var(--hud-cyan);">顯色原理</div>
            <div style="font-size:1rem; color:#eee; line-height:1.6; text-align:justify;">${ion.synthesis} ${ion.theory}</div>
        </div>
        <div class="hud-card" style="background: #000; border: 1px solid rgba(0, 242, 255, 0.3); flex-shrink: 0; width: 280px;">
            <div class="card-label" style="font-size:1rem; color: var(--hud-cyan);">焰色應用</div>
            <div style="font-size:1rem; color:#eee; line-height:1.6;">${ion.app}</div>
        </div>`;
        
        document.getElementById('analytics').innerHTML = html;

        const bar = document.getElementById('bottom-spectra');
        bar.innerHTML = `
            <div class="spectrum-container">
                <div class="spectrum-labels"><div class="label-uv">Ultraviolet (UV)</div><div class="label-vis">Visible Light</div><div class="label-ir">Infrared (IR)</div></div>
                <div class="spectrum-ui"><div class="spectrum-bg"></div><div id="lines-layer" style="position:absolute; width:100%; height:100%; top:0; left:0;"></div></div>
                <div style="display:flex; justify-content:space-between; margin-top:12px; padding: 0 5px;">
                    <span class="wavelength-label">200nm</span><span class="wavelength-label">400nm</span><span class="wavelength-label">600nm</span><span class="wavelength-label">800nm</span><span class="wavelength-label">1000nm</span>
                </div>
            </div>`;
            
        const layer = document.getElementById('lines-layer');
        ion.lines.forEach(nm => {
            const line = document.createElement('div');
            line.className = 'line-marker';
            line.style.left = `${((nm-200)/800)*100}%`;
            line.style.color = nmToRGB(nm);
            line.style.backgroundColor = "currentColor";
            line.style.boxShadow = `0 0 8px #fff, 0 0 15px currentColor`;
            layer.appendChild(line);
        });

        updateFlame(ion);
    }

    
    function updateFlame(ion) {
        if (!ion) return;
        const gas = parseInt(document.getElementById('gasRange').value);
        const air = parseInt(document.getElementById('airRange').value);
        const cobalt = document.getElementById('cobaltGlass').checked;
        const f = document.getElementById('active-flame');
        const inner = document.getElementById('inner-cone');
        
        if(gas < 5) { f.style.opacity = 0; return; }
        f.style.opacity = 1;
        
        // 火焰物理形狀計算
        const height = 60 + gas * 2.5 - air * 0.8;
        const width = 55 - air * 0.25;
        f.style.height = `${Math.max(60, height)}px`;
        f.style.width = `${Math.max(20, width)}px`;

        // 內錐形 (Inner Cone) 邏輯
        if (air > 25) {
            inner.style.opacity = (air - 20) / 80;
            inner.style.height = `${Math.min(height * 0.7, 20 + air * 0.6)}px`;
            inner.style.background = `linear-gradient(to top, #00f2ff, rgba(0,242,255,0))`;
        } else { inner.style.opacity = 0; }

        let coreColor, glowColor, outerColor;
        // 低空氣混合：擴散火焰 (黃色)
        if (air < 45) {
            const yellowIntensity = (45 - air) / 45;
            coreColor = `rgba(255, ${160 + air}, 50, 0.9)`;
            glowColor = `rgba(255, 100, 0, ${0.5 + yellowIntensity*0.5})`;
            outerColor = `rgba(255, 140, 0, ${0.3 + yellowIntensity*0.4})`;
            f.style.filter = 'blur(6px) contrast(1.2)';
        } 
        // 高空氣混合：預混火焰 (特徵焰色)
        else {
            coreColor = `rgba(180, 220, 255, 0.4)`;
            glowColor = `rgba(0, 150, 255, 0.2)`;
            outerColor = `rgba(0, 100, 255, 0.1)`;
            f.style.filter = 'blur(4px) contrast(1.5)';
            
            if (ion && gas > 15) {
                let ionColor = ion.color;
                if (cobalt) {
                    if (ion.sym.includes('Na')) {
                        ionColor = 'transparent'; // 鈷玻璃濾除鈉黃光
                    } else if (ion.sym.includes('K')) {
                        ionColor = '#a020f0'; // 鈷玻璃下呈現深紫色
                    } else {
                        ionColor = `color-mix(in srgb, ${ionColor}, blue 40%)`;
                    }
                }
                glowColor = ionColor; outerColor = ionColor;
                if (ion.sym.includes('Na') && !cobalt) coreColor = ionColor;
            }
        }
        f.style.background = `radial-gradient(ellipse at bottom, ${coreColor} 0%, ${outerColor} 50%, rgba(0,0,0,0) 90%)`;
        f.style.boxShadow = `0 -10px 40px ${glowColor}, 0 0 20px ${glowColor}`;
    }

    // 事件監聽：調節桿即時連動
    document.getElementById('gasRange').addEventListener('input', () => updateFlame(window.currentIon));
    document.getElementById('airRange').addEventListener('input', () => updateFlame(window.currentIon));

    // 鈷玻璃說明彈窗功能
    const popupDiv = document.createElement('div');
    popupDiv.innerHTML = `
        <div id="popup-overlay" onclick="closePopup()"></div>
        <div id="cobalt-popup">
            <div style="color:var(--hud-cyan); font-size:1.2rem; margin-bottom:15px; display:flex; align-items:center; gap:10px;">
                <span style="font-size:1.5rem;">💡</span> 鈷玻璃作用
            </div>
            <div style="color:#f1f5f9; font-size:1rem; line-height:1.6; margin-bottom:15px;">
                1. 濾除黃光干擾：鈉離子 (Na⁺) 的黃光能量極強，即便只有微量雜質也會遮蓋其他焰色。<br><br>
                2. 觀測特定離子：藍色玻璃能吸收 589nm 的黃光，讓您能清晰觀察到如鉀離子 (K⁺) 的淺紫色。
            </div>
            <button style="width:100%; padding:10px; background:rgba(0,242,255,0.1); border:1px solid var(--hud-cyan); color:var(--hud-cyan); border-radius:6px; cursor:pointer; font-weight:bold;" onclick="closePopup()">關閉說明</button>
        </div>
    `;
    document.body.appendChild(popupDiv);

    window.togglePopup = function(e) { 
        e.stopPropagation(); 
        document.getElementById('cobalt-popup').style.display = 'block'; 
        document.getElementById('popup-overlay').style.display = 'block'; 
    };
    window.closePopup = function() { 
        document.getElementById('cobalt-popup').style.display = 'none'; 
        document.getElementById('popup-overlay').style.display = 'none'; 
    };

    // 啟動系統
    window.onload = () => selectIon('Na');
</script>
</body>
</html>
