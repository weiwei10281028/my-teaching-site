<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高階量子焰色實驗室 - S96/S33</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --hud-cyan: #00f2ff;
            --hud-amber: #ffb700; /* 新增琥珀金，提升數據判讀性 */
            --bg-dark: #020617;
            --panel-glass: rgba(15, 23, 42, 0.95);
            --text-main: #e2e8f0;
            --glow: 0 0 20px rgba(0, 242, 255, 0.4);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0;
            background: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Rajdhani', 'Microsoft JhengHei', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- 頂部導航欄 --- */
        .header {
            height: 70px;
            padding: 0 30px;
            background: rgba(0, 242, 255, 0.05);
            border-bottom: 2px solid var(--hud-cyan);
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(10px);
            z-index: 100;
        }

        .system-title {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 4px;
            text-shadow: var(--glow);
            color: #fff;
        }

        /* 強化底部波長標籤：白色、大字、具陰影 */
        .wavelength-label {
            color: #fff !important; 
            font-size: 1.1rem !important; 
            font-weight: 700;
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
        }

        @media (max-width: 600px) {
            .wavelength-label { font-size: 0.8rem !important; }
        }

        /* --- 修正：側邊說明欄樣式 --- */
        .info-btn {
            cursor: pointer;
            font-size: 0.9rem;
            color: var(--hud-cyan);
            border: 1px solid var(--hud-cyan);
            border-radius: 50%;
            width: 22px;
            height: 22px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-left: 10px;
            transition: 0.3s;
            font-family: 'serif';
            font-style: italic;
            font-weight: bold;
            line-height: 1; /* 修正 i 置中問題 */
            vertical-align: middle;
        }

        /* 說明欄容器 (移除霧化，改為局部顯示) */
        #cobalt-popup {
            display: none;
            position: absolute;
            left: 390px; /* 出現在側邊欄右側 */
            top: 150px;
            width: 320px;
            background: #0f172a;
            border: 2px solid var(--hud-cyan);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
            z-index: 2000;
        }

        /* 全螢幕透明遮罩 (用來偵測「點擊外部關閉」) */
        #popup-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1999;
            background: transparent;
        }

        /* --- 主佈局區 --- */
        .main-layout {
            display: flex;
            flex: 1;
            overflow: hidden; /* 防止整體頁面滾動 */
        }

        /* 側邊控制面板 */
        .side-panel {
            width: 380px;
            background: var(--panel-glass);
            border-right: 2px solid rgba(0, 242, 255, 0.2);
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 25px;
            overflow-y: auto; /* 允許內容多時滾動 */
        }

        /* 中央觀察區 */
        .viewport {
            flex: 1;
            position: relative;
            background: radial-gradient(circle at center, #1e293b 0%, #020617 100%);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 右側數據面板 (修復無法顯示完整的 bug) */
        .data-panel {
            width: 420px;
            background: var(--panel-glass);
            border-left: 2px solid rgba(0, 242, 255, 0.2);
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto; /* 關鍵修改：允許垂直滾動 */
        }

        /* 自定義滾動條樣式 (Cyberpunk 風格) */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.3); }
        ::-webkit-scrollbar-thumb { background: var(--hud-cyan); border-radius: 3px; }

        /* HUD 卡片樣式 */
        .hud-card {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(0, 242, 255, 0.3);
            padding: 20px;
            position: relative;
            flex-shrink: 0; /* 防止被壓縮 */
        }

        .card-label {
            font-size: 1.1rem;
            color: var(--hud-cyan);
            font-weight: 700;
            margin-bottom: 15px;
            border-left: 4px solid var(--hud-cyan);
            padding-left: 10px;
        }

        /* S33 按鈕 */
        .ion-matrix { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .s33-btn {
            background: linear-gradient(145deg, #2d3748, #1a202c);
            border: 1px solid rgba(255,255,255,0.2);
            padding: 18px 10px;
            border-radius: 8px;
            color: #fff;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
        }
        .s33-btn:hover, .s33-btn.active {
            background: var(--hud-cyan);
            color: #000;
            box-shadow: var(--glow);
            border-color: #fff;
        }

        /* 本生燈與火焰 */
        .bunsen-burner { position: relative; width: 160px; height: 320px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; margin-top: 80px; }
        .chimney { width: 28px; height: 160px; background: linear-gradient(90deg, #475569, #cbd5e1, #475569); border-radius: 2px 2px 0 0; z-index: 5; border: 1px solid rgba(0,0,0,0.3); }
        .air-collar { width: 34px; height: 32px; background: #334155; margin-top: -2px; z-index: 6; display: flex; justify-content: center; align-items: center; gap: 4px; border-radius: 2px; }
        .air-hole { width: 8px; height: 18px; background: #000; border-radius: 4px; }
        .burner-stem { width: 18px; height: 30px; background: #1e293b; margin-top: -2px; z-index: 4; }
        .base { width: 150px; height: 18px; background: #0f172a; border-radius: 75px 75px 4px 4px; z-index: 3; border-bottom: 4px solid #000; }
        .gas-inlet-tube { position: absolute; bottom: 15px; right: -50px; width: 60px; height: 10px; background: #334155; border-radius: 5px; z-index: 2; }

        /* 標籤優化 (防遮擋) */
        .burner-label { 
            position: absolute; 
            color: var(--hud-cyan); 
            font-size: 0.95rem; 
            border-left: 2px solid var(--hud-cyan); 
            padding: 2px 8px; 
            background: rgba(0,0,0,0.7); /* 增加黑色背景增強可讀性 */
            opacity: 0; transition: 0.4s; pointer-events: none; white-space: nowrap; 
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        .show-labels .burner-label { opacity: 1; }
        .label-line { position: absolute; height: 1px; background: rgba(0, 242, 255, 0.4); }

        /* 火焰優化 */
        .flame-vfx {
            position: absolute; bottom: 220px; left: 50%; transform: translateX(-50%);
            width: 45px; height: 150px; 
            /* 修改形狀為更自然的圓弧 */
            border-radius: 50% 50% 35% 35% / 60% 60% 40% 40%;
            mix-blend-mode: screen; pointer-events: none; filter: blur(6px);
            transition: all 0.2s ease-out;
            animation: flame-wiggle 0.15s infinite alternate ease-in-out, 
                       flame-pulse 0.8s infinite alternate ease-in-out;
        }
        .flame-inner { 
            position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
            width: 40%; height: 50%; 
            background: linear-gradient(to top, #fff, transparent);
            border-radius: 50%; opacity: 0.8; filter: blur(2px);
        }
        @keyframes flame-wiggle {
            0% { transform: translateX(-51%) scaleX(1) skewX(0deg); }
            100% { transform: translateX(-49%) scaleX(1.02) skewX(1deg); }
        }
        @keyframes flame-pulse {
            from { transform: translateX(-50%) scaleX(1) scaleY(1); opacity: 0.85; }
            to { transform: translateX(-50%) scaleX(1.08) scaleY(1.05); opacity: 1; }
        }

        /* 光譜儀增強樣式 */
        .spectrum-container { position: relative; width: 100%; height: 100%; display: flex; flex-direction: column; }
        .spectrum-labels { display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 0.85rem; font-weight: 700; color: #aaa; text-transform: uppercase; letter-spacing: 1px; }
        .label-uv { color: #a855f7; width: 22.5%; text-align: center; border-bottom: 2px solid #a855f7; padding-bottom: 2px; }
        .label-vis { color: #22c55e; width: 50%; text-align: center; border-bottom: 2px solid #22c55e; padding-bottom: 2px; }
        .label-ir { color: #ef4444; width: 27.5%; text-align: center; border-bottom: 2px solid #ef4444; padding-bottom: 2px; }
        
        .spectrum-bg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0.4;
            /* 基於 200nm-1000nm 線性計算的物理節點 */
            background: linear-gradient(to right, 
                #000 0%,             /* 200nm (UV 起點) */
                #2e003e 15%,         /* 320nm (中 UV) */
                #4b0082 22.5%,       /* 380nm (可見光紫) */
                #0000ff 31.25%,      /* 450nm (藍) */
                #00ff00 41.25%,      /* 530nm (綠) */
                #ffff00 47.5%,       /* 580nm (黃) */
                #ff7700 52.5%,       /* 620nm (橙) -> 鈣 616nm 會剛好落在黃橘過渡區 */
                #ff0000 62.5%,       /* 700nm (紅) */
                #3f0000 75%,         /* 800nm (近紅外) */
                #000 100%);          /* 1000nm (IR 終點) */
        }

        .spectrum-ui { width: 100%; height: 50px; background: #000; border: 2px solid #334155; position: relative; }
        .line-marker { position: absolute; width: 3px; height: 100%; box-shadow: 0 0 15px currentColor; z-index: 10; }

        /* 手機適配 */
        @media (max-width: 1024px) {
            .main-layout { flex-direction: column; overflow-y: auto; }
            .side-panel, .data-panel { width: 100%; border: none; flex: none; max-height: none; }
            .viewport { min-height: 500px; }
            body { overflow-y: auto; }
        }
    </style>
</head>

<body>

<div class="header">

<div id="bottom-spectra" style="height: 180px; border-top: 2px solid var(--hud-cyan); background: #070b14; padding: 25px; flex-shrink: 0;"></div>

<script>

    // 注入 UI - 中央視圖 (本生燈 - 已移除所有教學標籤)
    document.getElementById('stage').innerHTML = `
        <div class="bunsen-burner" id="burner-container">
            <div id="active-flame" class="flame-vfx">
                <div id="inner-cone" class="flame-inner"></div>
            </div>
            
            <div class="chimney"></div>
            
            <div class="air-collar">
                <div class="air-hole"></div>
                <div class="air-hole"></div>
            </div>
            
            <div class="burner-stem"></div>
            
            <div class="base"></div>
            
            <div class="gas-inlet-tube"></div>

        <div style="position: absolute; top: 40px; right: 40px; text-align: right;">
            <div id="target-name" style="font-size: 4rem; font-weight: 700; color: #fff; text-shadow: 0 0 10px rgba(0,0,0,0.5);">待機中</div>
            <div id="target-symbol" style="color: var(--hud-cyan); font-size: 1.5rem; letter-spacing: 5px;">SCAN_READY</div>
        </div>
    `;
</script>

    function nmToRGB(nm) {
        if (nm < 380) return "#a78bfa";
        if (nm > 780) return "#7f1d1d";
        let r, g, b;
        if (nm < 440) { r = -(nm-440)/60; g = 0; b = 1; }
        else if (nm < 490) { r = 0; g = (nm-440)/50; b = 1; }
        else if (nm < 510) { r = 0; g = 1; b = -(nm-510)/20; }
        else if (nm < 580) { r = (nm-510)/70; g = 1; b = 0; }
        else if (nm < 645) { r = 1; g = -(nm-645)/65; b = 0; }
        else { r = 1; g = 0; b = 0; }
        return `rgb(${r*255}, ${g*255}, ${b*255})`;
    }

    function selectIon(key) {
        const ion = ION_DB[key];
        document.querySelectorAll('.s33-btn').forEach(b => b.classList.remove('active'));
        if (event) event.target.classList.add('active');

        document.getElementById('target-name').innerText = ion.name;
        document.getElementById('target-symbol').innerText = `目標離子: ${ion.sym}`;

        // 更新數據面板
        let html = `<div class="card-label">光譜數據分析 (Data Analytics)</div>`;
        ion.lines.forEach(nm => {
            const energy = (1240 / nm).toFixed(3);
            const freq = (3.0e8 / (nm * 1e-9) / 1e12).toFixed(1);
            const color = nmToRGB(nm);
            let region = nm < 380 ? "UV" : (nm > 780 ? "IR" : "VIS");

            // 數據分析框優化：全黑背景、文字顏色一致
            html += `
                <div class="hud-card" style="background: #000; border-left: 5px solid ${color}; margin-bottom:10px; padding:15px; border-top: 1px solid rgba(255,255,255,0.1);">
                    <div style="font-size:1.5rem; color:${color}; font-weight:bold; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center;">
                        <span>λ = ${nm} nm</span>
                        <span style="font-size:0.8rem; border:1px solid ${color}; padding:2px 6px; border-radius:4px; opacity:0.9;">${region}</span>
                    </div>
                    <div style="font-size:1rem; display:grid; grid-template-columns: 1fr 1fr; gap:8px; color: #fff;">
                        <div>能量: ${energy} eV</div>
                        <div>頻率: ${freq} THz</div>
                        <div style="grid-column: span 2;">波數: ${Math.round(1/(nm*1e-7))} cm⁻¹</div>
                    </div>
                </div>`;
        });
        
        // 合併為單一的「顯色原理」卡片 (移除區分標題，內容直接融合)
        html += `
        <div class="hud-card" style="background: #000; border: 1px solid rgba(0, 242, 255, 0.3); margin-bottom:10px;">
            <div class="card-label" style="font-size:1rem; color: var(--hud-cyan);">顯色原理</div>
            <div style="font-size:1rem; color:#eee; line-height:1.6; text-align:justify;">
                ${ion.synthesis} ${ion.theory}
            </div>
        </div>
        
        <div class="hud-card" style="background: #000; border: 1px solid rgba(0, 242, 255, 0.3);">
            <div class="card-label" style="font-size:1rem; color: var(--hud-cyan);">焰色應用</div>
            <div style="font-size:1rem; color:#eee; line-height:1.6;">${ion.app}</div>
        </div>`;
        
        document.getElementById('analytics').innerHTML = html;

        // 更新下方光譜儀
        const bar = document.getElementById('bottom-spectra');
        bar.innerHTML = `
            <div class="spectrum-container">
                <div class="spectrum-labels">
                    <div class="label-uv">Ultraviolet (UV)</div>
                    <div class="label-vis">Visible Light</div>
                    <div class="label-ir">Infrared (IR)</div>
                </div>
                <div class="spectrum-ui">
                    <div class="spectrum-bg"></div>
                    <div id="lines-layer" style="position:absolute; width:100%; height:100%; top:0; left:0;"></div>
                </div>
                <div style="display:flex; justify-content:space-between; margin-top:12px; padding: 0 5px;">
                    <span class="wavelength-label">200nm</span>
                    <span class="wavelength-label">400nm</span>
                    <span class="wavelength-label">600nm</span>
                    <span class="wavelength-label">800nm</span>
                    <span class="wavelength-label">1000nm</span>
                </div>
            </div>`;
            
        const layer = document.getElementById('lines-layer');
        ion.lines.forEach(nm => {
            const line = document.createElement('div');
            line.className = 'line-marker';
            line.style.left = `${((nm-200)/800)*100}%`;
            line.style.color = nmToRGB(nm);
            line.style.backgroundColor = "currentColor";
            line.style.boxShadow = `0 0 8px #fff, 0 0 15px currentColor`;
            layer.appendChild(line);
        });

        updateFlame(ion);
    }

    function updateFlame(ion) {
        const gas = parseInt(document.getElementById('gasRange').value);
        const air = parseInt(document.getElementById('airRange').value);
        window.currentIon = ion;
        const cobalt = document.getElementById('cobaltGlass').checked;
        const f = document.getElementById('active-flame');
        const inner = document.getElementById('inner-cone');
        
        // 燃料太少就熄火
        if(gas < 5) { 
            f.style.opacity = 0; 
            f.style.transform = 'translateX(-50%) scale(0)';
            return; 
        }
        
        f.style.opacity = 1;
        f.style.transform = 'translateX(-50%) scale(1)';
        
        // --- 物理擬真邏輯 ---
        
        // 1. 火焰型態 (Shape)
        // 氣體越多，火焰越高；空氣越多，火焰越細且內焰越明顯
        const height = 60 + gas * 2.5 - air * 0.8;
        const width = 55 - air * 0.25;
        f.style.height = `${Math.max(60, height)}px`;
        f.style.width = `${Math.max(20, width)}px`;

        // 內焰 (只有空氣夠多時才出現)
        if (air > 25) {
            inner.style.opacity = (air - 20) / 80; // 漸顯
            inner.style.height = `${Math.min(height * 0.7, 20 + air * 0.6)}px`;
            inner.style.background = `linear-gradient(to top, #00f2ff, rgba(0,242,255,0))`;
        } else {
            inner.style.opacity = 0;
        }

        // 2. 顏色邏輯 (Color)
        let coreColor, glowColor, outerColor;

        if (air < 45) {
            // [還原焰] 空氣不足 -> 燃燒不完全 -> 黃橘色亮光
            // 這種情況下，金屬離子顏色會被黃光蓋住，變得不明顯
            const yellowIntensity = (45 - air) / 45; // 0~1
            coreColor = `rgba(255, ${160 + air}, 50, 0.9)`;
            glowColor = `rgba(255, 100, 0, ${0.5 + yellowIntensity*0.5})`;
            outerColor = `rgba(255, 140, 0, ${0.3 + yellowIntensity*0.4})`;
            
            f.style.filter = 'blur(6px) contrast(1.2)'; // 邊緣較模糊
        } else {
            // [氧化焰] 空氣充足 -> 完全燃燒 -> 淡藍色/無色
            // 這才是觀察焰色的最佳時機
            coreColor = `rgba(180, 220, 255, 0.4)`; // 高溫淡白
            glowColor = `rgba(0, 150, 255, 0.2)`;   // 藍暈
            outerColor = `rgba(0, 100, 255, 0.1)`;
            
            f.style.filter = 'blur(4px) contrast(1.5)';
            
            // 疊加離子顏色
            if (ion && gas > 15) {
                let ionColor = ion.color;
                
                // 處理鈷玻璃
                if (cobalt) {
                    if (ion.sym.includes('Na')) ionColor = 'transparent'; // 濾掉鈉黃
                    else if (ion.sym.includes('K')) ionColor = '#a020f0'; // 鉀顯紫
                    else ionColor = `color-mix(in srgb, ${ionColor}, blue 40%)`; // 其他偏藍
                }

                // 只有在氧化焰狀態下，離子顏色才主導
                glowColor = ionColor;
                outerColor = ionColor;
                
                // 特殊：如果是鈉，核心也是黃的
                if (ion.sym.includes('Na') && !cobalt) {
                    coreColor = ionColor;
                }
            }
        }

        // 應用顏色漸層
        f.style.background = `radial-gradient(ellipse at bottom, 
            ${coreColor} 0%, 
            ${outerColor} 50%, 
            rgba(0,0,0,0) 90%)`;
            
        f.style.boxShadow = `0 -10px 40px ${glowColor}, 0 0 20px ${glowColor}`;
    }

    // 事件監聽
    document.getElementById('gasRange').addEventListener('input', () => updateFlame(ION_DB[document.querySelector('.s33-btn.active')?.onclick.toString().match(/'(\w+)'/)[1] || 'Na']));
    document.getElementById('airRange').addEventListener('input', () => updateFlame(ION_DB[document.querySelector('.s33-btn.active')?.onclick.toString().match(/'(\w+)'/)[1] || 'Na']));

    // 動態注入彈出窗 HTML 結構到 body
    const popupDiv = document.createElement('div');
    popupDiv.innerHTML = `
        <div id="popup-overlay" onclick="closePopup()" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; z-index:1999; background:transparent;"></div>
        <div id="cobalt-popup" style="display:none; position:absolute; left:390px; top:150px; width:320px; background:#0f172a; border:2px solid var(--hud-cyan); border-radius:12px; padding:20px; box-shadow: 0 0 30px rgba(0,0,0,0.5); z-index:2000;">
            <div style="color:var(--hud-cyan); font-size:1.2rem; margin-bottom:15px; display:flex; align-items:center; gap:10px;">
                <span style="font-size:1.5rem;">💡</span> 藍色鈷玻璃的作用
            </div>
            <div style="color:#f1f5f9; font-size:1rem; line-height:1.6; margin-bottom:15px;">
                1. <b>濾除黃光干擾：</b> 鈉離子 (Na⁺) 的黃光能量極強，即便只有微量雜質也會遮蓋其他焰色。<br><br>
                2. <b>觀測特定離子：</b> 藍色玻璃能吸收 589nm 的黃光，讓您能清晰觀察到如<b>鉀離子 (K⁺)</b> 的淺紫色。
            </div>
            <button style="width:100%; padding:8px; background:rgba(0,242,255,0.1); border:1px solid var(--hud-cyan); color:var(--hud-cyan); border-radius:6px; cursor:pointer; font-weight:bold;" onclick="closePopup()">關閉說明</button>
        </div>
    `;
    document.body.appendChild(popupDiv);

    // 全域彈出窗控制函數
    window.togglePopup = function(e) {
        e.stopPropagation();
        document.getElementById('cobalt-popup').style.display = 'block';
        document.getElementById('popup-overlay').style.display = 'block';
    };

    window.closePopup = function() {
        document.getElementById('cobalt-popup').style.display = 'none';
        document.getElementById('popup-overlay').style.display = 'none';
    };
    // 初始化
    window.onload = () => selectIon('Na');
</script>
</body>
</html>
