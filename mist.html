<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>台灣迷霧探索 (手動啟動版)</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <style>
        body { margin: 0; padding: 0; background: #000; overflow: hidden; }
        #map { width: 100vw; height: 100vh; z-index: 1; }
        
        /* 迷霧控制項 UI */
        #controls {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(0,0,0,0.8);
            padding: 15px;
            border-radius: 30px;
            color: white;
            text-align: center;
            font-family: sans-serif;
            border: 2px solid #ffd700;
            box-shadow: 0 0 15px #ffd700;
            width: 80%; /* 增加寬度以顯示更多文字 */
        }
        #status { font-size: 14px; margin-bottom: 10px; line-height: 1.5; }
        .action-button {
            background: #ffd700; color: #000; border: none;
            padding: 10px 25px; border-radius: 25px; font-weight: bold; font-size: 18px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="map"></div>
    
    <div id="controls">
        <div id="status">
            請點擊下方按鈕，App 將嘗試開啟 GPS 定位，並開始記錄您的探索足跡。
        </div>
        <button id="startButton" class="action-button" onclick="startTracking()">開始探索 / 開啟定位</button>
    </div>

    <script>
        // 1. 初始化地圖
        const map = L.map('map', {
            zoomControl: false, 
            attributionControl: false
        }).fitWorld();

        // 加入深色底圖 (這是迷霧背景)
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            maxZoom: 19
        }).addTo(map);

        // 2. 設定變數
        let userMarker = null;
        let pathLine = null;
        let exploredPath = []; 
        let isTracking = false; 

        function addExploredArea(lat, lng) {
            // 畫出圓形，代表視野範圍
            L.circle([lat, lng], {
                color: '#ffd700',      
                fillColor: '#ffffff',  
                fillOpacity: 0.3,      
                radius: 30,            
                weight: 1
            }).addTo(map);
        }

        // 3. GPS 定位成功時的處理
        function onLocationFound(e) {
            const lat = e.latlng.lat;
            const lng = e.latlng.lng;
            
            // 首次定位成功後才將地圖置中
            if (!isTracking) {
                map.setView(e.latlng, 16);
                isTracking = true;
                document.getElementById('startButton').innerText = '探索中... (點擊地圖置中)';
                document.getElementById('status').innerText = '已連線，迷霧正在消除中！';
                document.getElementById('startButton').onclick = centerMap; // 改變按鈕功能
            }

            // 更新使用者的位置圖示
            if (!userMarker) {
                userMarker = L.marker(e.latlng).addTo(map);
            } else {
                userMarker.setLatLng(e.latlng);
            }

            // 消除迷霧！
            addExploredArea(lat, lng);
            
            // 畫出軌跡線
            exploredPath.push([lat, lng]);
            if (!pathLine) {
                pathLine = L.polyline(exploredPath, {color: '#ffd700', weight: 3}).addTo(map);
            } else {
                pathLine.setLatLngs(exploredPath);
            }
        }

        // 4. GPS 定位失敗時的處理
        function onLocationError(e) {
            const statusDiv = document.getElementById('status');
            
            // 檢查是否是權限被拒絕的錯誤
            if (e.code === 1 || e.message.includes('permission denied')) {
                statusDiv.innerHTML = `
                    ❌ **定位失敗！權限被拒絕。**<br>
                    瀏覽器記住了您的拒絕選擇，請手動重設：<br>
                    **Chrome/Android:** 進入 App 資訊 > 權限 > 位置，手動設為「允許」。<br>
                    **Safari/iPhone:** 進入 設定 > 隱私權與安全性 > 定位服務 > 網站，找到此頁面並手動設為「允許」。
                `;
            } else {
                statusDiv.innerText = `定位錯誤 [${e.code}]: ${e.message}`;
            }
            document.getElementById('startButton').innerText = '重新嘗試定位';
            document.getElementById('startButton').onclick = startTracking; 
        }

        // 5. 啟動追蹤功能 (綁定給按鈕)
        function startTracking() {
            // 在啟動時將按鈕設為禁用，避免重複點擊
            document.getElementById('startButton').disabled = true;
            document.getElementById('status').innerText = '正在請求 GPS 權限... 請注意瀏覽器彈出視窗。';
            
            // 開始追蹤，如果瀏覽器還沒記錄權限，會彈出詢問視窗
            map.locate({setView: false, maxZoom: 16, watch: true, enableHighAccuracy: true});
        }
        
        // 6. 地圖事件監聽
        map.on('locationfound', onLocationFound);
        map.on('locationerror', onLocationError);

        // 7. 輔助功能：按鈕置中
        function centerMap() {
            if (userMarker) {
                map.setView(userMarker.getLatLng(), 16);
            }
        }
    </script>
</body>
</html>
