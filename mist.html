<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>台灣迷霧探索 (最終版 - 雙層遮罩)</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <style>
        body { margin: 0; padding: 0; background: #000; overflow: hidden; }
        #map { width: 100vw; height: 100vh; z-index: 1; }
        
        /* 迷霧控制項 UI (保持不變) */
        #controls {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(0,0,0,0.8);
            padding: 15px;
            border-radius: 30px;
            color: white;
            text-align: center;
            font-family: sans-serif;
            border: 2px solid #ffd700;
            box-shadow: 0 0 15px #ffd700;
            width: 80%;
        }
        #status { font-size: 14px; margin-bottom: 10px; line-height: 1.5; }
        .action-button {
            background: #ffd700; color: #000; border: none;
            padding: 10px 25px; border-radius: 25px; font-weight: bold; font-size: 18px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="map"></div>
    
    <div id="controls">
        <div id="status">
            請點擊下方按鈕，App 將嘗試開啟 GPS 定位，並開始記錄您的探索足跡。
        </div>
        <button id="startButton" class="action-button" onclick="startTracking()">開始探索 / 開啟定位</button>
    </div>

    <script>
        // 1. 定義世界邊界 (用於繪製遮罩的外環)
        // 這是世界上最大的多邊形，用來當作迷霧的基底
        const WORLD_OUTER_RING = [
            [90, -180], [90, 180], [-90, 180], [-90, -180]
        ];
        
        // 2. 初始化地圖與圖層
        const map = L.map('map', {
            zoomControl: false, 
            attributionControl: false
        }).setView([23.6, 120.8], 8); // 預設視角：台灣中央

        // **A. 底層 (The Revealed Map):** 使用標準 OSM 圖層，當迷霧清除後會顯示這個。
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(map);

        // **B. 頂層 (The Fog Layer):** 逆向多邊形，用來當作迷霧。
        // 初始時，這個多邊形只有外環，所以整個地圖都是黑色的迷霧。
        let exploredHoles = []; // 用來儲存探索過的區域 (要打的洞)
        let fogLayer = L.polygon([WORLD_OUTER_RING], {
            color: 'rgba(0, 0, 0, 0)', // 邊框透明
            fillColor: 'rgba(0, 0, 0, 0.95)', // 填充黑色，95% 不透明，比舊版更暗
            fillOpacity: 0.95, 
            weight: 1
        }).addTo(map);

        // 3. 輔助函數：計算圓形的多邊形近似值
        // 將你探索的圓形區域轉換為多邊形，以便在遮罩上「打洞」
        function getCirclePolygonApproximation(center, radius) {
            const segments = 32; // 邊數越多圓越圓，32個邊已足夠
            const points = [];
            // Leaflet 內部方法：將距離和角度轉換為經緯度
            for (let i = 0; i < segments; i++) {
                const bearing = 360 / segments * i;
                const p = L.latLng(center.lat, center.lng).destinationPoint(bearing, radius);
                points.push(p);
            }
            return points;
        }

        // 4. 清除迷霧的核心函數
        function clearFog(latLng) {
            const explorationRadius = 30; // 探索半徑 30 公尺
            
            // 取得當前位置的圓形近似多邊形
            const newHole = getCirclePolygonApproximation(latLng, explorationRadius);
            
            // 將新的「洞」加入到探索過的區域列表中
            exploredHoles.push(newHole);
            
            // 重繪迷霧層：外環 + 所有的洞
            fogLayer.setLatLngs([WORLD_OUTER_RING, ...exploredHoles]);
        }

        // 5. 其他變數和函數 (與舊版相同，用於控制和標記)
        let userMarker = null;
        let isTracking = false; 

        function onLocationFound(e) {
            const latLng = e.latlng;
            
            if (!isTracking) {
                map.setView(latLng, 16);
                isTracking = true;
                document.getElementById('startButton').innerText = '探索中... (點擊地圖置中)';
                document.getElementById('status').innerText = '已連線，迷霧正在消除中！';
                document.getElementById('startButton').onclick = centerMap;
            }

            if (!userMarker) {
                userMarker = L.marker(latLng).addTo(map);
            } else {
                userMarker.setLatLng(latLng);
            }

            // **核心：清除迷霧**
            clearFog(latLng);
        }

        function onLocationError(e) {
            // (錯誤處理邏輯與舊版相同)
            const statusDiv = document.getElementById('status');
            if (e.code === 1 || e.message.includes('permission denied')) {
                statusDiv.innerHTML = `
                    ❌ **定位失敗！權限被拒絕。**<br>
                    請手動檢查手機或瀏覽器設定中的「定位服務」權限。
                `;
            } else {
                statusDiv.innerText = `定位錯誤 [${e.code}]: ${e.message}`;
            }
            document.getElementById('startButton').innerText = '重新嘗試定位';
            document.getElementById('startButton').onclick = startTracking; 
        }

        function startTracking() {
            document.getElementById('startButton').disabled = true;
            document.getElementById('status').innerText = '正在請求 GPS 權限... 請注意瀏覽器彈出視窗。';
            map.locate({setView: false, maxZoom: 16, watch: true, enableHighAccuracy: true});
        }
        
        map.on('locationfound', onLocationFound);
        map.on('locationerror', onLocationError);

        function centerMap() {
            if (userMarker) {
                map.setView(userMarker.getLatLng(), 16);
            }
        }

        // Leaflet 缺少的一個內建函數，我們將它加上去，讓圓形轉換多邊形的功能可以運作
        // 這是計算目標經緯度的輔助函數
        L.LatLng.prototype.destinationPoint = function (brng, dist) {
            const R = 6371000; // 地球半徑 (公尺)
            const lat = this.lat * Math.PI / 180;
            const lon = this.lng * Math.PI / 180;
            const brngRad = brng * Math.PI / 180;
            
            const lat2 = Math.asin(Math.sin(lat) * Math.cos(dist / R) +
                                   Math.cos(lat) * Math.sin(dist / R) * Math.cos(brngRad));
            const lon2 = lon + Math.atan2(Math.sin(brngRad) * Math.sin(dist / R) * Math.cos(lat), 
                                        Math.cos(dist / R) - Math.sin(lat) * Math.sin(lat2));

            return L.latLng(lat2 * 180 / Math.PI, lon2 * 180 / Math.PI);
        };
    </script>
</body>
</html>
