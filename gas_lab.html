<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>理想氣體實驗室 V5 (精準計算版)</title>
    <style>
        :root {
            --bg-color: #1e1e1e;
            --panel-bg: #2a2a2a;
            --text-color: #e0e0e0;
            --accent-color: #4fc3f7;
            --danger-color: #ff5252;
            --success-color: #66bb6a;
            --warning-color: #ffa726;
            --border-color: #444;
            
            --gas-n2: #fdd835;
            --gas-o2: #e53935;
            --gas-cl2: #66bb6a;
        }
        body {
            margin: 0; padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex; flex-direction: column;
            height: 100vh; overflow: hidden;
            overscroll-behavior: none; touch-action: none;
        }
        header {
            padding: 0 15px; background: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex; justify-content: space-between; align-items: center;
            height: 50px; flex-shrink: 0;
        }
        h1 { margin: 0; font-size: 1rem; color: var(--accent-color); }
        
        #main-container { display: flex; flex: 1; overflow: hidden; flex-direction: row; }
        
        #canvas-wrapper {
            flex: 6; position: relative; background: #000;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden; touch-action: none; 
        }
        svg { width: 100%; height: 100%; display: block; user-select: none; }
        
        #control-panel {
            flex: 4; min-width: 320px; background: var(--panel-bg);
            border-left: 1px solid var(--border-color);
            padding: 15px; overflow-y: auto;
            display: flex; flex-direction: column; gap: 12px;
            -webkit-overflow-scrolling: touch; touch-action: pan-y;
        }

        .card {
            background: rgba(255,255,255,0.05);
            padding: 12px; border-radius: 8px;
            border: 1px solid var(--border-color);
        }
        .card h3 { margin: 0 0 10px 0; font-size: 0.95rem; color: #bbb; border-bottom: 1px solid #555; padding-bottom: 5px;}

        .control-group { margin-bottom: 12px; }
        label { display: flex; justify-content: space-between; font-size: 0.9rem; margin-bottom: 6px; }
        
        input[type="range"] { 
            width: 100%; cursor: pointer; accent-color: var(--accent-color); height: 30px; margin: 0;
        }
        
        /* 通用控制列樣式 (按鈕-數值-按鈕) */
        .ctrl-row {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 8px; background: rgba(0,0,0,0.2);
            padding: 8px; border-radius: 6px;
        }
        .ctrl-label { font-size: 0.9rem; font-weight: bold; width: 50px; }
        .ctrl-val { flex: 1; text-align: center; font-family: monospace; font-size: 1.1rem; color: var(--accent-color); }
        .ctrl-btn { 
            width: 40px; height: 36px; font-weight: bold; font-size: 1.2rem; 
            border: none; border-radius: 4px; background: #444; color: white; cursor: pointer;
        }
        .ctrl-btn:active { background: #666; transform: scale(0.95); }

        /* 氣體顏色標記 */
        .row-n2 { border-left: 4px solid var(--gas-n2); }
        .row-o2 { border-left: 4px solid var(--gas-o2); }
        .row-cl2 { border-left: 4px solid var(--gas-cl2); }
        .row-vol { border-left: 4px solid var(--accent-color); }

        .btn-group { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px;}
        button.action-btn {
            flex: 1; padding: 10px; border: none; border-radius: 6px;
            background: #444; color: white; font-size: 0.9rem; cursor: pointer;
        }
        button.primary { background: var(--accent-color); color: #000; font-weight: bold; }
        button.danger { background: var(--danger-color); color: white; }

        .toggle-container {
            display: flex; align-items: center; margin-bottom: 10px;
            background: rgba(0,0,0,0.2); padding: 10px; border-radius: 6px;
        }

        /* SVG Styles */
        .wall { fill: none; stroke: #fff; stroke-width: 4; }
        .wall-handle { 
            fill: var(--accent-color); cursor: ew-resize; opacity: 0.6; 
            stroke: transparent; stroke-width: 30px; vector-effect: non-scaling-stroke;
        }
        .wall-handle:hover, .wall-handle:active { opacity: 1; }
        .bar { fill: var(--accent-color); opacity: 0.6; }
        .data-value { font-family: monospace; font-weight: bold; fill: var(--accent-color); font-size: 16px;}
        .theoretical-line { fill: none; stroke: rgba(255,255,255,0.5); stroke-dasharray: 4; stroke-width: 2; }

        .annotation {
            font-size: 20px; fill: #fff; text-shadow: 0 0 5px #000; font-weight: bold;
            opacity: 0; transition: opacity 0.5s; pointer-events: none;
        }
        .annotation.show { opacity: 1; }

        @media (max-width: 900px) {
            #main-container { flex-direction: column; overflow-y: auto; }
            #canvas-wrapper { flex: none; height: 50vh; width: 100%; border-bottom: 1px solid #444; }
            #control-panel { flex: none; width: 100%; height: 50vh; border-left: none; }
        }
    </style>
</head>
<body>

<header>
    <h1>⚗️ 理想氣體 V5 (PV=nRT)</h1>
    <button class="action-btn" onclick="exportImage()" style="flex:0 0 auto; width:auto; padding:5px 10px;">📷</button>
</header>

<div id="main-container">
    <div id="canvas-wrapper">
        <svg id="sim-svg" viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid meet">
            <defs>
                <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
                    <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#333" stroke-width="1"/>
                </pattern>
                <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#ffa726" />
                </marker>
            </defs>
            <rect width="100%" height="100%" fill="url(#grid)" />

            <g id="container-group" transform="translate(50, 50)">
                <rect id="wall-rect" x="0" y="0" width="500" height="350" class="wall" />
                
                <g id="piston-group" transform="translate(500, 0)">
                    <rect id="volume-handle" x="0" y="0" width="15" height="350" class="wall-handle" />
                    <line id="piston-arrow" x1="80" y1="175" x2="20" y2="175" stroke="#ffa726" stroke-width="4" marker-end="url(#arrowhead)" visibility="hidden"/>
                    <text id="ext-pressure-text" x="90" y="180" fill="#ffa726" font-size="14" visibility="hidden">P_ext</text>
                </g>

                <g id="particles-group"></g>
                
                <text x="0" y="-15" fill="#fff" font-size="14">體積 V</text>
                <text id="volume-text" x="250" y="380" text-anchor="middle" fill="#aaa">10.0 L</text>
            </g>

            <g transform="translate(650, 50)">
                <rect width="300" height="150" fill="rgba(0,0,0,0.4)" stroke="#555" rx="5" />
                <text x="150" y="20" text-anchor="middle" fill="#ddd" font-size="12">速率分佈</text>
                <g id="histogram-bars"></g>
                <path id="theoretical-curve" class="theoretical-line" d="" />
            </g>

            <g transform="translate(650, 220)">
                 <rect width="300" height="160" fill="#222" stroke="#555" rx="5" />
                 <text x="15" y="30" fill="#fff" font-weight="bold" font-size="16">即時數據 (PV=nRT)</text>
                 <line x1="15" y1="45" x2="285" y2="45" stroke="#444" />
                 
                 <text x="20" y="75" fill="#aaa" font-family="monospace">P (壓力):</text>
                 <text id="table-P" x="150" y="75" class="data-value">0.00</text>
                 <text x="240" y="75" fill="#666">atm</text>
                 
                 <text x="20" y="100" fill="#aaa" font-family="monospace">V (體積):</text>
                 <text id="table-V" x="150" y="100" class="data-value">10.0</text>
                 <text x="240" y="100" fill="#666">L</text>
                 
                 <text x="20" y="125" fill="#aaa" font-family="monospace">T (溫度):</text>
                 <text id="table-T" x="150" y="125" class="data-value">300</text>
                 <text x="240" y="125" fill="#666">K</text>
                 
                 <text x="20" y="150" fill="#aaa" font-family="monospace">n (莫耳):</text>
                 <text id="table-n" x="150" y="150" class="data-value">0.0</text>
                 <text x="240" y="150" fill="#666">mol</text>
            </g>
            
            <text id="annotation-text" x="500" y="500" text-anchor="middle" class="annotation">提示文字</text>
        </svg>
    </div>

    <div id="control-panel">
        <div class="card" style="border-left: 4px solid var(--warning-color);">
            <h3>🕹️ 實驗模式</h3>
            <div class="toggle-container">
                <input type="checkbox" id="mode-toggle" style="width:20px; height:20px;">
                <label for="mode-toggle" style="margin-left:10px; flex:1;">定壓模式 (P = P_ext)</label>
            </div>
            
            <div id="pressure-control" style="display:none;">
                <div class="control-group">
                    <label>設定外部壓力 <span id="lbl-P-ext">1.0</span> atm</label>
                    <input type="range" id="input-P-ext" min="0.1" max="5.0" step="0.1" value="1.0">
                </div>
            </div>

            <div id="volume-control" class="ctrl-row row-vol">
                <span class="ctrl-label">體積 V</span>
                <button class="ctrl-btn" onclick="updateVolume(-0.1)">-</button>
                <div style="flex:1; padding: 0 10px;">
                    <input type="range" id="input-V" min="0.1" max="10.0" step="0.1" value="10.0">
                    <div style="text-align:center; font-family:monospace; color:var(--accent-color); margin-top:2px;">
                        <span id="lbl-V">10.0</span> L
                    </div>
                </div>
                <button class="ctrl-btn" onclick="updateVolume(0.1)">+</button>
            </div>
        </div>

        <div class="card">
            <h3>🎛️ 變數控制</h3>
            <div class="control-group">
                <label>溫度 T (攝氏+273) <span id="lbl-T" style="color:var(--accent-color)">300 K</span></label>
                <input type="range" id="input-T" min="100" max="1000" step="10" value="300">
            </div>

            <div class="ctrl-row row-n2">
                <span class="ctrl-label">N₂</span>
                <button class="ctrl-btn" onclick="updateGasAmount('N2', -0.1)">-</button>
                <span class="ctrl-val" id="val-N2">0.0</span>
                <button class="ctrl-btn" onclick="updateGasAmount('N2', 0.1)">+</button>
            </div>

            <div class="ctrl-row row-o2">
                <span class="ctrl-label">O₂</span>
                <button class="ctrl-btn" onclick="updateGasAmount('O2', -0.1)">-</button>
                <span class="ctrl-val" id="val-O2">0.0</span>
                <button class="ctrl-btn" onclick="updateGasAmount('O2', 0.1)">+</button>
            </div>

            <div class="ctrl-row row-cl2">
                <span class="ctrl-label">Cl₂</span>
                <button class="ctrl-btn" onclick="updateGasAmount('Cl2', -0.1)">-</button>
                <span class="ctrl-val" id="val-Cl2">0.0</span>
                <button class="ctrl-btn" onclick="updateGasAmount('Cl2', 0.1)">+</button>
            </div>
            
            <div class="btn-group">
                <button class="action-btn danger" onclick="resetSim()">重置 (Reset)</button>
                <button class="action-btn primary" id="btn-play-pause" onclick="togglePlay()">暫停</button>
            </div>
        </div>

        <div class="card">
            <h3>📚 定律演示</h3>
            <div class="btn-group">
                <button class="action-btn" onclick="scenarioBoyle()">波以耳 (P-V)</button>
                <button class="action-btn" onclick="scenarioCharles()">查理 (V-T)</button>
                <button class="action-btn" onclick="scenarioAvogadro()">亞佛加厥 (V-n)</button>
            </div>
        </div>
    </div>
</div>

<script>
/**
 * V5: 嚴格符合 PV = nRT 的物理模擬
 * 1. 壓力顯示直接由公式計算 (P = n*0.082*T / V)
 * 2. 體積範圍 0.1L - 10.0L
 * 3. 粒子大小縮小以適應小體積
 */

// --- 物理常數 ---
const R_CONSTANT = 0.082; // atm·L / (mol·K)
const GAS_TYPES = {
    'N2': { color: '#fdd835', mass: 28, radius: 2.5 },  // 縮小半徑
    'O2': { color: '#e53935', mass: 32, radius: 2.8 }, 
    'Cl2': { color: '#66bb6a', mass: 71, radius: 3.5 }
};

// --- 全域設定 ---
const CONFIG = {
    containerHeight: 350, // 畫布內高度
    maxLiters: 10.0,      // 最大體積
    minLiters: 0.1,       // 最小體積
    pixelsPerLiter: 50,   // 1L = 50px (10L = 500px)
    
    dt: 0.5,              // 時間步長
    subSteps: 5,          // 物理子步進 (防穿透)
    particlesPer01Mol: 10 // 0.1 mol 對應 10 顆粒子
};

let state = {
    particles: [],
    volumeLiters: 10.0,   // 當前體積 (L)
    temperature: 300,     // 溫度 (K)
    
    running: true,
    timeScale: 0.8,
    
    isIsobaric: false,    // 是否為定壓模式
    targetPressure: 1.0,  // 目標外部壓力 (atm)
    
    moles: { 'N2': 0.0, 'O2': 0.0, 'Cl2': 0.0 },
    frameCount: 0
};

// DOM 緩存
const els = {
    svg: document.getElementById('sim-svg'),
    wallRect: document.getElementById('wall-rect'),
    pistonGroup: document.getElementById('piston-group'),
    volText: document.getElementById('volume-text'),
    particlesGroup: document.getElementById('particles-group'),
    histGroup: document.getElementById('histogram-bars'),
    theoryCurve: document.getElementById('theoretical-curve'),
    annotation: document.getElementById('annotation-text'),
    
    table: {
        P: document.getElementById('table-P'),
        V: document.getElementById('table-V'),
        T: document.getElementById('table-T'),
        n: document.getElementById('table-n')
    },
    inputs: {
        T: document.getElementById('input-T'),
        V: document.getElementById('input-V'),
        P_ext: document.getElementById('input-P-ext'),
        mode: document.getElementById('mode-toggle'),
        play: document.getElementById('btn-play-pause'),
        pControl: document.getElementById('pressure-control'),
        vControl: document.getElementById('volume-control')
    },
    vals: {
        N2: document.getElementById('val-N2'),
        O2: document.getElementById('val-O2'),
        Cl2: document.getElementById('val-Cl2')
    }
};

// --- 核心類別 ---
class Particle {
    constructor(type, x, y) {
        this.type = type;
        this.props = GAS_TYPES[type];
        this.r = this.props.radius;
        this.mass = this.props.mass;
        this.x = x;
        this.y = y;
        
        // 速度初始化 (與溫度相關)
        const v_scale = 2.5; 
        const v_rms = v_scale * Math.sqrt(state.temperature / this.mass);
        const angle = Math.random() * Math.PI * 2;
        this.vx = Math.cos(angle) * v_rms;
        this.vy = Math.sin(angle) * v_rms;
        
        this.el = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        this.el.setAttribute("r", this.r);
        this.el.setAttribute("fill", this.props.color);
        this.el.setAttribute("stroke", "#000");
        this.el.setAttribute("stroke-width", "0.5");
        els.particlesGroup.appendChild(this.el);
    }
    updateVis() {
        this.el.setAttribute("cx", this.x);
        this.el.setAttribute("cy", this.y);
    }
    remove() {
        if(this.el.parentNode) this.el.parentNode.removeChild(this.el);
    }
}

// --- 初始化與控制邏輯 ---

function init() {
    // 綁定事件
    els.inputs.T.addEventListener('input', e => setTemperature(+e.target.value));
    els.inputs.V.addEventListener('input', e => {
        if(!state.isIsobaric) setVolumeLiters(+e.target.value);
    });
    els.inputs.P_ext.addEventListener('input', e => {
        state.targetPressure = +e.target.value;
        document.getElementById('lbl-P-ext').innerText = state.targetPressure.toFixed(1);
    });
    els.inputs.mode.addEventListener('change', e => setMode(e.target.checked));

    // 滑鼠/觸控拖曳活塞
    setupDragInteraction();
    
    // 初始狀態
    updateGasAmount('N2', 0.5); // 預設加入 0.5 mol
    loop();
}

function setTemperature(k) {
    if(state.particles.length > 0) {
        const ratio = Math.sqrt(k / state.temperature);
        state.particles.forEach(p => { p.vx *= ratio; p.vy *= ratio; });
    }
    state.temperature = k;
    document.getElementById('lbl-T').innerText = k + " K";
    updateTable();
}

// 核心體積設定函數
function setVolumeLiters(L) {
    // 限制範圍
    L = Math.max(CONFIG.minLiters, Math.min(CONFIG.maxLiters, L));
    state.volumeLiters = L;
    
    // 更新 UI
    els.inputs.V.value = L;
    document.getElementById('lbl-V').innerText = L.toFixed(1);
    els.volText.textContent = L.toFixed(1) + " L";
    
    // 換算成像素寬度
    const widthPx = L * CONFIG.pixelsPerLiter;
    els.wallRect.setAttribute("width", widthPx);
    els.pistonGroup.setAttribute("transform", `translate(${widthPx}, 0)`);
    els.volText.setAttribute("x", widthPx / 2);
    
    // 邊界處理：如果牆壁縮小，把粒子推回來
    state.particles.forEach(p => {
        if(p.x > widthPx - p.r) {
            p.x = widthPx - p.r - 1;
            p.vx = -Math.abs(p.vx);
        }
    });
    
    updateTable();
}

function updateVolume(delta) {
    if(state.isIsobaric) return;
    const newV = Math.round((state.volumeLiters + delta) * 10) / 10;
    setVolumeLiters(newV);
}

function updateGasAmount(type, delta) {
    const cur = state.moles[type];
    let next = Math.round((cur + delta) * 10) / 10;
    if(next < 0) next = 0;
    if(next > 5.0) next = 5.0; // 安全上限
    
    if(Math.abs(next - cur) < 0.01) return;
    
    state.moles[type] = next;
    els.vals[type].innerText = next.toFixed(1);
    
    // 計算需要的粒子總數
    // 0.1 mol = 10 particles
    const targetCount = Math.round(next * 10 * CONFIG.particlesPer01Mol);
    const currentParticles = state.particles.filter(p => p.type === type);
    const diff = targetCount - currentParticles.length;
    
    if(diff > 0) {
        // 加粒子
        const widthPx = state.volumeLiters * CONFIG.pixelsPerLiter;
        for(let i=0; i<diff; i++) {
            // 隨機位置但避開牆壁
            let x = Math.random() * (widthPx - 20) + 10;
            let y = Math.random() * (CONFIG.containerHeight - 20) + 10;
            state.particles.push(new Particle(type, x, y));
        }
    } else if(diff < 0) {
        // 減粒子 (從陣列尾端移除)
        let removed = 0;
        for(let i=state.particles.length-1; i>=0; i--) {
            if(removed >= -diff) break;
            if(state.particles[i].type === type) {
                state.particles[i].remove();
                state.particles.splice(i, 1);
                removed++;
            }
        }
    }
    updateTable();
}

function setMode(isIso) {
    state.isIsobaric = isIso;
    els.inputs.mode.checked = isIso;
    
    if(isIso) {
        els.inputs.pControl.style.display = 'block';
        els.inputs.vControl.style.opacity = '0.5';
        els.inputs.vControl.style.pointerEvents = 'none';
        document.getElementById('piston-arrow').setAttribute('visibility', 'visible');
        document.getElementById('ext-pressure-text').setAttribute('visibility', 'visible');
        document.getElementById('volume-handle').style.cursor = 'not-allowed';
        showAnnotation("定壓模式：體積將自動調整");
    } else {
        els.inputs.pControl.style.display = 'none';
        els.inputs.vControl.style.opacity = '1';
        els.inputs.vControl.style.pointerEvents = 'auto';
        document.getElementById('piston-arrow').setAttribute('visibility', 'hidden');
        document.getElementById('ext-pressure-text').setAttribute('visibility', 'hidden');
        document.getElementById('volume-handle').style.cursor = 'ew-resize';
    }
}

// --- 物理引擎 ---

function loop() {
    if(state.running) {
        updatePhysics();
        state.frameCount++;
    }
    // 視覺更新可略過一些幀以提升效能
    state.particles.forEach(p => p.updateVis());
    updateHistogram();
    
    if(state.running && state.isIsobaric) {
        updateIsobaricLogic();
    }
    
    requestAnimationFrame(loop);
}

function updatePhysics() {
    const widthPx = state.volumeLiters * CONFIG.pixelsPerLiter;
    const dt = CONFIG.dt * state.timeScale / CONFIG.subSteps;
    
    for(let s=0; s<CONFIG.subSteps; s++) {
        // 1. 移動與牆壁碰撞
        for(let p of state.particles) {
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            
            // X 軸邊界
            if(p.x < p.r) { p.x = p.r; p.vx *= -1; }
            if(p.x > widthPx - p.r) { p.x = widthPx - p.r; p.vx *= -1; }
            
            // Y 軸邊界
            if(p.y < p.r) { p.y = p.r; p.vy *= -1; }
            if(p.y > CONFIG.containerHeight - p.r) { p.y = CONFIG.containerHeight - p.r; p.vy *= -1; }
        }
        
        // 2. 粒子間碰撞 (簡單彈性碰撞)
        // 為了效能，這裡使用 O(N^2) 但 N 不大
        const len = state.particles.length;
        for(let i=0; i<len; i++) {
            for(let j=i+1; j<len; j++) {
                const p1 = state.particles[i];
                const p2 = state.particles[j];
                const dx = p2.x - p1.x;
                const dy = p2.y - p1.y;
                const distSq = dx*dx + dy*dy;
                const minD = p1.r + p2.r;
                
                if(distSq < minD*minD) {
                    // 碰撞響應
                    const dist = Math.sqrt(distSq);
                    const nx = dx/dist;
                    const ny = dy/dist;
                    const overlap = (minD - dist) * 0.5;
                    
                    // 分離
                    p1.x -= overlap*nx; p1.y -= overlap*ny;
                    p2.x += overlap*nx; p2.y += overlap*ny;
                    
                    // 交換動量
                    const dvx = p1.vx - p2.vx;
                    const dvy = p1.vy - p2.vy;
                    const proj = dvx*nx + dvy*ny;
                    
                    if(proj < 0) { // 接近中
                        const m1 = p1.mass;
                        const m2 = p2.mass;
                        const factor = (2 * proj) / (m1+m2);
                        p1.vx -= factor * m2 * nx;
                        p1.vy -= factor * m2 * ny;
                        p2.vx += factor * m1 * nx;
                        p2.vy += factor * m1 * ny;
                    }
                }
            }
        }
    }
}

// 定壓模式下的活塞動力學
function updateIsobaricLogic() {
    // 計算當前內部氣體壓力 (理論值)
    const totalMoles = state.moles.N2 + state.moles.O2 + state.moles.Cl2;
    let internalP = 0;
    
    if(state.volumeLiters > 0.01) {
        internalP = (totalMoles * R_CONSTANT * state.temperature) / state.volumeLiters;
    }
    
    // 壓力差驅動體積變化 (模擬阻尼運動)
    const diff = internalP - state.targetPressure;
    
    // 係數需要微調讓動畫看起來自然
    // 如果壓力差大，體積變化快
    let dV = diff * 0.05 * state.timeScale; 
    
    // 限制單幀最大變化量，避免震盪
    if(dV > 0.5) dV = 0.5;
    if(dV < -0.5) dV = -0.5;
    
    const nextV = state.volumeLiters + dV;
    
    // 檢查是否變化足夠大才更新 (節省重繪)
    if(Math.abs(nextV - state.volumeLiters) > 0.005) {
        setVolumeLiters(nextV);
    }
}

// --- 數據計算與顯示 (嚴格公式) ---

function updateTable() {
    const totalMoles = state.moles.N2 + state.moles.O2 + state.moles.Cl2;
    const V = state.volumeLiters;
    const T = state.temperature;
    
    // P = nRT / V
    let P = 0;
    if(V > 0.001) {
        P = (totalMoles * R_CONSTANT * T) / V;
    }
    
    els.table.P.textContent = P.toFixed(2);
    els.table.V.textContent = V.toFixed(1);
    els.table.T.textContent = T.toFixed(0);
    els.table.n.textContent = totalMoles.toFixed(1);
}

// --- 速率分佈圖 ---
function updateHistogram() {
    if(state.frameCount % 5 !== 0) return;
    
    const bins = 20;
    const maxSpeed = 25; // 視覺速度上限
    const counts = new Array(bins).fill(0);
    
    state.particles.forEach(p => {
        const v = Math.sqrt(p.vx**2 + p.vy**2);
        const idx = Math.floor((v/maxSpeed)*bins);
        if(idx < bins) counts[idx]++;
    });
    
    els.histGroup.innerHTML = '';
    const hMax = 130;
    const wTotal = 280;
    const barW = wTotal / bins;
    const maxCount = Math.max(...counts, 5);
    
    counts.forEach((c, i) => {
        if(c===0) return;
        const h = (c/maxCount) * hMax;
        const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
        rect.setAttribute("x", i*barW + 10);
        rect.setAttribute("y", 150 - h);
        rect.setAttribute("width", barW-1);
        rect.setAttribute("height", h);
        rect.setAttribute("class", "bar");
        els.histGroup.appendChild(rect);
    });
}

// --- 輔助功能 ---

function setupDragInteraction() {
    let dragging = false;
    const handle = document.getElementById('volume-handle');
    
    const startDrag = (e) => {
        if(state.isIsobaric) return;
        dragging = true;
        e.preventDefault();
    };
    const endDrag = () => dragging = false;
    const moveDrag = (e) => {
        if(!dragging || state.isIsobaric) return;
        
        let clientX = e.clientX || (e.touches ? e.touches[0].clientX : 0);
        
        // 轉換座標到 SVG 空間
        const pt = els.svg.createSVGPoint();
        pt.x = clientX; 
        const svgP = pt.matrixTransform(els.svg.getScreenCTM().inverse());
        
        // 容器起點 x=50
        let wPx = svgP.x - 50;
        
        // 轉回 Liters
        let L = wPx / CONFIG.pixelsPerLiter;
        setVolumeLiters(L);
    };

    handle.addEventListener('mousedown', startDrag);
    handle.addEventListener('touchstart', startDrag, {passive:false});
    window.addEventListener('mouseup', endDrag);
    window.addEventListener('touchend', endDrag);
    window.addEventListener('mousemove', moveDrag);
    window.addEventListener('touchmove', moveDrag, {passive:false});
}

function resetSim() {
    ['N2','O2','Cl2'].forEach(t => updateGasAmount(t, -100)); // 清空
    setTemperature(300);
    setVolumeLiters(10.0);
    setMode(false);
    updateGasAmount('N2', 0.0); // 歸零 UI
    updateTable();
}

function showAnnotation(text) {
    els.annotation.textContent = text;
    els.annotation.classList.remove("show");
    void els.annotation.offsetWidth;
    els.annotation.classList.add("show");
}

function togglePlay() {
    state.running = !state.running;
    els.inputs.play.innerText = state.running ? "暫停" : "繼續";
}

// 截圖
function exportImage() {
    const svgData = new XMLSerializer().serializeToString(els.svg);
    const img = new Image();
    img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svgData)));
    img.onload = () => {
        const cvs = document.createElement('canvas');
        cvs.width = 1000; cvs.height = 600;
        const ctx = cvs.getContext('2d');
        ctx.fillStyle="#1e1e1e"; ctx.fillRect(0,0,1000,600);
        ctx.drawImage(img,0,0);
        const a = document.createElement('a');
        a.download = "gas_lab_pv_nrt.png";
        a.href = cvs.toDataURL();
        a.click();
    };
}

// --- 演示情境 ---
function scenarioBoyle() {
    resetSim();
    updateGasAmount('N2', 1.0);
    setVolumeLiters(5.0);
    showAnnotation("波以耳定律：定溫下，P 與 V 成反比");
}
function scenarioCharles() {
    resetSim();
    updateGasAmount('N2', 1.0);
    setMode(true); // 開啟定壓
    showAnnotation("查理定律：定壓下，V 與 T 成正比 (請調整溫度)");
}
function scenarioAvogadro() {
    resetSim();
    setTemperature(300);
    setMode(true);
    state.targetPressure = 1.0; els.inputs.P_ext.value = 1.0;
    updateGasAmount('N2', 0.5);
    showAnnotation("亞佛加厥定律：同溫同壓下，V 與 n 成正比");
}
