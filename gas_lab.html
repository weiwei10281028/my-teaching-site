<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <!-- 關鍵：禁止縮放，鎖定視窗寬度 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>理想氣體動力論互動模擬 (手機版)</title>
    <style>
        :root {
            --bg-color: #1e1e1e;
            --panel-bg: #2a2a2a;
            --text-color: #e0e0e0;
            --accent-color: #4fc3f7;
            --danger-color: #ff5252;
            --success-color: #66bb6a;
            --warning-color: #ffa726;
            --border-color: #444;
            
            /* 氣體顏色 */
            --gas-n2: #fdd835; /* 黃 */
            --gas-o2: #e53935; /* 紅 */
            --gas-cl2: #66bb6a; /* 綠 */
        }
        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            /* 防止手機上下拉動重新整理 */
            overscroll-behavior: none;
            touch-action: none; /* 全局禁止預設觸控行為 */
        }
        header {
            padding: 0 15px;
            background: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 50px; /* 加高一點方便點擊 */
            flex-shrink: 0;
        }
        h1 { margin: 0; font-size: 1rem; color: var(--accent-color); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        /* 主要佈局 */
        #main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
            flex-direction: row; /* 預設橫向 (桌機/平板) */
        }
        
        /* 左側：SVG 畫布 */
        #canvas-wrapper {
            flex: 6;
            position: relative;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            touch-action: none; 
        }
        svg {
            width: 100%;
            height: 100%;
            display: block;
            user-select: none;
        }
        
        /* 右側：控制與數據面板 */
        #control-panel {
            flex: 4;
            min-width: 300px;
            background: var(--panel-bg);
            border-left: 1px solid var(--border-color);
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            /* 手機版慣性捲動 */
            -webkit-overflow-scrolling: touch; 
            touch-action: pan-y; /* 允許垂直捲動 */
        }

        /* 元件樣式 */
        .card {
            background: rgba(255,255,255,0.05);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }
        .card h3 { margin-top: 0; margin-bottom: 10px; font-size: 0.95rem; color: #bbb; border-bottom: 1px solid #555; padding-bottom: 5px;}

        .control-group { margin-bottom: 15px; } /* 增加間距 */
        label { display: flex; justify-content: space-between; font-size: 0.9rem; margin-bottom: 8px; }
        
        /* 優化滑桿觸控區域 */
        input[type="range"] { 
            width: 100%; 
            cursor: pointer; 
            accent-color: var(--accent-color); 
            height: 30px; /* 加高觸控區 */
            margin: 0;
        }
        
        .btn-group { display: flex; gap: 8px; flex-wrap: wrap; }
        button {
            flex: 1;
            padding: 12px 5px; /* 加大按鈕高度 */
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: #444;
            color: white;
            transition: all 0.1s;
            font-size: 0.9rem;
            white-space: nowrap;
            min-width: 80px;
            /* 禁止選取文字 */
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        button:active { transform: scale(0.98); background: #666; }
        button.primary { background: var(--accent-color); color: #000; font-weight: bold; }
        button.danger { background: var(--danger-color); color: white; }
        
        /* 氣體按鈕專用色 */
        .btn-n2 { border-bottom: 4px solid var(--gas-n2); }
        .btn-o2 { border-bottom: 4px solid var(--gas-o2); }
        .btn-cl2 { border-bottom: 4px solid var(--gas-cl2); }

        /* 開關樣式 */
        .toggle-container {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
            background: rgba(0,0,0,0.2);
            padding: 10px;
            border-radius: 6px;
        }
        .toggle-label { flex: 1; font-size: 1rem; margin-left: 10px; }
        
        /* SVG 內部樣式 */
        .wall { fill: none; stroke: #fff; stroke-width: 4; }
        
        /* 手機版把手優化：增加透明邊框擴大點擊判定範圍 */
        .wall-handle { 
            fill: var(--accent-color); 
            cursor: ew-resize; 
            opacity: 0.6; 
            stroke: transparent; 
            stroke-width: 40px; /* 擴大觸控區域到 40px */
            vector-effect: non-scaling-stroke;
        }
        .wall-handle:hover, .wall-handle:active { opacity: 1; }
        
        .piston-force-arrow { stroke: var(--warning-color); stroke-width: 3; fill: var(--warning-color); }
        .axis { stroke: #666; stroke-width: 1; }
        .graph-line { fill: none; stroke: var(--success-color); stroke-width: 2; }
        .theoretical-line { fill: none; stroke: rgba(255,255,255,0.4); stroke-dasharray: 4; stroke-width: 2; }
        .bar { fill: var(--accent-color); opacity: 0.6; }
        
        /* 表格樣式 (SVG內) */
        .data-table-bg { fill: #222; stroke: #555; stroke-width: 1; rx: 5; }
        .data-label { font-size: 14px; fill: #aaa; font-family: monospace; }
        .data-value { font-size: 16px; fill: var(--accent-color); font-family: monospace; font-weight: bold; }
        .data-unit { font-size: 12px; fill: #666; }
        
        text { font-family: sans-serif; fill: #aaa; user-select: none; pointer-events: none;}
        
        .annotation {
            pointer-events: none;
            font-size: 24px; /* 手機上加大字體 */
            fill: #fff;
            text-shadow: 0 0 5px #000;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.5s;
        }
        .annotation.show { opacity: 1; }

        /* 響應式調整 - 手機版直式 */
        @media (max-width: 900px) {
            #main-container { 
                flex-direction: column; 
                overflow-y: auto;
            }
            #canvas-wrapper { 
                flex: none; 
                height: 55vh; /* 畫布佔 55% 高度 */
                width: 100%;
                border-bottom: 1px solid #444;
            }
            #control-panel { 
                flex: none; 
                width: 100%; 
                height: 45vh; /* 控制板佔剩餘 */
                min-height: auto;
                max-width: none;
                border-left: none;
                padding: 15px;
                box-sizing: border-box;
            }
        }
    </style>
</head>
<body>

<header>
    <h1>⚗️ 理想氣體實驗室 (手機版)</h1>
    <div>
        <button onclick="exportImage()" style="padding: 8px 12px; font-size: 0.8rem;">📷 截圖</button>
    </div>
</header>

<div id="main-container">
    <!-- SVG 畫布區域 -->
    <div id="canvas-wrapper">
        <svg id="sim-svg" viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid meet">
            <!-- 背景格線 -->
            <defs>
                <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
                    <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#333" stroke-width="1"/>
                </pattern>
                <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#ffa726" />
                </marker>
            </defs>
            <rect width="100%" height="100%" fill="url(#grid)" />

            <!-- 物理容器 -->
            <g id="container-group" transform="translate(20, 50)">
                <!-- 牆壁 -->
                <rect id="wall-rect" x="0" y="0" width="500" height="350" class="wall" />
                
                <!-- 體積拖曳/活塞把手 -->
                <g id="piston-group">
                    <rect id="volume-handle" x="500" y="0" width="15" height="350" class="wall-handle" />
                    <!-- 外力箭頭 -->
                    <line id="piston-arrow" x1="580" y1="175" x2="520" y2="175" stroke="#ffa726" stroke-width="4" marker-end="url(#arrowhead)" visibility="hidden"/>
                    <text id="ext-pressure-text" x="600" y="180" fill="#ffa726" font-size="14" visibility="hidden">P_ext</text>
                </g>

                <!-- 粒子群 -->
                <g id="particles-group"></g>
                
                <!-- 標籤 -->
                <text x="10" y="-15" fill="#fff" font-size="14">氣體容器</text>
                <text id="volume-text" x="250" y="380" text-anchor="middle">V (體積)</text>
            </g>

            <!-- 速度分佈圖表 (移到下方) -->
            <g id="chart-group" transform="translate(620, 50)">
                <rect x="0" y="0" width="340" height="180" fill="rgba(0,0,0,0.4)" stroke="#555" rx="5" />
                <text x="170" y="20" text-anchor="middle" font-size="14" fill="#ddd">速率分佈 (MB)</text>
                
                <line x1="20" y1="160" x2="320" y2="160" class="axis" />
                <line x1="20" y1="160" x2="20" y2="30" class="axis" />
                <text x="320" y="175" text-anchor="end" font-size="12">速率 v</text>
                
                <g id="histogram-bars"></g>
                <path id="theoretical-curve" class="theoretical-line" d="" />
            </g>

            <!-- 即時數據表格 -->
            <g id="data-table-group" transform="translate(620, 250)">
                 <rect class="data-table-bg" x="0" y="0" width="340" height="150" />
                 <text x="15" y="25" fill="#fff" font-weight="bold" font-size="16">即時數據</text>
                 
                 <text x="20" y="60" class="data-label">壓力 (P):</text>
                 <text id="table-P" x="140" y="60" class="data-value">0.00</text>
                 <text x="220" y="60" class="data-unit">atm</text>
                 
                 <text x="20" y="85" class="data-label">體積 (V):</text>
                 <text id="table-V" x="140" y="85" class="data-value">500</text>
                 <text x="220" y="85" class="data-unit">L</text>
                 
                 <text x="20" y="110" class="data-label">溫度 (T):</text>
                 <text id="table-T" x="140" y="110" class="data-value">300</text>
                 <text x="220" y="110" class="data-unit">K</text>
                 
                 <text x="20" y="135" class="data-label">粒子數(n):</text>
                 <text id="table-n" x="140" y="135" class="data-value">0</text>
                 <text x="220" y="135" class="data-unit">mol</text>
            </g>
            
            <!-- 註解文字 -->
            <text id="annotation-text" x="500" y="480" text-anchor="middle" class="annotation">提示文字</text>
        </svg>
    </div>

    <!-- 控制面板 -->
    <div id="control-panel">
        
        <!-- 實驗模式切換 -->
        <div class="card" style="border-left: 4px solid var(--warning-color);">
            <h3>🕹️ 實驗模式</h3>
            <div class="toggle-container">
                <input type="checkbox" id="mode-toggle" style="width:24px; height:24px;">
                <label for="mode-toggle" class="toggle-label" id="mode-label">
                    定壓模式 (活塞可動)
                </label>
            </div>
            <div id="pressure-control" style="display:none;">
                <div class="control-group">
                    <label>設定外部壓力 (P_ext) <span id="lbl-P-ext">1.0</span></label>
                    <input type="range" id="input-P-ext" min="0.2" max="3.0" step="0.1" value="1.0">
                </div>
            </div>
            <div id="volume-control">
                <div class="control-group">
                    <label>設定體積 (V) <span id="lbl-V">500</span></label>
                    <input type="range" id="input-V" min="100" max="550" step="1" value="500">
                    <small style="color:#888; display:block; margin-top:5px;">👆 小提示：您可以直接在上方畫布用手指拖曳把手</small>
                </div>
            </div>
        </div>

        <!-- 變數控制 -->
        <div class="card">
            <h3>🎛️ 氣體控制</h3>
            
            <div class="control-group">
                <label>溫度 (T) <span id="lbl-T">300</span>K</label>
                <input type="range" id="input-T" min="50" max="1000" step="10" value="300">
            </div>

            <label>加入/移除粒子 (n)</label>
            <div class="btn-group">
                <button class="btn-n2" onclick="addParticles('N2', 10)">+10 N₂ (黃)</button>
                <button class="btn-o2" onclick="addParticles('O2', 10)">+10 O₂ (紅)</button>
                <button class="btn-cl2" onclick="addParticles('Cl2', 10)">+10 Cl₂ (綠)</button>
            </div>
            <div class="btn-group" style="margin-top:8px;">
                <button onclick="removeRandomParticles(10)">移除 10 顆</button>
                <button class="danger" onclick="resetSim()">清空所有</button>
            </div>
        </div>

        <!-- 系統設定 -->
        <div class="card">
            <h3>⚙️ 模擬設定</h3>
            <div class="control-group">
                <label>時間速率 (越慢越清楚)</label>
                <input type="range" id="input-speed" min="0.1" max="2.0" step="0.1" value="0.5">
            </div>
            <div class="btn-group">
                <button class="primary" id="btn-play-pause" onclick="togglePlay()">暫停 ⏸</button>
            </div>
        </div>

        <!-- 物理定律演示 -->
        <div class="card">
            <h3>📚 物理定律演示</h3>
            <div class="btn-group">
                <button onclick="scenarioBoyle()">波以耳 (P-V)</button>
                <button onclick="scenarioCharles()">查理 (V-T)</button>
            </div>
            <div class="btn-group" style="margin-top:8px;">
                <button onclick="scenarioAvogadro()">亞佛加厥 (V-n)</button>
                <button onclick="scenarioGayLussac()">給呂薩克 (P-T)</button>
            </div>
            <p id="scenario-desc" style="font-size: 0.9rem; color: #aaa; margin-top:12px; min-height: 3em;">
                請選擇上方按鈕來演示對應的氣體定律。
            </p>
        </div>
    </div>
</div>

<script>
/**
 * 理想氣體模擬 (手機版) - 包含 V3 的穩定性更新與觸控支援
 */

// --- 氣體定義 ---
const GAS_TYPES = {
    'N2': { color: '#fdd835', mass: 28, radius: 4 },
    'O2': { color: '#e53935', mass: 32, radius: 4.5 }, 
    'Cl2': { color: '#66bb6a', mass: 71, radius: 5.5 }
};

// --- 全域配置 ---
const CONFIG = {
    containerHeight: 350,
    maxWidth: 550,
    minWidth: 100,
    k_B: 1, 
    dt: 0.5, 
    subSteps: 4, // 物理子步進次數
    histBins: 25,
    pressureSmoothing: 0.98, 
    pistonK: 0.2 
};

let state = {
    particles: [],
    width: 500,
    temperature: 300,
    running: true,
    timeScale: 0.5, 
    pressure: 0,
    displayPressure: 0, 
    accumulatedImpulse: 0,
    frameCount: 0,
    isIsobaric: false, 
    targetPressure: 1.0
};

// SVG 元素緩存
const els = {
    svg: document.getElementById('sim-svg'),
    wallRect: document.getElementById('wall-rect'),
    volumeHandle: document.getElementById('volume-handle'),
    pistonGroup: document.getElementById('piston-group'),
    pistonArrow: document.getElementById('piston-arrow'),
    extPText: document.getElementById('ext-pressure-text'),
    volumeText: document.getElementById('volume-text'),
    particlesGroup: document.getElementById('particles-group'),
    histGroup: document.getElementById('histogram-bars'),
    theoryCurve: document.getElementById('theoretical-curve'),
    annotation: document.getElementById('annotation-text'),
    
    // 表格顯示數值
    table: {
        P: document.getElementById('table-P'),
        V: document.getElementById('table-V'),
        T: document.getElementById('table-T'),
        n: document.getElementById('table-n')
    },
    
    // 控制項
    inputs: {
        T: document.getElementById('input-T'),
        V: document.getElementById('input-V'),
        P_ext: document.getElementById('input-P-ext'),
        speed: document.getElementById('input-speed'),
        btnPlay: document.getElementById('btn-play-pause'),
        modeToggle: document.getElementById('mode-toggle'),
        divPControl: document.getElementById('pressure-control'),
        divVControl: document.getElementById('volume-control'),
        sceneDesc: document.getElementById('scenario-desc')
    }
};

// --- 粒子類別 ---
class Particle {
    constructor(type, x, y, v_mag_scale) {
        this.type = type;
        this.props = GAS_TYPES[type];
        this.r = this.props.radius;
        this.mass = this.props.mass;
        this.x = x;
        this.y = y;
        
        const v_mag = v_mag_scale * Math.sqrt(state.temperature / this.mass);
        const angle = Math.random() * Math.PI * 2;
        this.vx = Math.cos(angle) * v_mag;
        this.vy = Math.sin(angle) * v_mag;
        
        this.el = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        this.el.setAttribute("r", this.r);
        this.el.setAttribute("fill", this.props.color);
        this.el.setAttribute("stroke", "#000");
        this.el.setAttribute("stroke-width", "1");
        this.el.setAttribute("opacity", "0.9");
        els.particlesGroup.appendChild(this.el);
    }

    remove() {
        if(this.el.parentNode) this.el.parentNode.removeChild(this.el);
    }
}

// --- 初始化與介面邏輯 ---

function init() {
    els.inputs.T.addEventListener('input', (e) => {
        const newT = +e.target.value;
        changeTemperature(newT);
        document.getElementById('lbl-T').innerText = newT;
    });

    els.inputs.V.addEventListener('input', (e) => {
        if (!state.isIsobaric) setVolume(+e.target.value);
    });

    els.inputs.P_ext.addEventListener('input', (e) => {
        state.targetPressure = +e.target.value;
        document.getElementById('lbl-P-ext').innerText = state.targetPressure.toFixed(1);
    });

    els.inputs.modeToggle.addEventListener('change', (e) => {
        setMode(e.target.checked);
    });

    els.inputs.speed.addEventListener('input', (e) => {
        state.timeScale = +e.target.value;
    });

    setupDragHandle();
    
    // 初始加入
    addParticles('N2', 40);
    requestAnimationFrame(loop);
}

function setMode(isIsobaric) {
    state.isIsobaric = isIsobaric;
    els.inputs.modeToggle.checked = isIsobaric;
    
    if (isIsobaric) {
        els.inputs.divPControl.style.display = 'block';
        els.inputs.divVControl.style.display = 'none'; 
        els.pistonArrow.setAttribute('visibility', 'visible');
        els.extPText.setAttribute('visibility', 'visible');
        els.volumeHandle.style.cursor = 'not-allowed'; 
        showAnnotation("定壓模式：活塞將自動移動");
    } else {
        els.inputs.divPControl.style.display = 'none';
        els.inputs.divVControl.style.display = 'block';
        els.pistonArrow.setAttribute('visibility', 'hidden');
        els.extPText.setAttribute('visibility', 'hidden');
        els.volumeHandle.style.cursor = 'ew-resize';
        showAnnotation("定容模式：手動拖曳體積");
    }
}

function setupDragHandle() {
    let isDragging = false;
    
    // 滑鼠事件
    els.volumeHandle.addEventListener('mousedown', (e) => { 
        if(!state.isIsobaric) isDragging = true; 
    });
    window.addEventListener('mouseup', () => { isDragging = false; });
    window.addEventListener('mousemove', (e) => {
        if (!isDragging || state.isIsobaric) return;
        handleDrag(e.clientX, e.clientY);
    });

    // 手機觸控事件 (重要修正)
    els.volumeHandle.addEventListener('touchstart', (e) => {
        if(!state.isIsobaric) isDragging = true;
        e.preventDefault(); // 防止捲動
    }, {passive: false});
    
    window.addEventListener('touchend', () => { isDragging = false; });
    
    window.addEventListener('touchmove', (e) => {
        if (!isDragging || state.isIsobaric) return;
        const touch = e.touches[0];
        handleDrag(touch.clientX, touch.clientY);
        e.preventDefault();
    }, {passive: false});
}

function handleDrag(clientX, clientY) {
    const point = els.svg.createSVGPoint();
    point.x = clientX; point.y = clientY;
    const svgP = point.matrixTransform(els.svg.getScreenCTM().inverse());
    
    // 容器原點在 (20, 50)
    let newW = svgP.x - 20;
    newW = Math.max(CONFIG.minWidth, Math.min(CONFIG.maxWidth, newW));
    setVolume(newW);
    els.inputs.V.value = newW;
}

function setVolume(w) {
    state.width = w;
    els.wallRect.setAttribute("width", w);
    els.pistonGroup.setAttribute("transform", `translate(${w - 500}, 0)`);
    els.volumeText.setAttribute("x", w / 2);
    document.getElementById('lbl-V').innerText = Math.round(w);
    
    // 邊界檢查：推回粒子
    state.particles.forEach(p => {
        if (p.x > w - p.r) {
            p.x = w - p.r - 1;
            p.vx = -Math.abs(p.vx) * 1.5; 
        }
    });
}

function changeTemperature(newT) {
    if (state.particles.length === 0) {
        state.temperature = newT;
        return;
    }
    const ratio = Math.sqrt(newT / state.temperature);
    state.temperature = newT;
    state.particles.forEach(p => {
        p.vx *= ratio;
        p.vy *= ratio;
    });
}

function addParticles(type, count) {
    const baseScale = 2.0; 
    for(let i=0; i<count; i++) {
        let attempts = 0;
        let x, y, overlapping;
        do {
            x = Math.random() * (state.width - 40) + 20;
            y = Math.random() * (CONFIG.containerHeight - 40) + 20;
            overlapping = false;
            for (let p of state.particles) {
                const dx = x - p.x;
                const dy = y - p.y;
                if (dx*dx + dy*dy < (p.r + 6)**2) {
                    overlapping = true;
                    break;
                }
            }
            attempts++;
        } while(overlapping && attempts < 20);
        
        state.particles.push(new Particle(type, x, y, baseScale));
    }
}

function removeRandomParticles(count) {
    for(let i=0; i<count; i++) {
        if(state.particles.length > 0) {
            const idx = Math.floor(Math.random() * state.particles.length);
            state.particles[idx].remove();
            state.particles.splice(idx, 1);
        }
    }
}

function resetSim() {
    state.particles.forEach(p => p.remove());
    state.particles = [];
    state.pressure = 0;
    state.displayPressure = 0;
}

// --- 物理引擎 (含 Sub-stepping) ---

function updatePhysics() {
    const totalDt = CONFIG.dt * state.timeScale;
    const subStepDt = totalDt / CONFIG.subSteps;

    for (let step = 0; step < CONFIG.subSteps; step++) {
        for (let p of state.particles) {
            p.x += p.vx * subStepDt;
            p.y += p.vy * subStepDt;

            if (p.x > state.width - p.r) {
                p.x = state.width - p.r;
                p.vx = -Math.abs(p.vx);
                state.accumulatedImpulse += 2 * p.mass * Math.abs(p.vx);
            } else if (p.x < p.r) {
                p.x = p.r;
                p.vx = Math.abs(p.vx);
                state.accumulatedImpulse += 2 * p.mass * Math.abs(p.vx);
            }
            if (p.y > CONFIG.containerHeight - p.r) {
                p.y = CONFIG.containerHeight - p.r;
                p.vy = -Math.abs(p.vy);
                state.accumulatedImpulse += 2 * p.mass * Math.abs(p.vy);
            } else if (p.y < p.r) {
                p.y = p.r;
                p.vy = Math.abs(p.vy);
                state.accumulatedImpulse += 2 * p.mass * Math.abs(p.vy);
            }
        }

        for (let i = 0; i < state.particles.length; i++) {
            for (let j = i + 1; j < state.particles.length; j++) {
                const p1 = state.particles[i];
                const p2 = state.particles[j];
                
                const dx = p2.x - p1.x;
                const dy = p2.y - p1.y;
                const distSq = dx*dx + dy*dy;
                const minDist = p1.r + p2.r;

                if (distSq < minDist * minDist) {
                    const dist = Math.sqrt(distSq);
                    const overlap = (minDist - dist) / 2;
                    const nx = dx / dist;
                    const ny = dy / dist;
                    
                    p1.x -= overlap * nx;
                    p1.y -= overlap * ny;
                    p2.x += overlap * nx;
                    p2.y += overlap * ny;
                    
                    const dvx = p1.vx - p2.vx;
                    const dvy = p1.vy - p2.vy;
                    const dot = dvx * nx + dvy * ny;
                    
                    if (dot > 0) continue; 

                    const m1 = p1.mass;
                    const m2 = p2.mass;
                    const factor = (2 * dot) / (m1 + m2);

                    p1.vx -= factor * m2 * nx;
                    p1.vy -= factor * m2 * ny;
                    p2.vx += factor * m1 * nx;
                    p2.vy += factor * m1 * ny;
                }
            }
        }
    }

    if (state.isIsobaric) {
        const diff = state.pressure - state.targetPressure;
        let dV = diff * CONFIG.pistonK * state.timeScale; 
        let newW = state.width + dV;
        newW = Math.max(CONFIG.minWidth, Math.min(CONFIG.maxWidth, newW));
        setVolume(newW);
        els.inputs.V.value = newW;
    }
}

// --- 渲染與數據 ---

function updateStats() {
    const perimeter = 2 * (state.width + CONFIG.containerHeight);
    const rawPressure = state.accumulatedImpulse / (state.timeScale * CONFIG.dt * perimeter);
    
    state.pressure = state.pressure * CONFIG.pressureSmoothing + rawPressure * (1 - CONFIG.pressureSmoothing);
    state.accumulatedImpulse = 0;

    state.displayPressure = state.displayPressure * 0.9 + state.pressure * 0.1;

    if (state.frameCount % 12 === 0) {
        els.table.P.textContent = state.displayPressure.toFixed(2);
        els.table.V.textContent = state.width.toFixed(0);
        els.table.T.textContent = state.temperature.toFixed(0);
        els.table.n.textContent = state.particles.length;
    }
}

function updateHistogram() {
    if (state.frameCount % 6 !== 0) return;

    const bins = new Array(CONFIG.histBins).fill(0);
    const maxSpeed = 25; 
    
    state.particles.forEach(p => {
        const v = Math.sqrt(p.vx**2 + p.vy**2);
        const idx = Math.floor((v / maxSpeed) * CONFIG.histBins);
        if(idx < CONFIG.histBins) bins[idx]++;
    });

    els.histGroup.innerHTML = "";
    const hMax = 180;
    const wTotal = 310;
    const barW = wTotal / CONFIG.histBins;
    const maxCount = Math.max(...bins, 5);

    bins.forEach((c, i) => {
        const h = (c / maxCount) * hMax;
        const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
        rect.setAttribute("x", 20 + i * barW);
        rect.setAttribute("y", 180 - h);
        rect.setAttribute("width", barW - 1);
        rect.setAttribute("height", h);
        rect.setAttribute("class", "bar");
        els.histGroup.appendChild(rect);
    });
    
    drawTheoreticalCurve(28, maxCount, hMax, maxSpeed);
}

function drawTheoreticalCurve(mass, maxCount, hMax, maxSpeed) {
    let path = "M 20 180 ";
    const steps = 40;
    const wTotal = 310;
    const v_p = Math.sqrt(state.temperature / mass); 
    const peakY = v_p * Math.exp(-0.5);
    
    for(let i=0; i<=steps; i++) {
        const v = (i / steps) * maxSpeed;
        const x = 20 + (i / steps) * wTotal;
        const val = (mass * v / state.temperature) * Math.exp(- (mass * v*v) / (2 * state.temperature));
        const y = 180 - (val / peakY) * hMax * 0.8; 
        path += `L ${x} ${y} `;
    }
    els.theoryCurve.setAttribute("d", path);
}

function render() {
    state.particles.forEach(p => {
        p.el.setAttribute("cx", p.x);
        p.el.setAttribute("cy", p.y);
    });
}

function loop() {
    if(state.running) {
        updatePhysics();
        state.frameCount++;
    }
    render();
    updateStats();
    updateHistogram();
    requestAnimationFrame(loop);
}

function togglePlay() {
    state.running = !state.running;
    els.inputs.btnPlay.innerText = state.running ? "暫停 ⏸" : "繼續 ▶";
}

function showAnnotation(text) {
    els.annotation.textContent = text;
    els.annotation.classList.remove("show");
    void els.annotation.offsetWidth; 
    els.annotation.classList.add("show");
}

function resetScenario() {
    setMode(false);
    resetSim();
    addParticles('N2', 40);
}

function scenarioBoyle() {
    resetSim();
    addParticles('N2', 80);
    els.inputs.T.value = 300; changeTemperature(300);
    setVolume(400); els.inputs.V.value = 400;
    setMode(false);
    els.inputs.sceneDesc.innerHTML = "【波以耳定律】P ∝ 1/V。<br>👉 <b>手動改變體積 V</b>，注意壓力變化。";
    showAnnotation("請拖曳容器壁改變體積");
}

function scenarioCharles() {
    resetSim();
    addParticles('N2', 80);
    els.inputs.T.value = 300; changeTemperature(300);
    setMode(true);
    state.targetPressure = 1.0; els.inputs.P_ext.value = 1.0;
    els.inputs.sceneDesc.innerHTML = "【查理定律】V ∝ T。<br>👉 <b>調整溫度 T</b>，體積將自動改變。";
    showAnnotation("請調整溫度 T");
}

function scenarioAvogadro() {
    resetSim();
    addParticles('N2', 40);
    els.inputs.T.value = 300; changeTemperature(300);
    setMode(true);
    state.targetPressure = 1.0; els.inputs.P_ext.value = 1.0;
    els.inputs.sceneDesc.innerHTML = "【亞佛加厥定律】V ∝ n。<br>👉 <b>增加粒子數</b>，觀察體積膨脹。";
    showAnnotation("請點擊按鈕增加粒子");
}

function scenarioGayLussac() {
    resetSim();
    addParticles('N2', 80);
    setVolume(400); els.inputs.V.value = 400;
    setMode(false);
    els.inputs.T.value = 300; changeTemperature(300);
    els.inputs.sceneDesc.innerHTML = "【給呂薩克定律】P ∝ T。<br>👉 <b>調整溫度 T</b>，觀察壓力增加。";
    showAnnotation("請調整溫度 T");
}

function exportImage() {
    const svgData = new XMLSerializer().serializeToString(els.svg);
    const img = new Image();
    img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svgData)));
    img.onload = () => {
        const canvas = document.createElement('canvas');
        canvas.width = 1000; canvas.height = 600;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = "#1e1e1e";
        ctx.fillRect(0,0,1000,600);
        ctx.drawImage(img, 0, 0);
        const a = document.createElement('a');
        a.href = canvas.toDataURL('image/png');
        a.download = 'snapshot.png';
        a.click();
    }
}

init();
