<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>分子結構與混成軌域模擬實驗室 v10.0</title>
    <style>
        /* --- 基礎設定 --- */
        :root {
            --bg-color: #0b101a;
            --panel-bg: #151b26;
            --grid-color: #1c2533;
            --text-main: #ffffff;
            --text-sub: #a0aec0;
            --accent-blue: #3b82f6;
            --accent-purple: #8b5cf6;
            --border-color: #2d3748;
            --accent-green: #10b981;
            --bond-color: #94a3b8; 
        }

        * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color); color: var(--text-main);
            height: 100vh; overflow: hidden; display: flex; flex-direction: column;
        }

        /* 預設為電腦版佈局 (Row) */
        .app-container { display: flex; width: 100%; height: 100%; flex-direction: row; }

        /* 3D 顯示區 */
        .viewport-area {
            flex: 1; position: relative;
            background-image: linear-gradient(var(--grid-color) 1px, transparent 1px), linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 50px 50px; background-position: center center;
            overflow: hidden; cursor: grab;
            touch-action: none; /* 禁止瀏覽器預設的捲動行為，交給 JS 處理 */
        }
        .viewport-area.rotate-mode { cursor: crosshair; }
        .viewport-area.composite-mode { cursor: grab; } 
        .viewport-area:active { cursor: grabbing; } 
        
        #molecule-svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

        /* --- 關鍵修正：讓 SVG 內部元素不攔截滑鼠/觸控事件 --- */
        /* 這樣點擊原子或鍵結時，事件會穿透到 viewport-area，觸發旋轉/平移 */
        #molecule-svg * { pointer-events: none; }
        
        /* 原子標籤 */
        .atom-label-text {
            font-family: Arial, sans-serif; font-weight: 800; text-anchor: middle; 
            dominant-baseline: central; fill: #000000; text-shadow: none;
        }

        /* 控制項 (右上角按鈕) */
        .controls-container {
            position: absolute; top: 25px; right: 25px; z-index: 50; 
            display: flex; gap: 15px; align-items: center; pointer-events: auto;
        }

        .control-button {
            padding: 8px 12px; border-radius: 8px; font-size: 0.95rem; font-weight: 600;
            border: 1px solid var(--border-color); cursor: pointer; transition: all 0.2s;
            background: rgba(30, 38, 51, 0.8); color: var(--text-main);
            backdrop-filter: blur(5px);
        }
        .control-button.mode-pan { background: var(--accent-blue); }
        .control-button.mode-rotate { background: var(--accent-purple); border-color: var(--accent-purple); }
        .control-button.mode-composite { background: var(--accent-green); border-color: var(--accent-green); }

        /* 面板 */
        .controls-area { 
            width: 400px; min-width: 320px;
            background-color: var(--panel-bg); 
            border-left: 1px solid var(--border-color); 
            display: flex; flex-direction: column; 
            padding: 25px; overflow-y: auto; 
            box-shadow: -5px 0 20px rgba(0,0,0,0.4); 
            z-index: 20;
        }
        .card { background: #1e2633; border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        .card-title { font-size: 1.1rem; font-weight: 600; color: var(--accent-blue); margin-bottom: 15px; display: flex; align-items: center; gap: 10px; }
        .data-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .data-label { font-size: 1rem; color: var(--text-sub); }
        .data-value { font-size: 1.15rem; font-weight: bold; font-family: 'Segoe UI', monospace; color: var(--text-main); }
        .data-value sub { font-size: 0.7em; vertical-align: sub; }
        .data-value sup { font-size: 0.7em; vertical-align: super; }

        .hybrid-badge { background: rgba(139, 92, 246, 0.25); color: var(--accent-purple); padding: 4px 10px; border-radius: 6px; font-size: 1rem; }
        
        .input-group { display: flex; gap: 8px; }
        .input-group input { flex-grow: 1; padding: 10px; border: 1px solid var(--border-color); border-radius: 6px; background: #0b101a; color: var(--text-main); font-size: 1rem; }
        .input-group button { padding: 10px 15px; background: var(--accent-blue); color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: background 0.2s; }

        /* 結構切換與開關 */
        #variant-selector {
            display: none;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid var(--accent-green);
            padding: 10px; border-radius: 8px; margin-bottom: 15px;
        }
        .variant-option { display: flex; align-items: center; gap: 10px; margin-bottom: 5px; cursor: pointer; }
        
        .switch-container { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; background: #2d3748; padding: 10px; border-radius: 8px;}
        .switch-container input { width: 20px; height: 20px; cursor: pointer; }

        /* --- RWD 手機版設定 (小於 768px) --- */
        @media (max-width: 768px) {
            .app-container {
                flex-direction: column; /* 改為垂直排列 */
            }

            .viewport-area {
                flex: none; /* 取消自動伸縮 */
                width: 100%;
                height: 60vh; /* 上方顯示佔 60% */
                border-bottom: 1px solid var(--border-color);
            }

            /* 手機版隱藏右上角的模式切換按鈕 */
            .controls-container {
                display: none !important;
            }

            .controls-area {
                width: 100%; 
                flex: 1;
                height: 40vh; /* 下方操作佔 40% */
                border-left: none; 
                border-top: 1px solid var(--border-color); 
                box-shadow: 0 -5px 20px rgba(0,0,0,0.4); 
                padding: 15px;
            }

            .viewport-header h1 { font-size: 1.2rem; }
            .viewport-header span { font-size: 0.9rem; }
        }

    </style>
</head>
<body>

<div class="app-container">
    <div class="viewport-area composite-mode" id="viewport">
        <div class="viewport-header" style="position: absolute; top: 25px; left: 25px; z-index: 10; pointer-events: none;">
            <h1 style="margin: 0; font-size: 1.5rem;">MOLECULAR SIMULATOR v10.0</h1>
            <span style="font-size: 1.1rem; color: var(--text-sub);" id="viewport-subtitle"></span>
        </div>
        
        <div class="controls-container">
            <button id="mode-toggle" class="control-button mode-composite active" onclick="toggleMode()">模式: **複合**</button>
        </div>

        <svg id="molecule-svg" viewBox="-400 -300 800 600" preserveAspectRatio="xMidYMid slice" style="transition: transform 0.1s ease-out; transform: scale(1.7);">
            <defs>
                <filter id="blur-filter" x="-50%" y="-50%" width="200%" height="200%">
                    <fegaussianblur in="SourceGraphic" stdDeviation="5"></fegaussianblur>
                </filter>
            </defs>
            <g id="scene-root"></g>
        </svg>
    </div>

    <div class="controls-area">
        <div class="card">
            <div class="card-title">⚛️ 分子載入</div>
            <div class="input-group">
                <input type="text" id="formula-input" placeholder="Ex: P4O6, C60, N2F2, HCOOCH3..." value="P4O6">
                <button onclick="handleLoadBtn()">載入</button>
            </div>
            <div style="font-size:0.85rem; color:var(--text-sub); margin-top:8px;">
                手機操作: 單指旋轉 / 雙指平移 / 雙指縮放
            </div>
        </div>

        <div class="switch-container">
            <input type="checkbox" id="toggle-lp" checked="" onchange="renderScene()">
            <label for="toggle-lp" style="cursor: pointer; font-weight: bold;">顯示孤對電子 (3D)</label>
        </div>

        <div class="switch-container">
            <input type="checkbox" id="toggle-octet" onchange="reloadCurrentMolecule()">
            <label for="toggle-octet" style="cursor: pointer; font-weight: bold; line-height: 1.4;">
                優先遵循八隅體<br>
                <span style="font-size:0.85rem; color: var(--text-sub); font-weight:normal;">(適用於第三週期中心)</span>
            </label>
        </div>

        <div id="variant-selector" style="display: none;"></div>

        <div class="card">
            <div class="card-title">📊 結構資訊</div>
            <div class="data-row"><span class="data-label">化學式</span><span class="data-value" id="disp-formula"></span></div>
            <div class="data-row"><span class="data-label">中心原子</span><span class="data-value" id="disp-center"></span></div>
            <div class="data-row"><span class="data-label">混成軌域</span><span class="data-value"><span class="hybrid-badge" id="disp-hybrid"></span></span></div>
            <div class="data-row"><span class="data-label">形狀</span><span class="data-value" id="disp-shape"></span></div>
            <div class="data-row"><span class="data-label">鍵角</span><span class="data-value" id="disp-angle"></span></div>
            <div class="data-row">
                <span class="data-label">鍵結統計</span>
                <span class="data-value" id="disp-bonds"></span>
            </div>
        </div>
    </div>
</div>

<script>
// --- 1. 元素性質 ---
    const ELEMENT_PROPS = {
        "H": { ve: 1, c3d: "#FFFFFF", r3d: 12, lp: 0 },
        "He": { ve: 2, c3d: "#d1d5db", r3d: 10, lp: 1 },
        
        // Period 2
        "Li": { ve: 1, c3d: "#CC80FF", r3d: 22, lp: 0 },
        "Be": { ve: 2, c3d: "#94a3b8", r3d: 18, lp: 0 },
        "B": { ve: 3, c3d: "#fbbf24", r3d: 20, lp: 0 },
        "C": { ve: 4, c3d: "#475569", r3d: 20, lp: 0 }, 
        
        // --- 顏色修改區 ---
        "N": { ve: 5, c3d: "#2563eb", r3d: 19, lp: 1 }, // 改為深寶藍
        "O": { ve: 6, c3d: "#ef4444", r3d: 18, lp: 2 },
        "F": { ve: 7, c3d: "#84cc16", r3d: 17, lp: 3 }, // 改為萊姆綠
        // -----------------

        "Ne": { ve: 8, c3d: "#b3e5fc", r3d: 16, lp: 4 },

        // Period 3
        "Na": { ve: 1, c3d: "#AB5CF2", r3d: 24, lp: 0 },
        "Mg": { ve: 2, c3d: "#8AFF00", r3d: 22, lp: 0 },
        "Al": { ve: 3, c3d: "#BFA6A6", r3d: 24, lp: 0 },
        "Si": { ve: 4, c3d: "#a3a3a3", r3d: 24, lp: 0 },
        "P": { ve: 5, c3d: "#f97316", r3d: 23, lp: 0 }, 
        "S": { ve: 6, c3d: "#FFFF00", r3d: 22, lp: 0 }, 
        "Cl": { ve: 7, c3d: "#22c55e", r3d: 21, lp: 3 }, // Cl 是正綠色，F 是萊姆綠，可以區分
        "Ar": { ve: 8, c3d: "#80d8ff", r3d: 20, lp: 4 },

        // Period 4+
        "K":  { ve: 1, c3d: "#8F40D4", r3d: 26, lp: 0 },
        "Ca": { ve: 2, c3d: "#3dff00", r3d: 26, lp: 0 },
        "Ga": { ve: 3, c3d: "#C28F8F", r3d: 24, lp: 0 },
        "Ge": { ve: 4, c3d: "#668f8f", r3d: 24, lp: 0 },
        "As": { ve: 5, c3d: "#bd80e3", r3d: 24, lp: 0 },
        "Se": { ve: 6, c3d: "#ffa100", r3d: 24, lp: 0 },
        "Br": { ve: 7, c3d: "#7f1d1d", r3d: 25, lp: 3 },
        "Kr": { ve: 8, c3d: "#5cb85c", r3d: 24, lp: 3 },
        "Sn": { ve: 4, c3d: "#668080", r3d: 26, lp: 0 },
        "Sb": { ve: 5, c3d: "#9e63b5", r3d: 26, lp: 0 },
        "Te": { ve: 6, c3d: "#d47a00", r3d: 26, lp: 0 },
        "I": { ve: 7, c3d: "#a855f7", r3d: 28, lp: 3 },
        "Xe": { ve: 8, c3d: "#818cf8", r3d: 28, lp: 3 },
        "Pb": { ve: 4, c3d: "#575961", r3d: 28, lp: 0 },
        
        // Transition Metals
        "Mn": { ve: 7, c3d: "#d946ef", r3d: 24, lp: 0 },
        "Cr": { ve: 6, c3d: "#607D8B", r3d: 24, lp: 0 },
        "Fe": { ve: 8, c3d: "#e07a5f", r3d: 24, lp: 0 },
        "Co": { ve: 9, c3d: "#f2cc8f", r3d: 24, lp: 0 },
        "Ni": { ve: 10, c3d: "#81b29a", r3d: 24, lp: 0 },
        "Cu": { ve: 11, c3d: "#e76f51", r3d: 24, lp: 0 },
        "Zn": { ve: 12, c3d: "#7d8597", r3d: 24, lp: 0 },
        "Pt": { ve: 10, c3d: "#d0d1d6", r3d: 26, lp: 0 },
        "Ag": { ve: 11, c3d: "#c0c0c0", r3d: 26, lp: 0 },
        "Au": { ve: 11, c3d: "#ffd700", r3d: 26, lp: 0 }
    };

    // --- 2. 資料庫與渲染邏輯 ---
    let MOLECULE_DB = {};

// 自動判斷孤對電子 (v10.2 修正版：針對 P4O6/P4O10 優化)
    function autoAssignLonePairs(atom, bonds, allAtoms) {
        // 1. 若有手動設定，優先使用
        if (atom.lp3d !== undefined && atom.lp3d.length > 0) return atom.lpCount || atom.lp3d.length;
        if (atom.lpCount !== undefined) return atom.lpCount;

        // 2. 計算鍵結數
        const myBonds = bonds.filter(b => allAtoms[b[0]] === atom || allAtoms[b[1]] === atom);
        const bondCount = myBonds.length;
        const elem = atom.elem;

        // --- 第 15 族 (N, P) ---
        if (['N','P','As','Sb'].includes(elem)) {
            // P4O6 的 P 接 3 個 O -> 1 LP
            // P4O10 的 P 接 4 個 O -> 0 LP
            if (bondCount === 3) return 1;
            if (bondCount === 4) return 0; 
            if (bondCount === 2) return 1; // -N=N-
            if (bondCount === 1) return 1; // N≡C-
        }

        // --- 第 16 族 (O, S) ---
        if (['O','S','Se','Te'].includes(elem)) {
            // 橋接氧 (P-O-P) 接 2 鍵 -> 2 LP
            if (bondCount === 2) return 2;
            
            // 末端氧 (P=O) 接 1 鍵
            if (bondCount === 1) {
                const bondType = myBonds[0][2]; // 讀取鍵結類型
                // 雙鍵 (P=O, C=O) -> 2 LP
                // 單鍵 (-O-) -> 3 LP
                return (bondType === 'double') ? 2 : 3;
            }
        }

        // --- 第 17 族 (F, Cl) ---
        if (['F','Cl','Br','I'].includes(elem)) {
            if (bondCount === 1) return 3;
        }

        return 0;
    }

    function generateElectronDots(atom, centerPos) {
        const dots = [];
        let lpCount = atom.calculatedLP;
        if (lpCount <= 0 && !atom.radical) return dots;

        let vx = atom.x - centerPos.x;
        let vy = atom.y - centerPos.y;
        let vz = atom.z - centerPos.z;
        let dist = Math.sqrt(vx*vx + vy*vy + vz*vz);

        if (dist < 2 && atom.lp3d) {
            atom.lp3d.forEach(lpVector => {
                let vLen = Math.sqrt(lpVector.x**2 + lpVector.y**2 + lpVector.z**2);
                if(vLen === 0) vLen = 1;
                const pushScale = (atom.r * 1.7) / vLen; 
                addPairToDots(dots, atom, { x: lpVector.x * pushScale, y: lpVector.y * pushScale, z: lpVector.z * pushScale });
            });
            return dots;
        }

        if (dist === 0) dist = 1; 
        vx /= dist; vy /= dist; vz /= dist;

        let ux = 0, uy = 1, uz = 0;
        if (Math.abs(vx) < 0.1 && Math.abs(vy) > 0.9) { ux = 1; uy = 0; uz = 0; }
        let dot = ux*vx + uy*vy + uz*vz;
        ux -= dot*vx; uy -= dot*vy; uz -= dot*vz;
        let ulen = Math.sqrt(ux*ux + uy*uy + uz*uz);
        ux/=ulen; uy/=ulen; uz/=ulen;
        let wx = vy*uz - vz*uy; let wy = vz*ux - vx*uz; let wz = vx*uy - vy*ux; 

        const lpDist = atom.r * 1.5; 

        for (let i = 0; i < lpCount; i++) {
            let finalX, finalY, finalZ;
            if (lpCount === 3) {
                const angle = (i * 120) * (Math.PI / 180); 
                const tilt = 0.5; const spread = 0.866;
                const px = ux * Math.cos(angle) + wx * Math.sin(angle);
                const py = uy * Math.cos(angle) + wy * Math.sin(angle);
                const pz = uz * Math.cos(angle) + wz * Math.sin(angle);
                finalX = px * spread + vx * tilt;
                finalY = py * spread + vy * tilt;
                finalZ = pz * spread + vz * tilt;
            } else if (lpCount === 2) {
                const spreadAngle = (i===0 ? 1 : -1) * 55 * (Math.PI/180); 
                finalX = ux * Math.sin(spreadAngle) + vx * Math.cos(spreadAngle);
                finalY = uy * Math.sin(spreadAngle) + vy * Math.cos(spreadAngle);
                finalZ = uz * Math.sin(spreadAngle) + vz * Math.cos(spreadAngle);
            } else {
                finalX = vx; finalY = vy; finalZ = vz;
            }
            let fLen = Math.sqrt(finalX*finalX + finalY*finalY + finalZ*finalZ);
            finalX /= fLen; finalY /= fLen; finalZ /= fLen;
            addPairToDots(dots, atom, { x: finalX*lpDist, y: finalY*lpDist, z: finalZ*lpDist });
        }
        return dots;
    }

    function addPairToDots(dotsArray, atom, vector) {
        let lx = vector.x; let ly = vector.y; let lz = vector.z;
        let ox = -ly, oy = lx, oz = 0;
        if (Math.abs(lx) < 0.1 && Math.abs(ly) < 0.1) { ox = 1; oy = 0; oz = 0; }
        let oLen = Math.sqrt(ox*ox + oy*oy + oz*oz);
        const separation = 8.0; 
        ox = (ox/oLen) * (separation/2); oy = (oy/oLen) * (separation/2); oz = (oz/oLen) * (separation/2);
        dotsArray.push({ x: atom.x + lx + ox, y: atom.y + ly + oy, z: atom.z + lz + oz, isElectron: true });
        if (!atom.radical) {
            dotsArray.push({ x: atom.x + lx - ox, y: atom.y + ly - oy, z: atom.z + lz - oz, isElectron: true });
        }
    }

    const addMol = (key, center, hybrid, shape, angle, atoms, bonds, svgElements, variants = null) => {
        const baseData = {
            center, hybrid: `${hybrid} 混成 (${hybrid})`, shape: `${shape[0]} (${shape[1]})`, angle,
            atomsRaw: atoms,
            bondsRaw: bonds
        };

        if (variants) {
            baseData.variants = {};
            for (let vKey in variants) {
                baseData.variants[vKey] = {
                    ...baseData,
                    atomsRaw: variants[vKey].atoms,
                    bondsRaw: variants[vKey].bonds
                };
            }
        }
        MOLECULE_DB[key] = baseData;
    };

    // --- Geometry Helpers ---
    const di = (e, dist=60) => [{elem:e,x:-dist,y:0,z:0},{elem:e,x:dist,y:0,z:0}];
    const getLinear = (c, o, r=70) => [ {elem:c,x:0,y:0,z:0, lpCount:0}, {elem:o,x:-r,y:0,z:0}, {elem:o,x:r,y:0,z:0} ];
    const getTrigPlanar = (c, o, r=70) => [ {elem:c,x:0,y:0,z:0, lpCount:0}, {elem:o,x:0,y:r,z:0}, {elem:o,x:r*0.866,y:-r*0.5,z:0}, {elem:o,x:-r*0.866,y:-r*0.5,z:0} ];
    const getTetra = (c, o, r=60) => [ {elem:c,x:0,y:0,z:0, lpCount:0}, {elem:o,x:r,y:-r,z:r}, {elem:o,x:-r,y:r,z:r}, {elem:o,x:-r,y:-r,z:-r}, {elem:o,x:r,y:r,z:-r} ];
    const getOcta = (c, o, r=65) => [{elem:c,x:0,y:0,z:0, lpCount:0}, {elem:o,x:r,y:0,z:0}, {elem:o,x:-r,y:0,z:0}, {elem:o,x:0,y:r,z:0}, {elem:o,x:0,y:-r,z:0}, {elem:o,x:0,y:0,z:r}, {elem:o,x:0,y:0,z:-r}];

// ========================================================================
// 1. 元素單質 & 雙原子 (鍵長隨原子半徑調整)
// ========================================================================
['H','N','O','F','Cl','Br','I'].forEach(e=>{let t=(e==='N')?"triple":(e==='O'?"double":"single"),h=(e==='H')?"s-s":(e==='N'?"sp":(e==='O'?"sp²":"sp³")),d=(e==='H'?21:(e==='I'?42:30));addMol(`${e}2`,"雙原子",h,["直線型","Linear"],"-",[{elem:e,x:-d,y:0,z:0},{elem:e,x:d,y:0,z:0}],[[0,1,t]]);});

// CO (參鍵): C與O孤對電子背對背
addMol("CO", "雙原子", "sp", ["直線型","Linear"], "-", [{elem:"C",x:-30,y:0,z:0,lp3d:[{x:-1,y:0,z:0}]}, {elem:"O",x:30,y:0,z:0,lp3d:[{x:1,y:0,z:0}]}], [[0,1,"triple"]]);

// NO (自由基): N上單電子
addMol("NO", "雙原子", "sp²", ["直線型","Linear"], "-", [{elem:"N",x:-30,y:0,z:0,lp3d:[{x:-1,y:0.5,z:0}],radical:true}, {elem:"O",x:30,y:0,z:0}], [[0,1,"double"]]);

// ========================================================================
// 2. 氫化物系列 (HX) - 鍵長依半徑遞增 (F < Cl < Br < I)

(function(){const phi=(1+Math.sqrt(5))/2,scale=28;let rawVerts=[];const groups=[[0,1,3*phi],[1,2+phi,2*phi],[phi,2,2*phi+1]];function addPermutations(u,v,w){const cycles=[[u,v,w],[v,w,u],[w,u,v]];cycles.forEach(p=>{for(let i=0;i<8;i++){let x=p[0]*((i&1)?1:-1),y=p[1]*((i&2)?1:-1),z=p[2]*((i&4)?1:-1);rawVerts.push({x,y,z});}});}groups.forEach(g=>addPermutations(g[0],g[1],g[2]));const atoms=[],threshold=0.1;rawVerts.forEach(v=>{if(!atoms.some(a=>Math.abs(a.x-v.x*scale)<threshold&&Math.abs(a.y-v.y*scale)<threshold&&Math.abs(a.z-v.z*scale)<threshold)){atoms.push({elem:"C",x:v.x*scale,y:v.y*scale,z:v.z*scale,lpCount:0,r:5});}});const bonds=[],bondSet=new Set();for(let i=0;i<atoms.length;i++){let distances=[];for(let j=0;j<atoms.length;j++){if(i===j)continue;let d=(atoms[i].x-atoms[j].x)**2+(atoms[i].y-atoms[j].y)**2+(atoms[i].z-atoms[j].z)**2;distances.push({id:j,dist:d});}distances.sort((a,b)=>a.dist-b.dist);for(let k=0;k<3;k++){let neighbor=distances[k].id,id1=Math.min(i,neighbor),id2=Math.max(i,neighbor),key=`${id1}-${id2}`;if(!bondSet.has(key)){let type=(k===0)?"double":"single";bonds.push([id1,id2,type]);bondSet.add(key);}}}addMol("C60","C","sp²",["球狀 (12個五邊形, 20個六邊形)","Truncated Icosahedron"],"120°",atoms,bonds);})();

    function handleLoadBtn() {
        let val = document.getElementById("formula-input").value.trim();
        
        // 步驟 A: 先查中文表
        let searchTarget = val;
        if (CHINESE_ALIAS[val]) {
            searchTarget = CHINESE_ALIAS[val]; // 如果輸入 "水"，這邊會變成 "H2O"
        }

        // 步驟 B: 用轉換後的代碼去資料庫搜尋 (忽略大小寫與空格)
        let key = Object.keys(MOLECULE_DB).find(k => 
            k.replace(/\s/g,'').toUpperCase() === searchTarget.replace(/\s/g,'').toUpperCase()
        );

        if (key) {
            loadMolecule(key);
        } else {
            alert("資料庫中未找到該分子: " + val);
        }
    }

function loadMolecule(key, variantKey = null) {
        currentKey = key;
        try {
            let data = MOLECULE_DB[key];
            if (!data) throw new Error("Data missing");

            if (variantKey && data.variants && data.variants[variantKey]) {
                data = data.variants[variantKey];
            } else if (data.variants) {
                const firstKey = Object.keys(data.variants)[0];
                data = data.variants[firstKey];
                variantKey = firstKey;
            }

            if (!data.bondsRaw) data.bondsRaw = []; 

            // 複製原始鍵結資料
            let processedBonds = JSON.parse(JSON.stringify(data.bondsRaw)); 
            
            // --- 八隅體模式判斷 (針對一般分子，P4O6/10 結構固定不影響) ---
            const octetSwitch = document.getElementById('toggle-octet');
            const octetMode = octetSwitch ? octetSwitch.checked : false;
            const octetCenters = ["S","P","Cl","Br","I","Xe"]; // P 在此處由結構直接定義，不透過自動降級

            if (octetMode && octetCenters.includes(data.center)) {
                // (保留原本的八隅體降級邏輯...)
                let doublesSeen = 0;
                processedBonds = processedBonds.map(bond => {
                    const atom1 = data.atomsRaw[bond[0]];
                    const atom2 = data.atomsRaw[bond[1]];
                    const isLigand = (atom1.elem === "O" || atom2.elem === "O");
                    if (isLigand && (bond[2] === "double" || bond[2] === "triple")) {
                         // SO3 等分子的特殊處理保留
                         return [bond[0], bond[1], "single"];
                    }
                    return bond;
                });
            }

            // 計算原子與 LP
            const renderObjects = processAtomsData(data.atomsRaw, processedBonds, data.center);

            currentMolecule = {
                ...data,
                renderObjects: renderObjects,
                bonds3D: processedBonds
            };
            
            // --- 重新計算統計數據 ---
            let sigma = 0, pi = 0, totalLP = 0;

            // 1. 鍵結統計
            const shapeStr = Array.isArray(data.shape) ? data.shape[0] : data.shape;
            const isFullerene = shapeStr && (shapeStr.includes("球狀") || shapeStr.includes("籠狀") && !key.includes("P4O")); 
            // P4O6/P4O10 雖然是籠狀，但要用鍵結計算，所以排除 Fullerene 公式

            if (isFullerene && key.startsWith("C")) {
                // 純碳簇用公式
                const n = data.atomsRaw.length;
                sigma = Math.floor(1.5 * n);
                pi = Math.floor(0.5 * n);
                totalLP = 0;
            } else {
                // P4O6, P4O10 與其他分子用鍵結遍歷
                if (currentMolecule.bonds3D) {
                    currentMolecule.bonds3D.forEach(b => {
                        sigma++; 
                        if(b[2] === 'double') pi += 1;
                        if(b[2] === 'triple') pi += 2;
                    });
                }
                // 2. LP 統計
                currentMolecule.renderObjects.forEach(obj => {
                    if (obj.type === 'atom' && obj.calculatedLP !== undefined) {
                        totalLP += obj.calculatedLP;
                    }
                });
            }

            // 更新 UI
            document.getElementById("disp-formula").innerHTML = formatFormula(key);
            document.getElementById("disp-center").textContent = data.center;
            document.getElementById("disp-hybrid").textContent = data.hybrid;
            document.getElementById("disp-shape").textContent = data.shape;
            document.getElementById("disp-angle").textContent = data.angle;
            
            const bondDisp = document.getElementById("disp-bonds");
            if(bondDisp) {
                bondDisp.innerHTML = `&sigma;: ${sigma}, &nbsp; &pi;: ${pi}, &nbsp; LP: ${totalLP}`;
            }

            document.getElementById("viewport-subtitle").textContent = `${key} - ${data.shape}`;
            updateVariantUI(key, variantKey);
            
        } catch (e) {
            console.error("Load Error:", e);
        }
    }


    
    function processAtomsData(atomList, bondList, centerElem) {
        let processed = [];
        let cx=0, cy=0, cz=0;
        if(atomList.length > 0) {
            atomList.forEach(a => { cx+=a.x; cy+=a.y; cz+=a.z; });
            cx /= atomList.length; cy /= atomList.length; cz /= atomList.length;
        }
        const centerPos = {x:cx, y:cy, z:cz};

        atomList.forEach(a => {
            const props = ELEMENT_PROPS[a.elem] || { c3d: "#ccc", r3d: 20 };
            const calcLP = autoAssignLonePairs(a, bondList, atomList);
            const atomObj = { ...a, color: props.c3d, r: props.r3d, type: 'atom', calculatedLP: calcLP };
            processed.push(atomObj);
            
            if(props) {
                const electronDots = generateElectronDots(atomObj, centerPos);
                electronDots.forEach(dot => {
                    processed.push({ ...dot, color: "#ffffff", r: 3.0, type: 'electron' });
                });
            }
        });
        return processed;
    }

    function updateVariantUI(key, activeVariant) {
        const rootData = MOLECULE_DB[key];
        variantSelector.innerHTML = ''; 
        
        if (rootData.variants) {
            variantSelector.style.display = 'block';
            variantSelector.innerHTML = '<div style="font-weight:bold; color:var(--accent-green); margin-bottom:5px;">選擇結構模式:</div>';
            for (let vKey in rootData.variants) {
                const div = document.createElement('div');
                div.className = 'variant-option';
                div.innerHTML = `<input type="radio" name="v" ${vKey === activeVariant ? 'checked' : ''}> <span>${vKey}</span>`;
                div.onclick = () => loadMolecule(key, vKey);
                variantSelector.appendChild(div);
            }
        } else {
            variantSelector.style.display = 'none';
        }
    }

    function project(p, rotX, rotY, panX, panY) {
        let x1 = p.x * Math.cos(rotY) - p.z * Math.sin(rotY);
        let z1 = p.z * Math.cos(rotY) + p.x * Math.sin(rotY);
        let y2 = p.y * Math.cos(rotX) - z1 * Math.sin(rotX);
        let z2 = z1 * Math.cos(rotX) + p.y * Math.sin(rotX);
        // Apply scaling here
        let s = (600 / (600 - z2)) * scale;
        return { x: x1 * s + panX, y: y2 * s + panY, z: z2, scale: s };
    }

    function renderScene() {
        sceneRoot.innerHTML = "";
        if(!currentMolecule) return;
        
        const showLPs = document.getElementById('toggle-lp').checked;
        const renderList = [];
        
        const projectedObjects = currentMolecule.renderObjects.map((obj, i) => {
            const p = project(obj, rotation.x, rotation.y, panOffset.x, panOffset.y);
            return { ...obj, px: p.x, py: p.y, pz: p.z, scale: p.scale, idx: i };
        });

        const atomProjections = projectedObjects.filter(o => o.type === 'atom');

        currentMolecule.bonds3D.forEach(bond => {
            const a1 = atomProjections[bond[0]];
            const a2 = atomProjections[bond[1]];
            if (!a1 || !a2) return;

            const dx = a2.px - a1.px, dy = a2.py - a1.py;
            const dist = Math.sqrt(dx*dx + dy*dy);
            
            if (dist > 0) {
                const nx = dx/dist, ny = dy/dist;
                const bondShorten = 0.6;
                const x1 = a1.px + nx * a1.r * a1.scale * bondShorten;
                const y1 = a1.py + ny * a1.r * a1.scale * bondShorten;
                const x2 = a2.px - nx * a2.r * a2.scale * bondShorten;
                const y2 = a2.py - ny * a2.r * a2.scale * bondShorten;
                
                renderList.push({
                    type: "bond", z: (a1.pz+a2.pz)/2, x1, y1, x2, y2, 
                    style: bond[2]||"single", scale: (a1.scale+a2.scale)/2
                });
            }
        });

        projectedObjects.forEach(obj => {
            if (obj.type === 'electron' && !showLPs) return;
            renderList.push({ ...obj, z: obj.pz });
        });

        renderList.sort((a,b) => a.z - b.z).forEach(obj => {
            if (obj.type === "bond") drawBond(obj);
            else if (obj.type === "atom") drawAtom(obj);
            else if (obj.type === "electron") drawElectron(obj);
        });
    }

    function drawBond(b) {
        const g = createSVG("g");
        const color = "#94a3b8";
        const w = 4 * b.scale; 
        if (b.style === "double") {
            const off = w * 1.2; const dx = b.x2-b.x1, dy = b.y2-b.y1, len = Math.sqrt(dx*dx+dy*dy); const nx = -dy/len * off, ny = dx/len * off;
            g.appendChild(createLine(b.x1+nx, b.y1+ny, b.x2+nx, b.y2+ny, w, color)); g.appendChild(createLine(b.x1-nx, b.y1-ny, b.x2-nx, b.y2-ny, w, color));
        } else if (b.style === "triple") {
            const off = w * 1.8; const dx = b.x2-b.x1, dy = b.y2-b.y1, len = Math.sqrt(dx*dx+dy*dy); const nx = -dy/len * off, ny = dx/len * off;
            g.appendChild(createLine(b.x1+nx, b.y1+ny, b.x2+nx, b.y2+ny, w*0.8, color)); g.appendChild(createLine(b.x1, b.y1, b.x2, b.y2, w, color)); g.appendChild(createLine(b.x1-nx, b.y1-ny, b.x2-nx, b.y2-ny, w*0.8, color));
        } else {
            g.appendChild(createLine(b.x1, b.y1, b.x2, b.y2, w, color));
        }
        sceneRoot.appendChild(g);
    }
    
    function createLine(x1, y1, x2, y2, w, c) {
        const el = document.createElementNS("http://www.w3.org/2000/svg", "line");
        el.setAttribute("x1", x1); el.setAttribute("y1", y1); el.setAttribute("x2", x2); el.setAttribute("y2", y2); el.setAttribute("stroke", c); el.setAttribute("stroke-width", w); el.setAttribute("stroke-linecap", "round");
        return el;
    }

    function drawElectron(e) {
        const c = createSVG("circle");
        c.setAttribute("cx", e.px); c.setAttribute("cy", e.py);
        c.setAttribute("r", e.r * e.scale);
        c.setAttribute("fill", "#ffffff");
        c.setAttribute("opacity", "0.9");
        sceneRoot.appendChild(c);
    }

    function drawAtom(a) {
        const g = createSVG("g");
        const shadow = createSVG("circle");
        shadow.setAttribute("cx", a.px); shadow.setAttribute("cy", a.py); 
        shadow.setAttribute("r", a.r * a.scale * 1.3);
        shadow.setAttribute("fill", a.color); shadow.setAttribute("opacity", "0.5"); shadow.setAttribute("filter", "url(#blur-filter)");
        g.appendChild(shadow);

        const c1 = createSVG("circle");
        c1.setAttribute("cx", a.px); c1.setAttribute("cy", a.py); c1.setAttribute("r", a.r*a.scale); c1.setAttribute("fill", a.color);
        g.appendChild(c1);
        
        const txt = createSVG("text");
        txt.setAttribute("x", a.px); txt.setAttribute("y", a.py + a.r*0.1*a.scale); txt.setAttribute("font-size", a.r*0.8*a.scale); txt.setAttribute("class", "atom-label-text"); txt.textContent = a.elem;
        if (a.elem === "C") txt.setAttribute("fill", "#ffffff"); 
        g.appendChild(txt);
        sceneRoot.appendChild(g);
    }

    function createSVG(type) { return document.createElementNS("http://www.w3.org/2000/svg", type); }

    function animate() {
        if (!isDragging) { rotation.x += 0.003; rotation.y += 0.003; }
        renderScene();
        requestAnimationFrame(animate);
    }

    function setupInteractions() {
        // Keyboard
        window.addEventListener('keydown', (e) => { if (e.key === 'Alt') altKeyIsDown = true; });
        window.addEventListener('keyup', (e) => { if (e.key === 'Alt') altKeyIsDown = false; });
        document.getElementById("formula-input").addEventListener("keypress", (e) => { if (e.key === "Enter") handleLoadBtn(); });

        const handleStart = (x, y) => { isDragging = true; lastMouse = { x, y }; };
        const handleMove = (x, y) => {
            if (!isDragging) return;
            const dx = x - lastMouse.x, dy = y - lastMouse.y;
            if (currentMode === 1 || (currentMode === 2 && altKeyIsDown)) {
                rotation.y += dx * 0.005; rotation.x -= dy * 0.005;
            } else {
                panOffset.x += dx * 0.5; panOffset.y += dy * 0.5;
            }
            lastMouse = { x, y };
        };

        // Mouse Events
        viewport.addEventListener("mousedown", e => handleStart(e.clientX, e.clientY));
        window.addEventListener("mousemove", e => handleMove(e.clientX, e.clientY));
        window.addEventListener("mouseup", () => isDragging = false);
        viewport.addEventListener("wheel", e => {
            scale = Math.max(0.5, Math.min(3, scale - e.deltaY * 0.001));
        });

        // Touch Events (Advanced: 1 finger rotate, 2 fingers pan/zoom)
        viewport.addEventListener("touchstart", e => {
            // If interacting with controls, do nothing
            if(e.target.closest('.control-button')) return;
            
            if(e.touches.length === 1) {
                isDragging = true;
                lastMouse = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            } else if (e.touches.length === 2) {
                isDragging = true;
                const t1 = e.touches[0];
                const t2 = e.touches[1];
                lastTouchDist = Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
                lastTouchCenter = { x: (t1.clientX + t2.clientX)/2, y: (t1.clientY + t2.clientY)/2 };
            }
            // e.preventDefault(); 
            // Removed e.preventDefault() here to let browser handle basic clicks, 
            // but CSS touch-action: none handles scrolling.
        }, { passive: false });

        window.addEventListener("touchmove", e => {
            if(!isDragging) return;
            
            if(e.touches.length === 1) {
                // Rotate
                const dx = e.touches[0].clientX - lastMouse.x;
                const dy = e.touches[0].clientY - lastMouse.y;
                rotation.y += dx * 0.005; 
                rotation.x -= dy * 0.005;
                lastMouse = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            } else if (e.touches.length === 2) {
                // Pan & Zoom
                const t1 = e.touches[0];
                const t2 = e.touches[1];
                const dist = Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
                const center = { x: (t1.clientX + t2.clientX)/2, y: (t1.clientY + t2.clientY)/2 };
                
                // Pan
                const dx = center.x - lastTouchCenter.x;
                const dy = center.y - lastTouchCenter.y;
                panOffset.x += dx * 1.5; 
                panOffset.y += dy * 1.5;
                
                // Zoom
                if (lastTouchDist > 0) {
                    const zoomDelta = (dist - lastTouchDist) * 0.005;
                    scale = Math.max(0.5, Math.min(3, scale + zoomDelta));
                }

                lastTouchDist = dist;
                lastTouchCenter = center;
            }
            e.preventDefault(); // Prevent scroll
        }, { passive: false });

        window.addEventListener("touchend", () => isDragging = false);
    }

// ==================================================
    // ====== 碳簇與富勒烯生成器 (合併 C60 與通用版) ======
    // ==================================================

    function addFullerene(name, n, radius, stretch = 1) {
        const atoms = [];
        
        // --- A. 頂點生成策略 ---
        if (n === 60) {
            // [針對 C60 使用精確截角二十面體座標]
            const phi = (1 + Math.sqrt(5)) / 2; 
            const scale = 28; // C60 專用縮放
            let rawVerts = [];
            
            // 基礎排列: (0,±1,±3ϕ), (±1,±(2+ϕ),±2ϕ), (±ϕ,±2,±(2ϕ+1))
            const groups = [[0, 1, 3*phi], [1, 2+phi, 2*phi], [phi, 2, 2*phi+1]];
            
            groups.forEach(g => {
                // 循環置換與正負號組合
                const cycles = [[g[0],g[1],g[2]], [g[1],g[2],g[0]], [g[2],g[0],g[1]]];
                cycles.forEach(p => {
                    for(let i=0; i<8; i++) {
                        let x = p[0] * ((i & 1) ? 1 : -1);
                        let y = p[1] * ((i & 2) ? 1 : -1);
                        let z = p[2] * ((i & 4) ? 1 : -1);
                        rawVerts.push({x, y, z});
                    }
                });
            });

            // 過濾重複點並縮放
            const threshold = 0.1;
            rawVerts.forEach(v => {
                if(!atoms.some(a => 
                    Math.abs(a.x - v.x*scale) < threshold && 
                    Math.abs(a.y - v.y*scale) < threshold && 
                    Math.abs(a.z - v.z*scale) < threshold
                )) {
                    atoms.push({elem: "C", x: v.x*scale, y: v.y*scale, z: v.z*scale, r: 5, lpCount: 0});
                }
            });

        } else {
            // [針對其他碳數使用黃金螺旋球面算法 (Fibonacci Sphere)]
            const phi = Math.PI * (3 - Math.sqrt(5)); 
            for(let i = 0; i < n; i++) {
                const y = 1 - (i / (n - 1)) * 2; 
                const r = Math.sqrt(1 - y * y);
                const theta = phi * i;

                const x = Math.cos(theta) * r;
                const z = Math.sin(theta) * r;

                atoms.push({
                    elem: "C", 
                    x: x * radius, 
                    y: y * radius * stretch, // 支援橢球拉伸 (如 C70)
                    z: z * radius, 
                    r: 5, // 小半徑顯示鍵結
                    lpCount: 0
                });
            }
        }

        // --- B. 鍵結生成 (尋找最近的 3 個鄰居) ---
        const bonds = [];
        const bondSet = new Set();

        for(let i = 0; i < atoms.length; i++) {
            let dists = [];
            for(let j = 0; j < atoms.length; j++) {
                if(i === j) continue;
                let d = (atoms[i].x - atoms[j].x)**2 + (atoms[i].y - atoms[j].y)**2 + (atoms[i].z - atoms[j].z)**2;
                dists.push({id: j, d: d});
            }
            dists.sort((a, b) => a.d - b.d);
            
            // 連接最近的 3 個
            // 注意：對於 Fibonacci Sphere，這只是近似模擬，可能會有交叉，但能呈現籠狀視覺
            for(let k = 0; k < 3; k++){
                let neighbor = dists[k].id;
                let id1 = Math.min(i, neighbor);
                let id2 = Math.max(i, neighbor);
                let key = `${id1}-${id2}`;
                
                if(!bondSet.has(key)){
                    // 視覺上：最短的那根設為雙鍵 (模擬 6-6 鍵)
                    let type = (k === 0) ? "double" : "single"; 
                    bonds.push([id1, id2, type]);
                    bondSet.add(key);
                }
            }
        }

        // --- C. 計算形狀描述 (歐拉公式) ---
        // 封閉碳籠五邊形固定為 12 個
        // 六邊形數量 = (n/2) - 10
        const numPentagons = 12;
        const numHexagons = (n / 2) - 10;
        
        let shapeName = "球狀";
        if (stretch > 1.1) shapeName = "橄欖球狀";
        
        const shapeDesc = `${shapeName} (${numPentagons}個五邊形, ${numHexagons}個六邊形)`;
        const subDesc = n === 60 ? "Truncated Icosahedron" : "Fullerene";

        addMol(name, "C", "sp²", [shapeDesc, subDesc], "120°", atoms, bonds);
    }

    // --- 執行生成 ---
    // C60 (使用內建精確座標)
    addFullerene("C60", 60, 0); // 半徑參數對 C60 無效，因內部有 scale

    // 其他碳簇 (使用黃金螺旋模擬，半徑需調整以配合鍵長視覺)
    addFullerene("C36", 36, 130);
    addFullerene("C40", 40, 140);
    addFullerene("C50", 50, 160);
    addFullerene("C70", 70, 160, 1.4); // C70 拉長
    addFullerene("C80", 80, 170);
    addFullerene("C100", 100, 190);
