<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>分子結構與混成軌域模擬實驗室 v11.0</title>
<style>
/* --- 1. 基礎設定與變數 --- */
    :root {
        /* [修改] 背景改為全黑 */
        --bg-radial-inner: #000000; 
        --bg-radial-outer: #000000;
        
        /* 玻璃擬態面板保持原樣 */
        --panel-glass: rgba(20, 20, 20, 0.7); /* 面板稍微黑一點配合背景 */
        --panel-border: rgba(255, 255, 255, 0.15);
        --card-glass: rgba(255, 255, 255, 0.05);
        
        --text-main: #f0f4f8;
        --text-sub: #94a3b8;
        --text-highlight: #38bdf8;
        
        --accent-blue: #3b82f6;
        --accent-purple: #8b5cf6;
        --accent-green: #10b981;
    }


    * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }

    body {
        margin: 0; 
        font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        /* 深邃太空背景 */
        background: radial-gradient(circle at center, var(--bg-radial-inner) 0%, var(--bg-radial-outer) 100%);
        color: var(--text-main);
        height: 100vh; overflow: hidden; display: flex; flex-direction: column;
    }

    .app-container { display: flex; width: 100%; height: 100%; flex-direction: row; }

    /* --- 2. 3D 顯示區 --- */
    .viewport-area {
        flex: 1; position: relative;
        /* 網格改為更淡的呼吸感樣式 */
        background-image: 
            linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px), 
            linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
        background-size: 60px 60px; 
        background-position: center center;
        overflow: hidden; cursor: grab;
        touch-action: none;
    }
    .viewport-area:active { cursor: grabbing; } 

    /* 標題特效 */
    .viewport-header h1 {
        margin: 0; font-size: 1.5rem; letter-spacing: 1px;
        text-shadow: 0 0 10px rgba(56, 189, 248, 0.5); /* 霓虹光暈 */
    }

    #molecule-svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
    #molecule-svg * { pointer-events: none; }

    /* 原子標籤 */
    .atom-label-text {
        font-family: 'Roboto Mono', monospace; font-weight: 700; 
        text-anchor: middle; dominant-baseline: central; 
        fill: #ffffff; 
        text-shadow: 0 0 4px #000; /* 增加文字可讀性 */
    }

    /* --- 3. 控制面板 (玻璃擬態) --- */
    .controls-container {
        position: absolute; top: 25px; right: 25px; z-index: 50; 
        display: flex; gap: 15px; align-items: center; pointer-events: auto;
    }

    .control-button {
        padding: 8px 16px; border-radius: 20px; font-size: 0.9rem; font-weight: 600;
        border: 1px solid var(--panel-border); cursor: pointer; transition: all 0.3s;
        background: rgba(0, 0, 0, 0.4); color: var(--text-main);
        backdrop-filter: blur(4px); box-shadow: 0 4px 6px rgba(0,0,0,0.2);
    }
    .control-button:hover { transform: translateY(-2px); box-shadow: 0 0 15px rgba(59, 130, 246, 0.4); border-color: var(--accent-blue); }
    .control-button.active { background: var(--accent-blue); border-color: var(--accent-blue); box-shadow: 0 0 15px var(--accent-blue); }

    .controls-area { 
        width: 400px; min-width: 320px;
        /* 玻璃擬態核心 */
        background-color: var(--panel-glass);
        backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
        border-left: 1px solid var(--panel-border);
        display: flex; flex-direction: column; 
        padding: 25px; overflow-y: auto; 
        box-shadow: -10px 0 30px rgba(0,0,0,0.5); 
        z-index: 20;
    }

    /* 卡片設計 */
    .card { 
        background: var(--card-glass); 
        border: 1px solid var(--panel-border); 
        border-radius: 16px; padding: 20px; margin-bottom: 20px; 
        transition: transform 0.2s;
    }
    .card:hover { border-color: rgba(255,255,255,0.2); }

    .card-title { 
        font-size: 1rem; font-weight: 700; color: var(--text-highlight); 
        margin-bottom: 15px; display: flex; align-items: center; gap: 10px; text-transform: uppercase; letter-spacing: 1px;
    }

    /* 數據行 - 改用等寬字體顯示數值 */
    .data-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .data-label { font-size: 0.9rem; color: var(--text-sub); }
    .data-value { 
        font-family: 'Roboto Mono', 'Courier New', monospace; /* 科技感字體 */
        font-size: 1rem; color: var(--text-main); font-weight: 500;
    }
    
    .input-group { display: flex; gap: 8px; }
    .input-group input { 
        flex-grow: 1; padding: 12px; border: 1px solid var(--panel-border); border-radius: 8px; 
        background: rgba(0,0,0,0.3); color: white; font-family: 'Roboto Mono', monospace;
        transition: border 0.3s; outline: none;
    }
    .input-group input:focus { border-color: var(--accent-blue); }
    .input-group button { 
        padding: 10px 20px; background: var(--accent-blue); color: white; border: none; border-radius: 8px; 
        cursor: pointer; font-weight: bold; transition: all 0.2s; 
        box-shadow: 0 0 10px rgba(59, 130, 246, 0.3);
    }
    .input-group button:hover { background: #2563eb; box-shadow: 0 0 20px rgba(59, 130, 246, 0.6); }

    /* 切換開關樣式優化 */
    .switch-container { 
        display: flex; align-items: center; gap: 10px; margin-bottom: 10px; 
        background: rgba(0,0,0,0.2); padding: 12px; border-radius: 8px; border: 1px solid transparent; transition: border 0.3s;
    }
    .switch-container:hover { border-color: var(--panel-border); }
    .switch-container input { width: 18px; height: 18px; accent-color: var(--accent-green); cursor: pointer; }

    #variant-selector {
        display: none; background: rgba(16, 185, 129, 0.05); border: 1px solid rgba(16, 185, 129, 0.2);
        padding: 15px; border-radius: 12px; margin-bottom: 15px;
    }
    .variant-option { padding: 5px 0; display: flex; align-items: center; gap: 10px; cursor: pointer; color: var(--accent-green); }

/* --- 手機版面板收折控制 (電腦版隱藏) --- */
    #mobile-panel-handle {
        display: none; 
        width: 100%; height: 30px;
        justify-content: center; align-items: center;
        cursor: pointer;
        padding-bottom: 10px; margin-bottom: 10px;
        border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .handle-bar {
        width: 40px; height: 5px;
        background-color: var(--text-sub);
        border-radius: 5px; opacity: 0.5;
    }

    /* --- 手機版樣式覆蓋與優化 (RWD 整合版) --- */
    @media (max-width: 768px) {
        .app-container { flex-direction: column; }
        .controls-container { display: none !important; } /* 隱藏右上角按鈕 */
        #mobile-panel-handle { display: flex; }

        /* 1. 3D 區塊：鎖定瀏覽器預設捲動，讓 JS 獨佔觸控 (解決旋轉卡頓的關鍵) */
        .viewport-area {
            touch-action: none; 
            height: 100vh !important; /* 佔滿全螢幕 */
            padding-bottom: 60px; /* 留空間給收折後的把手 */
            border-bottom: none;
        }

/* 2. 面板動畫設定 */
        .controls-area {
            width: 100%; 
            height: 50vh; /* 面板高度佔螢幕一半 */
            position: absolute; bottom: 0; left: 0;
            
            border-left: none; 
            border-top: 1px solid rgba(255,255,255,0.2);
            border-radius: 20px 20px 0 0;
            
            background-color: rgba(15, 23, 42, 0.98); /* 加深背景，避免看不清楚 */
            z-index: 100;
            
            /* 預設狀態：位置在 0 (展開) */
            transform: translateY(0);
            transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1); /* 物理彈性效果 */
            will-change: transform;
            
            /* 增加陰影讓層次更明顯 */
            box-shadow: 0 -5px 20px rgba(0,0,0,0.5);
        }

        /* 收折狀態：往下位移，只露出最上面 40px (把手區域) */
        .controls-area.minimized {
            transform: translateY(calc(100% - 40px)); 
        }

        
        /* 隱藏收折時的內容，避免誤觸並讓視覺更乾淨 */
        .controls-area.minimized .card, 
        .controls-area.minimized .switch-container {
            opacity: 0.3;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        /* 3. 優化手機版輸入框文字大小 */
        .input-group input {
            font-size: 16px; /* 防止 iOS 自動縮放 */
            padding: 12px;
        }
        .data-row, .card-title {
            font-size: 1.1rem; /* 稍微放大文字 */
        }
    }



</style>
</head>
<body>

<div class="app-container">
    <div class="viewport-area composite-mode" id="viewport">
        <div class="viewport-header" style="position: absolute; top: 25px; left: 25px; z-index: 10; pointer-events: none;">
            <h1 style="margin: 0; font-size: 1.5rem;">MOLECULAR SIMULATOR v11.0</h1>
            <span style="font-size: 1.1rem; color: var(--text-sub);" id="viewport-subtitle"></span>
        </div>
        
        <div class="controls-container">
            <button id="mode-toggle" class="control-button mode-composite active" onclick="toggleMode()">模式: **複合**</button>
        </div>

        <svg id="molecule-svg" viewBox="-400 -300 800 600" preserveAspectRatio="xMidYMid slice" style="transition: transform 0.1s ease-out; transform: scale(1.7);">
            <defs>
                <filter id="blur-filter" x="-50%" y="-50%" width="200%" height="200%">
                    <fegaussianblur in="SourceGraphic" stdDeviation="5"></fegaussianblur>
                </filter>
            </defs>
            <g id="scene-root"></g>
        </svg>
    </div>

    <div class="controls-area">
        <div class="card">
            <div class="card-title">⚛️ 分子載入</div>
            <div class="input-group">
                <input type="text" id="formula-input" placeholder="Ex: P4O6, C60, N2F2, HCOOCH3..." value="P4O6">
                <button onclick="handleLoadBtn()">載入</button>
            </div>
            <div style="font-size:0.85rem; color:var(--text-sub); margin-top:8px;">
                手機操作: 單指旋轉 / 雙指平移 / 雙指縮放
            </div>
        </div>

        <div class="switch-container">
            <input type="checkbox" id="toggle-lp" checked="" onchange="renderScene()">
            <label for="toggle-lp" style="cursor: pointer; font-weight: bold;">顯示孤對電子 (3D)</label>
        </div>

        <div class="switch-container">
            <input type="checkbox" id="toggle-octet" onchange="reloadCurrentMolecule()">
            <label for="toggle-octet" style="cursor: pointer; font-weight: bold; line-height: 1.4;">
                優先遵循八隅體<br>
                <span style="font-size:0.85rem; color: var(--text-sub); font-weight:normal;">(適用於第三週期中心)</span>
            </label>
        </div>

<div id="variant-selector" style="display: none;"></div>

        <div class="card">
            <div class="card-title">📊 結構資訊</div>
            
            <div class="data-row">
                <span class="data-label">化學式</span>
                <span class="data-value" id="disp-formula"></span>
            </div>
            
            <div class="data-row">
                <span class="data-label">中心原子</span>
                <span class="data-value" id="disp-center"></span>
            </div>
            
            <div class="data-row">
                <span class="data-label">混成軌域</span>
                <span class="data-value"><span class="hybrid-badge" id="disp-hybrid"></span></span>
            </div>
            
            <div class="data-row">
                <span class="data-label">形狀</span>
                <span class="data-value" id="disp-shape"></span>
            </div>
            
            <div class="data-row">
                <span class="data-label">鍵角</span>
                <span class="data-value" id="disp-angle"></span>
            </div>
            
            <div class="data-row">
                <span class="data-label">鍵結統計</span>
                <span class="data-value" id="disp-bonds"></span>
            </div>

            <!-- 分子量應該獨立一行，不要包在上面的 div 裡 -->
            <div class="data-row">
                <span class="data-label">分子量</span>
                <span class="data-value" id="disp-mass"></span>
            </div>
        </div>
    </div>
</div>

<script>
// --- 1. 元素性質 (螢光高亮發光風格) ---
const ELEMENT_PROPS = {
    "H":  { ve: 1, c3d: "#FFFFFF", r3d: 12, lp: 0, mass: 1.008 }, 
    "He": { ve: 2, c3d: "#d1d5db", r3d: 10, lp: 1, mass: 4.002 },
    "Li": { ve: 1, c3d: "#d946ef", r3d: 22, lp: 0, mass: 6.94 }, 
    "Be": { ve: 2, c3d: "#94a3b8", r3d: 18, lp: 0, mass: 9.012 },
    "B":  { ve: 3, c3d: "#fbbf24", r3d: 20, lp: 0, mass: 10.81 }, 
    "C":  { ve: 4, c3d: "#64748b", r3d: 20, lp: 0, mass: 12.011 }, // 藍灰色 (截圖同款)
    "N":  { ve: 5, c3d: "#3b82f6", r3d: 19, lp: 1, mass: 14.007 }, 
    "O":  { ve: 6, c3d: "#ef4444", r3d: 18, lp: 2, mass: 15.999 }, 
    "F":  { ve: 7, c3d: "#84cc16", r3d: 17, lp: 3, mass: 18.998 }, 
    "Ne": { ve: 8, c3d: "#67e8f9", r3d: 16, lp: 4, mass: 20.180 },
    "Na": { ve: 1, c3d: "#a855f7", r3d: 24, lp: 0, mass: 22.990 },
    "Mg": { ve: 2, c3d: "#84cc16", r3d: 22, lp: 0, mass: 24.305 },
    "Al": { ve: 3, c3d: "#cbd5e1", r3d: 24, lp: 0, mass: 26.982 },
    "Si": { ve: 4, c3d: "#94a3b8", r3d: 24, lp: 0, mass: 28.085 },
    "P":  { ve: 5, c3d: "#f97316", r3d: 23, lp: 0, mass: 30.974 }, 
    "S":  { ve: 6, c3d: "#FFFF00", r3d: 22, lp: 0, mass: 32.06 }, 
    "Cl": { ve: 7, c3d: "#22c55e", r3d: 21, lp: 3, mass: 35.45 }, // 亮綠色 (截圖同款)
    "Ar": { ve: 8, c3d: "#38bdf8", r3d: 20, lp: 4, mass: 39.948 },
    "K":  { ve: 1, c3d: "#8b5cf6", r3d: 26, lp: 0, mass: 39.098 },
    "Ca": { ve: 2, c3d: "#4ade80", r3d: 26, lp: 0, mass: 40.078 },
    "Br": { ve: 7, c3d: "#b91c1c", r3d: 25, lp: 3, mass: 79.904 }, 
    "I":  { ve: 7, c3d: "#a855f7", r3d: 28, lp: 3, mass: 126.90 }, 
    "Xe": { ve: 8, c3d: "#818cf8", r3d: 28, lp: 3, mass: 131.29 },
    "Mn": { ve: 7, c3d: "#d946ef", r3d: 24, lp: 0, mass: 54.938 },
    "Cr": { ve: 6, c3d: "#64748b", r3d: 24, lp: 0, mass: 51.996 },
    "Fe": { ve: 8, c3d: "#f97316", r3d: 24, lp: 0, mass: 55.845 },
    "Cu": { ve: 11, c3d: "#f59e0b", r3d: 24, lp: 0, mass: 63.546 },
    "Zn": { ve: 12, c3d: "#94a3b8", r3d: 24, lp: 0, mass: 65.38 }, 
    "Ag": { ve: 11, c3d: "#e2e8f0", r3d: 26, lp: 0, mass: 107.87 },
    "Au": { ve: 11, c3d: "#fbbf24", r3d: 26, lp: 0, mass: 196.97 }
};


// --- 2. 資料庫與邏輯升級版 ---
    let MOLECULE_DB = {};

    // 自動判斷 LP 數量 (邏輯不變，但放在這裡整合)
    function autoAssignLonePairs(atom, bonds, allAtoms) {
        if (atom.lp3d !== undefined && atom.lp3d.length > 0) return atom.lpCount || atom.lp3d.length;
        if (atom.lpCount !== undefined) return atom.lpCount;

        const myBonds = bonds.filter(b => allAtoms[b[0]] === atom || allAtoms[b[1]] === atom);
        const bondCount = myBonds.length;
        const elem = atom.elem;

        // Group 15 (N, P)
        if (['N','P','As','Sb'].includes(elem)) {
            if (bondCount === 3) return 1; // sp3 (NH3)
            if (bondCount === 2) return 1; // sp2 (-N=)
            if (bondCount === 1) return 1; // sp (N≡)
        }
        // Group 16 (O, S)
        if (['O','S','Se','Te'].includes(elem)) {
            if (bondCount === 2) return 2; // sp3 (H2O)
            if (bondCount === 1) {
                // 如果接雙鍵(如C=O)則剩2對LP(sp2)，單鍵(-OH)則剩3對(sp3)
                const bond = myBonds[0];
                return (bond[2] === 'double') ? 2 : 3;
            }
        }
        // Group 17 (F, Cl...)
        if (['F','Cl','Br','I'].includes(elem)) {
            if (bondCount === 1) return 3; 
        }
        // Xe
        if (elem === 'Xe') {
             if (bondCount === 2) return 3; // XeF2
             if (bondCount === 4) return 2; // XeF4
        }
        return 0;
    }

    // [核心升級] VSEPR 孤對電子生成器
    function generateElectronDots(atom, atomIndex, allAtoms, allBonds) {
        const dots = [];
        let lpCount = atom.calculatedLP;
        if (lpCount <= 0 && !atom.radical) return dots;

        // 1. 如果有手動指定的 LP 向量，優先使用 (並根據原子半徑縮放)
        if (atom.lp3d && atom.lp3d.length > 0) {
             const pushDist = atom.r * 1.8; // LP 離原子遠一點
             atom.lp3d.forEach(v => {
                 // 正規化向量
                 const len = Math.sqrt(v.x*v.x + v.y*v.y + v.z*v.z) || 1;
                 addPairToDots(dots, atom, { x: (v.x/len)*pushDist, y: (v.y/len)*pushDist, z: (v.z/len)*pushDist });
             });
             return dots;
        }

        // 2. 自動計算 (基於鍵結向量)
        // 找出所有連接到此原子的鍵結向量
        const myBonds = allBonds.filter(b => b[0] === atomIndex || b[1] === atomIndex);
        let bondVectors = [];
        
        myBonds.forEach(b => {
            const otherIdx = (b[0] === atomIndex) ? b[1] : b[0];
            const other = allAtoms[otherIdx];
            // 向量: Atom -> Neighbor
            let vx = other.x - atom.x;
            let vy = other.y - atom.y;
            let vz = other.z - atom.z;
            const len = Math.sqrt(vx*vx + vy*vy + vz*vz) || 1;
            bondVectors.push({ x: vx/len, y: vy/len, z: vz/len, style: b[2] });
        });

        // 計算合向量 (Sum Vector) -> LP 應該在反方向
        let sumX = 0, sumY = 0, sumZ = 0;
        if (bondVectors.length > 0) {
            bondVectors.forEach(v => { sumX += v.x; sumY += v.y; sumZ += v.z; });
        } else {
            // 單原子或者是中心原子無鍵結 (罕見)，預設朝上
            sumX = 0; sumY = -1; sumZ = 0; 
        }

        // 反向向量 (Base direction for LPs)
        let backX = -sumX, backY = -sumY, backZ = -sumZ;
        let backLen = Math.sqrt(backX*backX + backY*backY + backZ*backZ);
        if (backLen < 0.001) { backX=0; backY=1; backZ=0; backLen=1; } // 如果剛好抵銷 (如 CO2 的 C)，隨便指一個方向
        backX /= backLen; backY /= backLen; backZ /= backLen;

        // 建立一組正交基底 (Basis) 用於旋轉計算
        // u = back vector, v, w are perpendicular
        let ux = backX, uy = backY, uz = backZ;
        let tempX = 0, tempY = 1, tempZ = 0;
        if (Math.abs(ux) < 0.1 && Math.abs(uz) < 0.1) { tempX=1; tempY=0; tempZ=0; } // 避免平行
        // w = u cross temp
        let wx = uy*tempZ - uz*tempY;
        let wy = uz*tempX - ux*tempZ;
        let wz = ux*tempY - uy*tempX;
        let wLen = Math.sqrt(wx*wx + wy*wy + wz*wz);
        wx/=wLen; wy/=wLen; wz/=wLen;
        // v = w cross u
        let vx = wy*uz - wz*uy;
        let vy = wz*ux - wx*uz;
        let vz = wx*uy - wy*ux;


        // 3. 根據 LP 數量與雜化軌域分配位置
        const lpDist = atom.r * 2.2; // [修改] LP 距離設為半徑的 2.2 倍 (讓它更大更遠)
        
        // Helper: 加到 dots
        const pushLP = (dx, dy, dz) => {
            addPairToDots(dots, atom, { x: dx*lpDist, y: dy*lpDist, z: dz*lpDist });
        };

        if (bondVectors.length === 1) {
            // --- 末端原子 (Terminal) ---
            const bondType = bondVectors[0].style;
            
            if (lpCount === 3) {
                // sp3 (如 -Cl, -F, -OH): Tripod shape around back vector
                // 就像四面體的三個腳
                const angle = 70 * (Math.PI/180); // 偏離反向軸的角度
                const sinA = Math.sin(angle);
                const cosA = Math.cos(angle);
                
                for(let i=0; i<3; i++) {
                    const theta = i * (120 * Math.PI/180);
                    // Rotate around u axis
                    const px = cosA * ux + sinA * (Math.cos(theta)*vx + Math.sin(theta)*wx);
                    const py = cosA * uy + sinA * (Math.cos(theta)*vy + Math.sin(theta)*wy);
                    const pz = cosA * uz + sinA * (Math.cos(theta)*vz + Math.sin(theta)*wz);
                    pushLP(px, py, pz);
                }
            } else if (lpCount === 2) {
                // sp2 (如 =O, =S): Planar trigonal (120度)
                // LP 應該在平面上，與鍵結成 120 度
                const angle = 60 * (Math.PI/180); // 偏離反向軸 60 度 (總共 120)
                // LP1
                pushLP(Math.cos(angle)*ux + Math.sin(angle)*vx, Math.cos(angle)*uy + Math.sin(angle)*vy, Math.cos(angle)*uz + Math.sin(angle)*vz);
                // LP2 (反方向旋轉)
                pushLP(Math.cos(angle)*ux - Math.sin(angle)*vx, Math.cos(angle)*uy - Math.sin(angle)*vy, Math.cos(angle)*uz - Math.sin(angle)*vz);
            } else if (lpCount === 1) {
                // sp (如 -N, ≡N): Linear
                // 直接在反方向
                pushLP(ux, uy, uz);
            }
        } 
        else if (bondVectors.length === 2) {
            // --- 橋接原子 (Bridging) ---
            // sp3 (如 H2O): 2 Bonds + 2 LPs -> Tetrahedral
            if (lpCount === 2) {
                // 反向向量 ux 剛好指向兩個鍵結的中間
                // LP 應該在垂直於 bond-plane 的平面上打開
                // 我們已經有 v (垂直於 u 和 w)
                // 但這裡的 v 必須垂直於 bond plane。
                // 重新計算 bond plane normal
                let b1 = bondVectors[0], b2 = bondVectors[1];
                let nx = b1.y*b2.z - b1.z*b2.y;
                let ny = b1.z*b2.x - b1.x*b2.z;
                let nz = b1.x*b2.y - b1.y*b2.x;
                let nLen = Math.sqrt(nx*nx + ny*ny + nz*nz);
                if (nLen > 0.001) { nx/=nLen; ny/=nLen; nz/=nLen; } 
                else { nx=vx; ny=vy; nz=vz; } // fallback

                // 兔耳狀 (Rabbit ears): 垂直於鍵結平面，左右打開
                const tilt = 50 * (Math.PI/180); // 打開角度
                // LP1
                pushLP(Math.cos(tilt)*ux + Math.sin(tilt)*nx, Math.cos(tilt)*uy + Math.sin(tilt)*ny, Math.cos(tilt)*uz + Math.sin(tilt)*nz);
                // LP2
                pushLP(Math.cos(tilt)*ux - Math.sin(tilt)*nx, Math.cos(tilt)*uy - Math.sin(tilt)*ny, Math.cos(tilt)*uz - Math.sin(tilt)*nz);
            }
            else if (lpCount === 1) {
                // sp2 (如 -N=): Planar
                // LP 在同一平面上
                 pushLP(ux, uy, uz);
            }
        }
        else {
            // --- 其他情況 (3 bonds + 1 LP 等) ---
            if (lpCount === 1) {
                // sp3 pyramidal (NH3)
                pushLP(ux, uy, uz);
            } else {
                // 剩下的用簡單幾何分佈
                 pushLP(ux, uy, uz); // Fallback
            }
        }

        return dots;
    }



// 輔助：產生兩個電子球 (一對)
    function addPairToDots(dotsArray, atom, vector) {
        let lx = vector.x; let ly = vector.y; let lz = vector.z;
        
        // 找一個垂直向量來分開兩個電子
        let ox = -ly, oy = lx, oz = 0;
        if (Math.abs(lx) < 0.1 && Math.abs(ly) < 0.1) { ox = 1; oy = 0; oz = 0; }
        let oLen = Math.sqrt(ox*ox + oy*oy + oz*oz);
        
        // [修改] 電子對分開距離 (Separation)
        // 從 7.0 改為 14.0，讓它們分得更開
        const separation = 14.0; 
        
        ox = (ox/oLen) * (separation/2); 
        oy = (oy/oLen) * (separation/2); 
        oz = (oz/oLen) * (separation/2);
        
        // 電子半徑維持 4.5
        const eRadius = 4.5;

        // 第一顆電子
        dotsArray.push({ 
            x: atom.x + lx + ox, 
            y: atom.y + ly + oy, 
            z: atom.z + lz + oz, 
            isElectron: true, 
            r: eRadius 
        });

        // 第二顆電子 (如果是自由基 radical 則不加這顆，但通常 LP 都是成對)
        if (!atom.radical) {
            dotsArray.push({ 
                x: atom.x + lx - ox, 
                y: atom.y + ly - oy, 
                z: atom.z + lz - oz, 
                isElectron: true, 
                r: eRadius 
            });
        }
    }

// 8. C60 富勒烯生成器 (邏輯維持不變)
// ========================================================================
(function(){const phi=(1+Math.sqrt(5))/2,scale=28;let rawVerts=[];const groups=[[0,1,3*phi],[1,2+phi,2*phi],[phi,2,2*phi+1]];function addPermutations(u,v,w){const cycles=[[u,v,w],[v,w,u],[w,u,v]];cycles.forEach(p=>{for(let i=0;i<8;i++){let x=p[0]*((i&1)?1:-1),y=p[1]*((i&2)?1:-1),z=p[2]*((i&4)?1:-1);rawVerts.push({x,y,z});}});}groups.forEach(g=>addPermutations(g[0],g[1],g[2]));const atoms=[],threshold=0.1;rawVerts.forEach(v=>{if(!atoms.some(a=>Math.abs(a.x-v.x*scale)<threshold&&Math.abs(a.y-v.y*scale)<threshold&&Math.abs(a.z-v.z*scale)<threshold)){atoms.push({elem:"C",x:v.x*scale,y:v.y*scale,z:v.z*scale,lpCount:0,r:5});}});const bonds=[],bondSet=new Set();for(let i=0;i<atoms.length;i++){let distances=[];for(let j=0;j<atoms.length;j++){if(i===j)continue;let d=(atoms[i].x-atoms[j].x)**2+(atoms[i].y-atoms[j].y)**2+(atoms[i].z-atoms[j].z)**2;distances.push({id:j,dist:d});}distances.sort((a,b)=>a.dist-b.dist);for(let k=0;k<3;k++){let neighbor=distances[k].id,id1=Math.min(i,neighbor),id2=Math.max(i,neighbor),key=`${id1}-${id2}`;if(!bondSet.has(key)){let type=(k===0)?"double":"single";bonds.push([id1,id2,type]);bondSet.add(key);}}}addMol("C60","C","sp²",["球狀 (12個五邊形, 20個六邊形)","Truncated Icosahedron"],"120°",atoms,bonds);})();

    // --- DOM 元素 ---
    const sceneRoot = document.getElementById("scene-root");

    const modeToggleBtn = document.getElementById("mode-toggle");
    const variantSelector = document.getElementById("variant-selector");

// --- 手機面板控制邏輯 (極致滑順版) ---
    const panel = document.getElementById('controls-panel');
    const handle = document.getElementById('mobile-panel-handle');
    
    let startY = 0;       // 手指按下的初始位置
    let currentY = 0;     // 手指當前位置
    let isDraggingPanel = false; // 是否正在拖曳面板

    // 1. 點擊切換 (保留點擊功能，作為備用)
    function toggleMobilePanel() {
        if(panel) panel.classList.toggle('minimized');
    }

    // 2. 滑動拖曳邏輯
    if(handle && panel) {
        // 手指按下
        handle.addEventListener('touchstart', (e) => {
            isDraggingPanel = true;
            startY = e.touches[0].clientY;
            // 拖曳時暫時移除過渡動畫，讓反應最即時
            panel.style.transition = 'none';
        }, {passive: true});

        // 手指移動
        handle.addEventListener('touchmove', (e) => {
            if (!isDraggingPanel) return;
            currentY = e.touches[0].clientY;
            const deltaY = currentY - startY; // 移動距離 (正數=往下, 負數=往上)
            const isClosed = panel.classList.contains('minimized');
            const panelH = panel.offsetHeight;
            
            // 限制拖曳行為
            if (!isClosed) {
                // [展開狀態]：只能往下滑 (deltaY > 0)
                if (deltaY > 0) {
                    panel.style.transform = `translateY(${deltaY}px)`;
                }
            } else {
                // [收起狀態]：只能往上滑 (deltaY < 0)
                // 收起時的基礎偏移量是 (height - 40px)
                const baseOffset = panelH - 40; 
                // 往上滑動時，實際位置 = 基礎偏移 + 負的移動量
                panel.style.transform = `translateY(${baseOffset + deltaY}px)`;
            }
        }, {passive: true});

        // 手指放開
        handle.addEventListener('touchend', (e) => {
            isDraggingPanel = false;
            // 恢復彈性動畫
            panel.style.transition = 'transform 0.3s cubic-bezier(0.25, 1, 0.5, 1)';
            panel.style.transform = ''; // 清除 inline style，讓 class 接手

            const deltaY = currentY - startY;
            const threshold = 60; // 滑動超過 60px 就觸發

            // 如果根本沒動 (或是點擊)，視為切換
            if (Math.abs(deltaY) < 5) {
                // toggleMobilePanel(); // 如果不想點擊觸發，就把這行註解掉
                return;
            }

            if (!panel.classList.contains('minimized')) {
                // [展開狀態] 往下滑動超過閾值 -> 收起
                if (deltaY > threshold) {
                    panel.classList.add('minimized');
                }
            } else {
                // [收起狀態] 往上滑動超過閾值 -> 展開
                if (deltaY < -threshold) {
                    panel.classList.remove('minimized');
                }
            }
        });
    }

    function toggleMode() {
        currentMode = (currentMode + 1) % 3; 
        const modes = ['平移', '旋轉', '複合'];

        let parts = str.split(' ');
        let main = parts[0];
        let charge = parts.length > 1 ? parts[1] : '';
        let formattedMain = main.replace(/(\d+)/g, '<sub>$1</sub>');
        let formattedCharge = charge ? `<sup>${charge}</sup>` : '';
        return formattedMain + formattedCharge;
    }

function loadMolecule(key, variantKey = null) {
        currentKey = key;
        try {
            let data = MOLECULE_DB[key];
            if (!data) throw new Error("Data missing");

            if (variantKey && data.variants && data.variants[variantKey]) {
                data = data.variants[variantKey];
            } else if (data.variants) {
                const firstKey = Object.keys(data.variants)[0];
                data = data.variants[firstKey];
                variantKey = firstKey;
            }

            if (!data.bondsRaw) data.bondsRaw = []; 

            // 複製原始鍵結資料
            let processedBonds = JSON.parse(JSON.stringify(data.bondsRaw)); 
            
            // --- 八隅體模式判斷 (針對一般分子，P4O6/10 結構固定不影響) ---
            const octetSwitch = document.getElementById('toggle-octet');
            const octetMode = octetSwitch ? octetSwitch.checked : false;
            const octetCenters = ["S","P","Cl","Br","I","Xe"]; // P 在此處由結構直接定義，不透過自動降級

            if (octetMode && octetCenters.includes(data.center)) {
                // (保留原本的八隅體降級邏輯...)
                let doublesSeen = 0;
                processedBonds = processedBonds.map(bond => {
                    const atom1 = data.atomsRaw[bond[0]];
                    const atom2 = data.atomsRaw[bond[1]];
                    const isLigand = (atom1.elem === "O" || atom2.elem === "O");
                    if (isLigand && (bond[2] === "double" || bond[2] === "triple")) {
                         // SO3 等分子的特殊處理保留
                         return [bond[0], bond[1], "single"];
                    }
                    return bond;
                });
            }

            // 計算原子與 LP
            const renderObjects = processAtomsData(data.atomsRaw, processedBonds, data.center);

            currentMolecule = {
                ...data,
                renderObjects: renderObjects,
                bonds3D: processedBonds
            };
            
            // --- 重新計算統計數據 ---
            let sigma = 0, pi = 0, totalLP = 0;

            // 1. 鍵結統計
            const shapeStr = Array.isArray(data.shape) ? data.shape[0] : data.shape;
            const isFullerene = shapeStr && (shapeStr.includes("球狀") || shapeStr.includes("籠狀") && !key.includes("P4O")); 
            // P4O6/P4O10 雖然是籠狀，但要用鍵結計算，所以排除 Fullerene 公式

            if (isFullerene && key.startsWith("C")) {
                // 純碳簇用公式
                const n = data.atomsRaw.length;
                sigma = Math.floor(1.5 * n);
                pi = Math.floor(0.5 * n);
                totalLP = 0;
            } else {
                // P4O6, P4O10 與其他分子用鍵結遍歷
                if (currentMolecule.bonds3D) {
                    currentMolecule.bonds3D.forEach(b => {
                        sigma++; 
                        if(b[2] === 'double') pi += 1;
                        if(b[2] === 'triple') pi += 2;
                    });
                }
                // 2. LP 統計
                currentMolecule.renderObjects.forEach(obj => {
                    if (obj.type === 'atom' && obj.calculatedLP !== undefined) {
                        totalLP += obj.calculatedLP;
                    }
                });
            }

            // 更新 UI
            document.getElementById("disp-formula").innerHTML = formatFormula(key);
            document.getElementById("disp-center").textContent = data.center;
            document.getElementById("disp-hybrid").textContent = data.hybrid;
            document.getElementById("disp-shape").textContent = data.shape;
            document.getElementById("disp-angle").textContent = data.angle;
            
// --- 更新鍵結統計 UI ---
            const bondDisp = document.getElementById("disp-bonds");
            if(bondDisp) {
                bondDisp.innerHTML = `&sigma;: ${sigma}, &nbsp; &pi;: ${pi}, &nbsp; LP: ${totalLP}`;
            }

            // --- 新增：計算並更新分子量 ---
            let totalMass = 0;
            if (data.atomsRaw) {
                data.atomsRaw.forEach(a => {
                    const props = ELEMENT_PROPS[a.elem];
                    // 確保該元素有定義且有原子量數據
                    if (props && props.mass) {
                        totalMass += props.mass;
                    }
                });
            }
            
            const massDisp = document.getElementById("disp-mass");
            if (massDisp) {
                // 取小數點後兩位，若計算為0則顯示 N/A
                massDisp.textContent = totalMass > 0 ? `${totalMass.toFixed(2)} g/mol` : "N/A";
            }
            // --------------------------------

            document.getElementById("viewport-subtitle").textContent = `${key} - ${data.shape}`;
            updateVariantUI(key, variantKey);
            
        } catch (e) {
            console.error("Load Error:", e);
        }
    }





    
    // 更新資料處理 (傳入 allAtoms 和 bonds)
function processAtomsData(atomList, bondList, centerElem) {
        let processed = [];
        let cx=0, cy=0, cz=0;
        if(atomList.length > 0) {
            atomList.forEach(a => { cx+=a.x; cy+=a.y; cz+=a.z; });
            cx /= atomList.length; cy /= atomList.length; cz /= atomList.length;
        }

        // 先把所有原子轉成物件
        const atomObjects = atomList.map(a => {
            const props = ELEMENT_PROPS[a.elem] || { c3d: "#ccc", r3d: 20 };
            return { ...a, color: props.c3d, r: props.r3d, type: 'atom' };
        });

        // 計算 LP 並生成電子點
        atomObjects.forEach((atomObj, idx) => {
            // 1. 計算 LP 數量
            const calcLP = autoAssignLonePairs(atomObj, bondList, atomObjects);
            atomObj.calculatedLP = calcLP;
            processed.push(atomObj);

            // 2. 生成電子點
            if (ELEMENT_PROPS[atomObj.elem]) { 
                const electronDots = generateElectronDots(atomObj, idx, atomObjects, bondList);
                electronDots.forEach(dot => {
                    // [這裡修改] 將原本的 #fbbf24 改為 #ffffff
                    processed.push({ ...dot, color: "#ffffff", type: 'electron' }); 
                });
            }
        });
        return processed;
    }

    function project(p, rotX, rotY, panX, panY) {
        let x1 = p.x * Math.cos(rotY) - p.z * Math.sin(rotY);
        let z1 = p.z * Math.cos(rotY) + p.x * Math.sin(rotY);
        let y2 = p.y * Math.cos(rotX) - z1 * Math.sin(rotX);
        let z2 = z1 * Math.cos(rotX) + p.y * Math.sin(rotX);
        // Apply scaling here
        let s = (600 / (600 - z2)) * scale;
        return { x: x1 * s + panX, y: y2 * s + panY, z: z2, scale: s };
    }



// --- 繪圖核心邏輯 (霓虹發光風格 v11.0) ---

function renderScene() {
        sceneRoot.innerHTML = "";
        if(!currentMolecule) return;
        
        // 1. 建立 SVG 定義區 (Defs)
        const defs = createSVG("defs");
        
        // (A) 柔和光暈濾鏡 (Soft Glow) - 模仿截圖中的發光感
        const filter = document.createElementNS("http://www.w3.org/2000/svg", "filter");
        filter.setAttribute("id", "soft-glow");
        filter.setAttribute("x", "-50%"); filter.setAttribute("y", "-50%");
        filter.setAttribute("width", "200%"); filter.setAttribute("height", "200%");
        // stdDeviation="3.5" 這個數值能產生截圖中那種邊緣模糊但不過份擴散的效果
        filter.innerHTML = '<feGaussianBlur in="SourceGraphic" stdDeviation="3.5" />';
        defs.appendChild(filter);

        // (B) 建立球體光澤漸層 (Glossy Gradients)
        // 這是讓球體看起來立體的關鍵，根據原子顏色動態生成
        const usedColors = new Set();
        currentMolecule.renderObjects.forEach(obj => {
            if (obj.type === 'atom') usedColors.add(obj.color);
        });

        usedColors.forEach(color => {
            const cleanColor = color.replace('#','');
            const gradId = `atom-grad-${cleanColor}`;
            
            const grad = document.createElementNS("http://www.w3.org/2000/svg", "radialGradient");
            grad.setAttribute("id", gradId);
            // 亮點偏左上 (30%, 30%)，製造立體感
            grad.setAttribute("cx", "30%"); grad.setAttribute("cy", "30%"); 
            grad.setAttribute("r", "70%");
            
            // 漸層：亮白(高光) -> 原子本色 -> 深色(陰影)
            let startColor = lightenColor(color, 60); // 亮點
            if (color === '#FFFFFF') startColor = "#FFFFFF";
            let endColor = darkenColor(color, 40);    // 陰影

            grad.innerHTML = `
                <stop offset="0%" stop-color="${startColor}" />
                <stop offset="45%" stop-color="${color}" />
                <stop offset="100%" stop-color="${endColor}" />
            `;
            defs.appendChild(grad);
        });

        sceneRoot.appendChild(defs);

        // ... (以下邏輯保持不變) ...
        const showLPs = document.getElementById('toggle-lp').checked;
        const renderList = [];
        
        const projectedObjects = currentMolecule.renderObjects.map((obj, i) => {
            const p = project(obj, rotation.x, rotation.y, panOffset.x, panOffset.y);
            return { ...obj, px: p.x, py: p.y, pz: p.z, scale: p.scale, idx: i };
        });

        const atomProjections = projectedObjects.filter(o => o.type === 'atom');

        currentMolecule.bonds3D.forEach((bond, index) => { 
            const a1 = atomProjections[bond[0]];
            const a2 = atomProjections[bond[1]];
            if (!a1 || !a2) return;

            const dx = a2.px - a1.px, dy = a2.py - a1.py;
            const dist = Math.sqrt(dx*dx + dy*dy);
            
            if (dist > 0) {
                const nx = dx/dist, ny = dy/dist;
                const bondShorten = 0.6;
                const x1 = a1.px + nx * a1.r * a1.scale * bondShorten;
                const y1 = a1.py + ny * a1.r * a1.scale * bondShorten;
                const x2 = a2.px - nx * a2.r * a2.scale * bondShorten;
                const y2 = a2.py - ny * a2.r * a2.scale * bondShorten;
                
                renderList.push({
                    type: "bond", z: (a1.pz+a2.pz)/2, x1, y1, x2, y2, 
                    style: bond[2]||"single", scale: (a1.scale+a2.scale)/2,
                    c1: a1.color, c2: a2.color, bondIdx: index
                });
            }
        });

        projectedObjects.forEach(obj => {
            if (obj.type === 'electron' && !showLPs) return;
            if (obj.type !== 'bond') renderList.push({ ...obj, z: obj.pz });
        });

        renderList.sort((a,b) => a.z - b.z).forEach(obj => {
            if (obj.type === "bond") drawBond(obj);
            else if (obj.type === "atom") drawAtom(obj);
            else if (obj.type === "electron") drawElectron(obj);
        });
    }

// 輔助：顏色變亮/變暗 (用於漸層計算)
    function lightenColor(col, amt) {
        let usePound = false;
        if (col[0] == "#") { col = col.slice(1); usePound = true; }
        let num = parseInt(col,16);
        let r = (num >> 16) + amt; if (r > 255) r = 255; else if  (r < 0) r = 0;
        let b = ((num >> 8) & 0x00FF) + amt; if (b > 255) b = 255; else if  (b < 0) b = 0;
        let g = (num & 0x0000FF) + amt; if (g > 255) g = 255; else if (g < 0) g = 0;
        return (usePound?"#":"") + (g | (b << 8) | (r << 16)).toString(16).padStart(6,'0');
    }
    function darkenColor(col, amt) { return lightenColor(col, -amt); }



    function drawBond(b) {
        const g = createSVG("g");
        // 如果是純白(H)，鍵結稍微灰一點以免太亮
        let c1 = b.c1 === "#FFFFFF" ? "#cbd5e1" : b.c1;
        let c2 = b.c2 === "#FFFFFF" ? "#cbd5e1" : b.c2;
        
        const gradId = `bond-grad-${b.bondIdx}`;
        let defs = sceneRoot.querySelector("defs");
        
        // 建立漸層
        const grad = document.createElementNS("http://www.w3.org/2000/svg", "linearGradient");
        grad.setAttribute("id", gradId);
        grad.setAttribute("gradientUnits", "userSpaceOnUse");
        grad.setAttribute("x1", b.x1); grad.setAttribute("y1", b.y1);
        grad.setAttribute("x2", b.x2); grad.setAttribute("y2", b.y2);
        
        // 使用螢光色漸層，讓鍵結也稍微發光
        grad.innerHTML = `<stop offset="0%" stop-color="${c1}"/><stop offset="40%" stop-color="${c1}"/><stop offset="60%" stop-color="${c2}"/><stop offset="100%" stop-color="${c2}"/>`; 
        defs.appendChild(grad);

        const strokeUrl = `url(#${gradId})`;
        const w = 8 * b.scale; 

        // 畫線 helper
        const drawLine = (ox, oy, width, color, opacity=1, filter="") => {
            const el = document.createElementNS("http://www.w3.org/2000/svg", "line");
            el.setAttribute("x1", b.x1+ox); el.setAttribute("y1", b.y1+oy); 
            el.setAttribute("x2", b.x2+ox); el.setAttribute("y2", b.y2+oy); 
            el.setAttribute("stroke", color); 
            el.setAttribute("stroke-width", width); 
            el.setAttribute("stroke-linecap", "round");
            if(opacity < 1) el.setAttribute("opacity", opacity);
            if(filter) el.setAttribute("filter", filter);
            return el;
        };
        const dx = b.x2-b.x1, dy = b.y2-b.y1, len = Math.sqrt(dx*dx+dy*dy);
        const nx = -dy/len, ny = dx/len;

        // 加一層發光底層 (Glow behind bond)
        g.appendChild(drawLine(0, 0, w*1.2, strokeUrl, 0.4, "url(#soft-blur)"));

        if (b.style === "double") {
            const off = w * 0.55; const subW = w * 0.45;
            g.appendChild(drawLine(nx*off, ny*off, subW, strokeUrl));
            g.appendChild(drawLine(-nx*off, -ny*off, subW, strokeUrl));
            // 高光
            g.appendChild(drawLine(nx*off, ny*off, subW*0.3, "#fff", 0.5));
            g.appendChild(drawLine(-nx*off, -ny*off, subW*0.3, "#fff", 0.5));
        } else if (b.style === "triple") {
            const off = w * 0.75; const subW = w * 0.35;
            g.appendChild(drawLine(nx*off, ny*off, subW, strokeUrl));
            g.appendChild(drawLine(0, 0, subW*1.1, strokeUrl));
            g.appendChild(drawLine(-nx*off, -ny*off, subW, strokeUrl));
        } else {
            // 單鍵
            g.appendChild(drawLine(0, 0, w, strokeUrl));
            // 高光 (讓它像玻璃管)
            g.appendChild(drawLine(nx*w*0.2, ny*w*0.2, w*0.3, "#ffffff", 0.4));
        }
        sceneRoot.appendChild(g);
    }

function drawAtom(a) {
        const g = createSVG("g");
        
        // H 顏色修正
        const displayColor = (a.elem === "H" && a.color === "#FFFFFF") ? "#FFFFFF" : a.color;
        const cleanColor = a.color.replace('#','');
        const gradUrl = `url(#atom-grad-${cleanColor})`;

        // 1. 背後柔光層 (Glow) - 模仿截圖中的氣場
        const glow = createSVG("circle");
        glow.setAttribute("cx", a.px); glow.setAttribute("cy", a.py); 
        glow.setAttribute("r", a.r * a.scale * 1.3); // 比本體大一點
        glow.setAttribute("fill", displayColor); 
        glow.setAttribute("opacity", "0.5"); // 適中的亮度
        glow.setAttribute("filter", "url(#soft-glow)"); // 柔邊
        g.appendChild(glow);

        // 2. 實體層 (Glossy Sphere) - [修正] 使用漸層，且無邊框
        const circle = createSVG("circle");
        circle.setAttribute("cx", a.px); circle.setAttribute("cy", a.py); 
        circle.setAttribute("r", a.r * a.scale); 
        circle.setAttribute("fill", gradUrl); // 使用上面建立的光澤漸層
        // [關鍵] 不設定 stroke (無外圈)
        g.appendChild(circle);

        // 3. 文字標籤 (維持黑色粗體)
        const txt = createSVG("text");
        txt.setAttribute("x", a.px); txt.setAttribute("y", a.py); 
        txt.setAttribute("font-size", a.r * 0.75 * a.scale); 
        txt.setAttribute("class", "atom-label-text"); 
        txt.textContent = a.elem;
        
        // 黑色字體，無陰影
        txt.style.fill = "#000000"; 
        txt.style.fontWeight = "900";
        txt.style.textShadow = "none";
        
        g.appendChild(txt);
        sceneRoot.appendChild(g);
    }

function drawElectron(e) {
        const g = createSVG("g");

        // 1. 淡淡的光暈

    function createSVG(type) { return document.createElementNS("http://www.w3.org/2000/svg", type); }



    function animate() {
        if (!isDragging) { rotation.x += 0.003; rotation.y += 0.003; }
        renderScene();
        requestAnimationFrame(animate);
    }

function setupInteractions() {
        // Keyboard
        window.addEventListener('keydown', (e) => { if (e.key === 'Alt') altKeyIsDown = true; });
        window.addEventListener('keyup', (e) => { if (e.key === 'Alt') altKeyIsDown = false; });
        document.getElementById("formula-input").addEventListener("keypress", (e) => { if (e.key === "Enter") handleLoadBtn(); });

        // --- 滑鼠操作 (電腦版) ---
        const handleStart = (x, y) => { isDragging = true; lastMouse = { x, y }; };
        const handleMove = (x, y) => {
            if (!isDragging) return;
            const dx = x - lastMouse.x, dy = y - lastMouse.y;
            if (currentMode === 1 || (currentMode === 2 && altKeyIsDown)) {
                rotation.y += dx * 0.005; rotation.x -= dy * 0.005;
            } else {
                panOffset.x += dx * 0.5; panOffset.y += dy * 0.5;
            }
            lastMouse = { x, y };
        };

        viewport.addEventListener("mousedown", e => handleStart(e.clientX, e.clientY));
        window.addEventListener("mousemove", e => handleMove(e.clientX, e.clientY));
        window.addEventListener("mouseup", () => isDragging = false);
        viewport.addEventListener("wheel", e => {
            scale = Math.max(0.5, Math.min(4, scale - e.deltaY * 0.001));
        });

        // --- 觸控操作 (手機版核心優化) ---
        // 使用 passive: false 是為了能呼叫 preventDefault() 禁止瀏覽器畫面捲動
        viewport.addEventListener("touchstart", e => {
            // 如果點到按鈕，不攔截
            if(e.target.closest('.control-button')) return;
            
            // 防止瀏覽器預設行為 (如捲動頁面、縮放網頁)
            e.preventDefault(); 

            if(e.touches.length === 1) {
                isDragging = true;
                lastMouse = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            } else if (e.touches.length === 2) {
                isDragging = true;
                const t1 = e.touches[0];
                const t2 = e.touches[1];
                
                // 紀錄初始狀態
                lastTouchDist = Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
                lastTouchCenter = { x: (t1.clientX + t2.clientX)/2, y: (t1.clientY + t2.clientY)/2 };
                lastTouchAngle = Math.atan2(t2.clientY - t1.clientY, t2.clientX - t1.clientX);
            }
        }, { passive: false });

        window.addEventListener("touchmove", e => {
            if(!isDragging) return;
            
            // 禁止捲動，保證流暢
            e.preventDefault(); 

            if(e.touches.length === 1) {
                // 單指：X/Y 軸旋轉 (靈敏度 0.008 -> 絲滑感)
                const dx = e.touches[0].clientX - lastMouse.x;
                const dy = e.touches[0].clientY - lastMouse.y;
                rotation.y += dx * 0.008; 
                rotation.x -= dy * 0.008;
                lastMouse = { x: e.touches[0].clientX, y: e.touches[0].clientY };
                
            } else if (e.touches.length === 2) {
                const t1 = e.touches[0];
                const t2 = e.touches[1];
                
                // A. 平移 (Pan) - 跟隨手指中心
                const center = { x: (t1.clientX + t2.clientX)/2, y: (t1.clientY + t2.clientY)/2 };
                const dx = center.x - lastTouchCenter.x;
                const dy = center.y - lastTouchCenter.y;
                panOffset.x += dx * 1.5; 
                panOffset.y += dy * 1.5;
                lastTouchCenter = center;
                
                // B. 縮放 (Zoom) - 雙指開合
                const dist = Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
                if (lastTouchDist > 0) {
                    const zoomDelta = (dist - lastTouchDist) * 0.008;
                    scale = Math.max(0.3, Math.min(5, scale + zoomDelta));
                }
                lastTouchDist = dist;

                // C. 旋轉 Z軸 (Rotate Z) - 雙指扭轉
                const angle = Math.atan2(t2.clientY - t1.clientY, t2.clientX - t1.clientX);
                const angleDelta = angle - lastTouchAngle;
                // 防止角度跳變 (當跨越 180/-180 度時)
                if (Math.abs(angleDelta) < 1.0) {
                    rotation.z += angleDelta * 1.5; // 稍微加速 Z 軸旋轉手感
                }
                lastTouchAngle = angle;
            }
        }, { passive: false });

        window.addEventListener("touchend", () => isDragging = false);
    }

    // ====== 碳簇與富勒烯生成器 (合併 C60 與通用版) ======
    // ==================================================

    function addFullerene(name, n, radius, stretch = 1) {
        const atoms = [];
        
        // --- A. 頂點生成策略 ---
        if (n === 60) {
            // [針對 C60 使用精確截角二十面體座標]
            const phi = (1 + Math.sqrt(5)) / 2; 
            const scale = 28; // C60 專用縮放
            let rawVerts = [];
            
            // 基礎排列: (0,±1,±3ϕ), (±1,±(2+ϕ),±2ϕ), (±ϕ,±2,±(2ϕ+1))
            const groups = [[0, 1, 3*phi], [1, 2+phi, 2*phi], [phi, 2, 2*phi+1]];
            
            groups.forEach(g => {
                // 循環置換與正負號組合
                const cycles = [[g[0],g[1],g[2]], [g[1],g[2],g[0]], [g[2],g[0],g[1]]];
                cycles.forEach(p => {
                    for(let i=0; i<8; i++) {
                        let x = p[0] * ((i & 1) ? 1 : -1);
                        let y = p[1] * ((i & 2) ? 1 : -1);
                        let z = p[2] * ((i & 4) ? 1 : -1);
                        rawVerts.push({x, y, z});
                    }
                });
            });

            // 過濾重複點並縮放
            const threshold = 0.1;
            rawVerts.forEach(v => {
                if(!atoms.some(a => 
                    Math.abs(a.x - v.x*scale) < threshold && 
                    Math.abs(a.y - v.y*scale) < threshold && 
                    Math.abs(a.z - v.z*scale) < threshold
                )) {
                    atoms.push({elem: "C", x: v.x*scale, y: v.y*scale, z: v.z*scale, r: 5, lpCount: 0});
                }
            });

        } else {
            // [針對其他碳數使用黃金螺旋球面算法 (Fibonacci Sphere)]
            const phi = Math.PI * (3 - Math.sqrt(5)); 
            for(let i = 0; i < n; i++) {
                const y = 1 - (i / (n - 1)) * 2; 
                const r = Math.sqrt(1 - y * y);
                const theta = phi * i;

                const x = Math.cos(theta) * r;
                const z = Math.sin(theta) * r;

                atoms.push({
                    elem: "C", 
                    x: x * radius, 
                    y: y * radius * stretch, // 支援橢球拉伸 (如 C70)
                    z: z * radius, 
                    r: 5, // 小半徑顯示鍵結
                    lpCount: 0
                });
            }
        }

        // --- B. 鍵結生成 (尋找最近的 3 個鄰居) ---
        const bonds = [];
        const bondSet = new Set();

        for(let i = 0; i < atoms.length; i++) {
            let dists = [];
            for(let j = 0; j < atoms.length; j++) {
                if(i === j) continue;
                let d = (atoms[i].x - atoms[j].x)**2 + (atoms[i].y - atoms[j].y)**2 + (atoms[i].z - atoms[j].z)**2;
                dists.push({id: j, d: d});
            }
            dists.sort((a, b) => a.d - b.d);
            
            // 連接最近的 3 個
            // 注意：對於 Fibonacci Sphere，這只是近似模擬，可能會有交叉，但能呈現籠狀視覺
            for(let k = 0; k < 3; k++){
                let neighbor = dists[k].id;
                let id1 = Math.min(i, neighbor);
                let id2 = Math.max(i, neighbor);
                let key = `${id1}-${id2}`;
                
                if(!bondSet.has(key)){
                    // 視覺上：最短的那根設為雙鍵 (模擬 6-6 鍵)
                    let type = (k === 0) ? "double" : "single"; 
                    bonds.push([id1, id2, type]);
                    bondSet.add(key);
                }
            }
        }

        // --- C. 計算形狀描述 (歐拉公式) ---
        // 封閉碳籠五邊形固定為 12 個
        // 六邊形數量 = (n/2) - 10
        const numPentagons = 12;
        const numHexagons = (n / 2) - 10;
        
        let shapeName = "球狀";
        if (stretch > 1.1) shapeName = "橄欖球狀";
        
        const shapeDesc = `${shapeName} (${numPentagons}個五邊形, ${numHexagons}個六邊形)`;
        const subDesc = n === 60 ? "Truncated Icosahedron" : "Fullerene";

        addMol(name, "C", "sp²", [shapeDesc, subDesc], "120°", atoms, bonds);
    }

    // --- 執行生成 ---
    // C60 (使用內建精確座標)
    addFullerene("C60", 60, 0); // 半徑參數對 C60 無效，因內部有 scale

    // 其他碳簇 (使用黃金螺旋模擬，半徑需調整以配合鍵長視覺)
    addFullerene("C36", 36, 130);
    addFullerene("C40", 40, 140);
    addFullerene("C50", 50, 160);
    addFullerene("C70", 70, 160, 1.4); // C70 拉長
    addFullerene("C80", 80, 170);
    addFullerene("C100", 100, 190);
