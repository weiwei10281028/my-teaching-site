<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>蛋白質結構教學系統 V4.0</title>
    <link rel="stylesheet" type="text/css" href="https://www.ebi.ac.uk/pdbe/pdb-component-library/css/pdbe-molstar-light-3.1.2.css">
    <script type="text/javascript" src="https://www.ebi.ac.uk/pdbe/pdb-component-library/js/pdbe-molstar-plugin-3.1.2.js"></script>
    <style>
        :root { --primary: #007bff; --bg: #ffffff; }
        body { margin: 0; padding: 0; font-family: sans-serif; display: flex; height: 100vh; overflow: hidden; background: #fff; }
        #main-container { display: flex; width: 100%; height: 100%; }
        #sidebar { width: 300px; background: #f8f9fa; border-right: 1px solid #ddd; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; }
        
        .section-title { font-size: 13px; font-weight: bold; color: #555; margin: 15px 0 8px 0; text-transform: uppercase; border-bottom: 1px solid #eee; padding-bottom: 4px; }
        
        .protein-btn { width: 100%; padding: 10px; margin-bottom: 5px; border: 1px solid #ddd; border-radius: 6px; cursor: pointer; background: #fff; text-align: left; }
        .protein-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

        .control-group { background: #fff; border: 1px solid #eee; border-radius: 8px; padding: 10px; margin-bottom: 10px; }
        .control-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .control-item:last-child { margin-bottom: 0; }
        .label-text { font-size: 14px; color: #333; }

        input[type="range"] { width: 100%; margin-top: 5px; }

        /* Switch Style */
        .switch { position: relative; display: inline-block; width: 34px; height: 20px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 20px; }
        .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--primary); }
        input:checked + .slider:before { transform: translateX(14px); }

        #viewer-container { flex: 1; position: relative; }
        #myViewer { width: 100%; height: 100%; }
        
        /* 隱藏 PDBe 原生控制介面 */
        .msp-layout-region-right, .msp-plugin-control-side-menu, .msp-layout-region-bottom { display: none !important; }
    </style>
</head>
<body>

<div id="main-container">
    <div id="sidebar">
        <div class="section-title">Structure Selection</div>
        <div id="protein-list">
            <div class="protein-btn active" onclick="changeProtein('1ubq', this)">1UBQ (Ubiquitin)</div>
            <div class="protein-btn" onclick="changeProtein('1zni', this)">1ZNI (Insulin)</div>
            <div class="protein-btn" onclick="changeProtein('1mbn', this)">1MBN (Myoglobin)</div>
        </div>

        <div class="section-title">Settings / Controls</div>
        <div class="control-group">
            <div class="control-item">
                <span class="label-text">Animate</span>
                <label class="switch"><input type="checkbox" id="check-animate" onchange="updateSettings()"><span class="slider"></span></label>
            </div>
            <div class="control-item">
                <span class="label-text">Outline</span>
                <label class="switch"><input type="checkbox" id="check-outline" onchange="updateSettings()"><span class="slider"></span></label>
            </div>
            <div class="control-item">
                <span class="label-text">Fog</span>
                <label class="switch"><input type="checkbox" id="check-fog" onchange="updateSettings()"><span class="slider"></span></label>
            </div>
            <div class="section-title" style="border:none; margin:10px 0 0 0;">Clipping</div>
            <input type="range" id="range-clipping" min="0" max="100" value="0" oninput="updateSettings()">
        </div>

        <div class="section-title">Components</div>
        <div class="control-group">
            <div class="control-item">
                <span class="label-text">Polymer</span>
                <label class="switch"><input type="checkbox" id="comp-polymer" checked onchange="updateComponents()"><span class="slider"></span></label>
            </div>
            <div class="control-item">
                <span class="label-text">Water</span>
                <label class="switch"><input type="checkbox" id="comp-water" onchange="updateComponents()"><span class="slider"></span></label>
            </div>
        </div>
    </div>
    
    <div id="viewer-container"><div id="myViewer"></div></div>
</div>

<script>
    var viewerInstance = new PDBeMolstarPlugin();
    var options = {
        moleculeId: '1ubq',
        pdbeUrl: 'https://www.ebi.ac.uk/pdbe/',
        loadEmpty: false,
        hideControls: true,
        bgColor: {r: 255, g: 255, b: 255},
        visualStyle: 'cartoon'
    };

    window.onload = function() {
        viewerInstance.render(document.getElementById('myViewer'), options);
        // 初始化延遲，確保外掛載入完成
        setTimeout(initUI, 1500);
    };

    function initUI() {
        if (!viewerInstance.plugin) return;
        
        // 強制初始化環境：關閉水分子，確保 Cartoon 顯示
        updateComponents();
        updateSettings();
        
        // 徹底阻斷「對焦淡化」邏輯
        viewerInstance.plugin.canvas3d.setProps({
            renderer: {
                dimAlpha: 1.0,
                highlightAlpha: 1.0,
                selectAlpha: 1.0
            }
        });
        // 設定點擊不縮放
        viewerInstance.plugin.managers.interactivity.setProps({
            props: { click: 'select' }
        });
    }

    function updateSettings() {
        if (!viewerInstance.plugin) return;
        
        const isAnimate = document.getElementById('check-animate').checked;
        const isOutline = document.getElementById('check-outline').checked;
        const isFog = document.getElementById('check-fog').checked;
        const clipVal = document.getElementById('range-clipping').value;

        // 旋轉控制
        viewerInstance.visual.toggleSpin(isAnimate);

        // 渲染控制 (Outline, Fog)
        viewerInstance.plugin.canvas3d.setProps({
            postprocessing: {
                outline: { name: isOutline ? 'on' : 'off', params: {} }
            },
            cameraFog: isFog ? { name: 'on', params: { intensity: 50 } } : { name: 'off', params: {} }
        });

        // 裁切控制 (Clipping)
        // 將滑桿 0-100 對應到近端剪裁面
        viewerInstance.plugin.canvas3d.setProps({
            camera: {
                helper: { axes: { name: 'off', params: {} } },
                manualReset: false
            },
            cameraClipping: {
                radiusContext: 0,
                far: true,
                near: true,
                // 滑桿控制 near plane 的距離百分比
                minNear: parseFloat(clipVal)
            }
        });
    }

    function updateComponents() {
        const polymer = document.getElementById('comp-polymer').checked;
        const water = document.getElementById('comp-water').checked;

        // PDBe API 控制組件顯示
        viewerInstance.visual.visibility({
            polymer: polymer,
            water: water
        });

        // 確保水分子預設不顯示骨架以外的東西 (Fo-Fc 等)
        viewerInstance.visual.update({
            hideWater: !water,
            visualStyle: 'cartoon'
        });
    }

    function changeProtein(pdbId, btn) {
        document.querySelectorAll('.protein-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        viewerInstance.visual.update({
            moleculeId: pdbId,
            visualStyle: 'cartoon'
        });

        // 重新同步 UI 狀態
        setTimeout(() => {
            initUI();
            viewerInstance.visual.focus();
        }, 1000);
    }
</script>

</body>
</html>
