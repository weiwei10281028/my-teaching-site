<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>蛋白質結構教學系統</title>
    <!-- 引入 PDBe Molstar 資源 -->
    <link rel="stylesheet" type="text/css" href="https://www.ebi.ac.uk/pdbe/pdb-component-library/css/pdbe-molstar-light-3.1.2.css">
    <script type="text/javascript" src="https://www.ebi.ac.uk/pdbe/pdb-component-library/js/pdbe-molstar-plugin-3.1.2.js"></script>
    <style>
        body { margin: 0; padding: 0; font-family: "Microsoft JhengHei", sans-serif; display: flex; height: 100vh; overflow: hidden; background: #fff; }
        
        /* 左側選單欄 */
        #sidebar { 
            width: 280px; background: #ffffff; border-right: 1px solid #ddd; 
            display: flex; flex-direction: column; padding: 20px; z-index: 1000; 
            box-shadow: 2px 0 5px rgba(0,0,0,0.05); 
        }
        .section-title { font-size: 16px; font-weight: bold; margin: 20px 0 10px 0; color: #333; border-bottom: 2px solid #f0f0f0; padding-bottom: 5px; }
        .section-title:first-child { margin-top: 0; }

        /* 蛋白質切換按鈕 */
        .protein-btn { 
            padding: 12px 15px; margin-bottom: 8px; border: 1px solid #e0e0e0; border-radius: 6px;
            cursor: pointer; transition: 0.2s; background: #fff; font-size: 14px; color: #444;
        }
        .protein-btn:hover { background: #f8f9fa; border-color: #007bff; }
        .protein-btn.active { background: #007bff; color: white; border-color: #007bff; }

        /* --- 獨立製作的組件控制區 (符合你的需求) --- */
        .component-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px; margin-bottom: 5px; background: #fcfcfc; border: 1px solid #eee; border-radius: 6px;
        }
        .component-info { display: flex; flex-direction: column; }
        .comp-name { font-size: 14px; font-weight: bold; color: #333; }
        .comp-style { font-size: 12px; color: #888; }
        
        /* 眼睛按鈕樣式 (模擬原版) */
        .eye-btn {
            cursor: pointer; font-size: 20px; transition: 0.2s; user-select: none;
            width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
            border-radius: 4px;
        }
        .eye-btn:hover { background: #eee; }
        .eye-btn.hidden { opacity: 0.3; filter: grayscale(1); }

        /* 右側渲染區 */
        #viewer-container { flex: 1; position: relative; background: #fff; }
        #myViewer { width: 100%; height: 100%; }

        /* 強制隱藏右側所有官方面板與雜項按鈕 */
        .msp-layout-region-right, .msp-plugin-control-side-menu, .msp-layout-region-bottom { 
            display: none !important; 
        }
        canvas { background: #ffffff !important; }
    </style>
</head>
<body>

<div id="sidebar">
    <div class="section-title">選擇蛋白質</div>
    <div id="protein-list">
        <div class="protein-btn active" onclick="changeProtein('1zni', this)">胰島素 (Insulin)</div>
        <div class="protein-btn" onclick="changeProtein('1mbn', this)">肌紅蛋白 (Myoglobin)</div>
        <div class="protein-btn" onclick="changeProtein('1ema', this)">綠色螢光蛋白 (GFP)</div>
        <div class="protein-btn" onclick="changeProtein('1ubq', this)">泛素 (Ubiquitin)</div>
    </div>

    <div class="section-title">組件顯示控制 (Components)</div>
    
    <!-- 獨立製作的 Polymer 控制項 -->
    <div class="component-item">
        <div class="component-info">
            <span class="comp-name">聚合物 (Polymer)</span>
            <span class="comp-style">樣式: 卡通圖 (Cartoon)</span>
        </div>
        <div class="eye-btn" id="eye-polymer" onclick="toggleVisibility('polymer')">👁️</div>
    </div>

    <!-- 獨立製作的 Water 控制項 -->
    <div class="component-item">
        <div class="component-info">
            <span class="comp-name">結晶水 (Water)</span>
            <span class="comp-style">樣式: 球棍模型 (Ball & Stick)</span>
        </div>
        <div class="eye-btn" id="eye-water" onclick="toggleVisibility('water')">👁️</div>
    </div>
</div>

<div id="viewer-container">
    <div id="myViewer"></div>
</div>

<script>
    var viewerInstance = new PDBeMolstarPlugin();
    var currentVisibility = { polymer: true, water: true };

    var options = {
        customData: { url: './1zni.cif', format: 'cif' },
        expanded: false,       // 關閉官方側欄，我們用自己做的
        hideControls: true,    // 隱藏官方控制項
        bgColor: {r: 255, g: 255, b: 255},
        pixelRatio: window.devicePixelRatio * 2, // 高清晰度
        quality: 'highest'
    };

    window.onload = function() {
        viewerInstance.render(document.getElementById('myViewer'), options);
        
        // 確保初次載入也是白背景
        setTimeout(() => {
            if(viewerInstance.canvas) viewerInstance.canvas.setBgColor({r: 255, g: 255, b: 255});
        }, 1000);
    };

    /**
     * 獨立控制顯示/隱藏的函式
     */
    function toggleVisibility(type) {
        currentVisibility[type] = !currentVisibility[type];
        
        // 更新眼睛圖示 UI
        const btn = document.getElementById('eye-' + type);
        if (currentVisibility[type]) {
            btn.classList.remove('hidden');
            btn.innerText = '👁️';
        } else {
            btn.classList.add('hidden');
            btn.innerText = '❌'; // 或者使用另一個閉眼圖示
        }

        // 調用 Molstar API 切換顯示
        viewerInstance.visual.visibility({
            polymer: currentVisibility.polymer,
            water: currentVisibility.water
        });
    }

    function changeProtein(fileName, element) {
        document.querySelectorAll('.protein-btn').forEach(btn => btn.classList.remove('active'));
        element.classList.add('active');

        viewerInstance.visual.update({
            customData: { url: './' + fileName + '.cif', format: 'cif' },
            hideWater: false
        });

        // 重置按鈕狀態為顯示
        currentVisibility.polymer = true;
        currentVisibility.water = true;
        document.querySelectorAll('.eye-btn').forEach(b => {
            b.classList.remove('hidden');
            b.innerText = '👁️';
        });

        setTimeout(() => { 
            viewerInstance.visual.focus(); 
            viewerInstance.canvas.setBgColor({r: 255, g: 255, b: 255});
        }, 500);
    }
</script>

</body>
</html>
