<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>蛋白質結構教學系統 V5.0</title>
    <link rel="stylesheet" type="text/css" href="https://www.ebi.ac.uk/pdbe/pdb-component-library/css/pdbe-molstar-light-3.1.2.css">
    <script type="text/javascript" src="https://www.ebi.ac.uk/pdbe/pdb-component-library/js/pdbe-molstar-plugin-3.1.2.js"></script>
    <style>
        :root { --primary: #007bff; }
        body { margin: 0; padding: 0; font-family: -apple-system, sans-serif; display: flex; height: 100vh; overflow: hidden; background: #fff; }
        #sidebar { width: 300px; background: #fff; border-right: 1px solid #ddd; padding: 20px; overflow-y: auto; z-index: 10; }
        .section-title { font-size: 12px; font-weight: bold; color: #888; margin: 20px 0 10px 0; text-transform: uppercase; letter-spacing: 1px; }
        .protein-btn { width: 100%; padding: 12px; margin-bottom: 6px; border: 1px solid #eee; border-radius: 8px; cursor: pointer; background: #fff; text-align: left; }
        .protein-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
        .control-group { background: #f9f9f9; border-radius: 12px; padding: 12px; margin-bottom: 12px; }
        .control-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .label-text { font-size: 14px; font-weight: 500; }
        input[type="range"] { width: 100%; cursor: pointer; margin-top: 10px; }
        /* Switch UI */
        .switch { position: relative; display: inline-block; width: 40px; height: 22px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 22px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--primary); }
        input:checked + .slider:before { transform: translateX(18px); }
        #viewer-container { flex: 1; position: relative; background: #fff; }
        #myViewer { width: 100%; height: 100%; }
        .msp-layout-region-right, .msp-plugin-control-side-menu, .msp-layout-region-bottom { display: none !important; }
    </style>
</head>
<body>

<div id="sidebar">
    <div class="section-title">Structure Selection</div>
    <div id="protein-list">
        <div class="protein-btn active" onclick="changeProtein('1ubq', this)">1UBQ (Ubiquitin)</div>
        <div class="protein-btn" onclick="changeProtein('1zni', this)">1ZNI (Insulin)</div>
        <div class="protein-btn" onclick="changeProtein('1mbn', this)">1MBN (Myoglobin)</div>
    </div>

    <div class="section-title">Settings / Controls</div>
    <div class="control-group">
        <div class="control-item">
            <span class="label-text">Animate (Spin)</span>
            <label class="switch"><input type="checkbox" id="check-animate" onchange="applyAllSettings()"><span class="slider"></span></label>
        </div>
        <div class="control-item">
            <span class="label-text">Outline</span>
            <label class="switch"><input type="checkbox" id="check-outline" onchange="applyAllSettings()"><span class="slider"></span></label>
        </div>
        <div class="control-item">
            <span class="label-text">Fog</span>
            <label class="switch"><input type="checkbox" id="check-fog" onchange="applyAllSettings()"><span class="slider"></span></label>
        </div>
        <div class="section-title" style="margin:10px 0 5px 0; border:none;">Clipping ( 透視 )</div>
        <input type="range" id="range-clipping" min="0" max="100" value="0" oninput="applyAllSettings()">
    </div>

    <div class="section-title">Components</div>
    <div class="control-group">
        <div class="control-item">
            <span class="label-text">Polymer (Cartoon)</span>
            <label class="switch"><input type="checkbox" id="comp-polymer" checked onchange="syncComponents()"><span class="slider"></span></label>
        </div>
        <div class="control-item">
            <span class="label-text">Water (Red Dots)</span>
            <label class="switch"><input type="checkbox" id="comp-water" onchange="syncComponents()"><span class="slider"></span></label>
        </div>
    </div>
</div>

<div id="viewer-container">
    <div id="myViewer"></div>
</div>

<script>
    var viewerInstance = new PDBeMolstarPlugin();
    var options = {
        moleculeId: '1ubq',
        hideControls: true,
        bgColor: {r: 255, g: 255, b: 255},
        visualStyle: 'cartoon',
        loadEmpty: false
    };

    window.onload = function() {
        viewerInstance.render(document.getElementById('myViewer'), options);
        
        // 強力初始化循環
        var readyTimer = setInterval(() => {
            if (viewerInstance.plugin) {
                setupCoreEngine();
                syncComponents();
                applyAllSettings();
                clearInterval(readyTimer);
            }
        }, 500);
    };

    // 初始化引擎底層設定
    function setupCoreEngine() {
        const p = viewerInstance.plugin;
        
        // 1. 禁用點擊淡化與縮放，確保 100% 實心
        p.managers.interactivity.setProps({ props: { click: 'select' } });
        p.canvas3d.setProps({
            renderer: { 
                backgroundColor: {r: 1, g: 1, b: 1},
                dimAlpha: 1.0, 
                highlightAlpha: 1.0, 
                selectAlpha: 1.0 
            }
        });
    }

    // 解決組件開關失效的問題
    function syncComponents() {
        if (!viewerInstance.plugin) return;
        const p = viewerInstance.plugin;
        
        const showPolymer = document.getElementById('comp-polymer').checked;
        const showWater = document.getElementById('comp-water').checked;

        // 直接從 Mol* 組件管理器抓取所有結構組件
        const components = p.managers.structure.component.state.components;
        
        components.forEach(c => {
            const label = c.cell.obj.label.toLowerCase();
            if (label.includes('polymer')) {
                p.managers.structure.component.setVisibility([c], showPolymer);
            }
            if (label.includes('water') || label.includes('solvent')) {
                p.managers.structure.component.setVisibility([c], showWater);
            }
        });
    }

    // 解決 Fog 黑屏與 Clipping 失效的問題
    function applyAllSettings() {
        if (!viewerInstance.plugin) return;
        const p = viewerInstance.plugin;

        const isAnimate = document.getElementById('check-animate').checked;
        const isOutline = document.getElementById('check-outline').checked;
        const isFog = document.getElementById('check-fog').checked;
        const clipVal = parseInt(document.getElementById('range-clipping').value);

        // 旋轉
        viewerInstance.visual.toggleSpin(isAnimate);

        // 渲染參數更新
        p.canvas3d.setProps({
            postprocessing: {
                // Outline 修正
                outline: { 
                    name: isOutline ? 'on' : 'off', 
                    params: { scale: 1, threshold: 0.1, color: {r: 0, g: 0, b: 0} } 
                }
            },
            // Fog 修正：強制 Fog 顏色為白色，防止黑屏
            cameraFog: isFog ? { 
                name: 'on', 
                params: { intensity: 50, color: {r: 1, g: 1, b: 1} } 
            } : { name: 'off', params: {} },
            
            // Clipping 修正
            cameraClipping: {
                radiusContext: 0,
                far: true,
                near: true,
                minNear: clipVal
            }
        });

        // 補丁：確保背景色不跳掉
        viewerInstance.canvas.setBgColor({r: 255, g: 255, b: 255});
    }

    function changeProtein(pdbId, btn) {
        document.querySelectorAll('.protein-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        viewerInstance.visual.update({
            moleculeId: pdbId,
            visualStyle: 'cartoon'
        });

        // 模型換完後，強制執行所有同步
        setTimeout(() => {
            setupCoreEngine();
            syncComponents();
            applyAllSettings();
            viewerInstance.visual.focus();
        }, 1500);
    }
</script>

</body>
</html>
