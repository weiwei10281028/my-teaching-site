<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>蛋白質結構教學系統 V4.1</title>
    <link rel="stylesheet" type="text/css" href="https://www.ebi.ac.uk/pdbe/pdb-component-library/css/pdbe-molstar-light-3.1.2.css">
    <script type="text/javascript" src="https://www.ebi.ac.uk/pdbe/pdb-component-library/js/pdbe-molstar-plugin-3.1.2.js"></script>
    <style>
        :root { --primary: #007bff; --bg: #ffffff; }
        body { margin: 0; padding: 0; font-family: sans-serif; display: flex; height: 100vh; overflow: hidden; background: #fff; }
        #main-container { display: flex; width: 100%; height: 100%; }
        #sidebar { width: 300px; background: #fff; border-right: 1px solid #ddd; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; box-shadow: 2px 0 5px rgba(0,0,0,0.05); }
        
        .section-title { font-size: 12px; font-weight: bold; color: #888; margin: 20px 0 10px 0; text-transform: uppercase; letter-spacing: 1px; }
        
        .protein-btn { width: 100%; padding: 12px; margin-bottom: 6px; border: 1px solid #eee; border-radius: 8px; cursor: pointer; background: #fff; text-align: left; transition: 0.2s; }
        .protein-btn:hover { background: #f0f7ff; }
        .protein-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

        .control-group { background: #f9f9f9; border-radius: 12px; padding: 12px; margin-bottom: 12px; }
        .control-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .control-item:last-child { margin-bottom: 0; }
        .label-text { font-size: 14px; font-weight: 500; color: #333; }

        input[type="range"] { width: 100%; margin-top: 10px; cursor: pointer; }

        .switch { position: relative; display: inline-block; width: 40px; height: 22px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 22px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--primary); }
        input:checked + .slider:before { transform: translateX(18px); }

        #viewer-container { flex: 1; position: relative; background: #fff; }
        #myViewer { width: 100%; height: 100%; }
        .msp-layout-region-right, .msp-plugin-control-side-menu, .msp-layout-region-bottom { display: none !important; }
    </style>
</head>
<body>

<div id="main-container">
    <div id="sidebar">
        <div class="section-title">Structure Selection</div>
        <div id="protein-list">
            <div class="protein-btn active" onclick="changeProtein('1ubq', this)">1UBQ (Ubiquitin)</div>
            <div class="protein-btn" onclick="changeProtein('1zni', this)">1ZNI (Insulin)</div>
            <div class="protein-btn" onclick="changeProtein('1mbn', this)">1MBN (Myoglobin)</div>
        </div>

        <div class="section-title">Settings / Controls</div>
        <div class="control-group">
            <div class="control-item">
                <span class="label-text">Animate (Spin)</span>
                <label class="switch"><input type="checkbox" id="check-animate" onchange="applySettings()"><span class="slider"></span></label>
            </div>
            <div class="control-item">
                <span class="label-text">Outline</span>
                <label class="switch"><input type="checkbox" id="check-outline" onchange="applySettings()"><span class="slider"></span></label>
            </div>
            <div class="control-item">
                <span class="label-text">Fog</span>
                <label class="switch"><input type="checkbox" id="check-fog" onchange="applySettings()"><span class="slider"></span></label>
            </div>
            <div class="section-title" style="margin: 15px 0 5px 0; border: none;">Clipping ( 透視 )</div>
            <input type="range" id="range-clipping" min="0" max="100" value="0" oninput="applySettings()">
        </div>

        <div class="section-title">Components</div>
        <div class="control-group">
            <div class="control-item">
                <span class="label-text">Polymer (Cartoon)</span>
                <label class="switch"><input type="checkbox" id="comp-polymer" checked onchange="applyComponents()"><span class="slider"></span></label>
            </div>
            <div class="control-item">
                <span class="label-text">Water (Solvent)</span>
                <label class="switch"><input type="checkbox" id="comp-water" onchange="applyComponents()"><span class="slider"></span></label>
            </div>
        </div>
    </div>
    
    <div id="viewer-container"><div id="myViewer"></div></div>
</div>

<script>
    var viewerInstance = new PDBeMolstarPlugin();
    var options = {
        moleculeId: '1ubq',
        hideControls: true,
        bgColor: {r: 255, g: 255, b: 255},
        visualStyle: 'cartoon',
        loadEmpty: false
    };

    window.onload = function() {
        viewerInstance.render(document.getElementById('myViewer'), options);
        // 定期檢查插件是否準備就緒並應用初始化
        var initCheck = setInterval(() => {
            if (viewerInstance.plugin) {
                applyComponents(); // 初始隱藏水分子
                applySettings();   // 初始渲染設定
                // 鎖定互動模式（防止點擊淡化）
                viewerInstance.plugin.managers.interactivity.setProps({ props: { click: 'select' } });
                clearInterval(initCheck);
            }
        }, 500);
    };

    // 核心設定應用：Outline, Fog, Clipping, Animate
    function applySettings() {
        if (!viewerInstance.plugin) return;
        
        const isAnimate = document.getElementById('check-animate').checked;
        const isOutline = document.getElementById('check-outline').checked;
        const isFog = document.getElementById('check-fog').checked;
        const clipVal = parseInt(document.getElementById('range-clipping').value);

        // 1. 自動旋轉
        viewerInstance.visual.toggleSpin(isAnimate);

        // 2. 渲染效果 (解決變黑問題)
        viewerInstance.plugin.canvas3d.setProps({
            postprocessing: {
                outline: { 
                    name: isOutline ? 'on' : 'off', 
                    params: isOutline ? { scale: 1, threshold: 0.33, color: {r: 0, g: 0, b: 0} } : {} 
                }
            },
            cameraFog: isFog ? { name: 'on', params: { intensity: 50 } } : { name: 'off', params: {} },
            renderer: { backgroundColor: {r: 1, g: 1, b: 1} } // 強制白色
        });

        // 3. Clipping (滑桿 0-100 對應相機裁切)
        // 修正：直接調整相機狀態的 clipping 屬性
        const p = viewerInstance.plugin;
        p.canvas3d.setProps({
            cameraClipping: {
                radiusContext: 0,
                far: true,
                near: true,
                minNear: clipVal // 0 為不裁切，100 為裁切最大
            }
        });
        
        // 強制渲染更新
        viewerInstance.plugin.requestCameraFocus();
        viewerInstance.canvas.setBgColor({r: 255, g: 255, b: 255});
    }

    // 核心組件管理：解決水分子顯示不掉的問題
    function applyComponents() {
        if (!viewerInstance.plugin) return;

        const showPolymer = document.getElementById('comp-polymer').checked;
        const showWater = document.getElementById('comp-water').checked;

        // PDBe API 的 visibility 有時對自動生成的組件無效，改用底層組件管理器
        const components = viewerInstance.plugin.managers.structure.component.state.components;
        
        components.forEach(comp => {
            const label = comp.cell.obj.label.toLowerCase();
            if (label.includes('polymer')) {
                viewerInstance.plugin.managers.structure.component.setVisibility([comp], showPolymer);
            }
            if (label.includes('water') || label.includes('solvent')) {
                viewerInstance.plugin.managers.structure.component.setVisibility([comp], showWater);
            }
        });

        // 確保不顯示密度圖提示
        viewerInstance.visual.update({ visualStyle: 'cartoon' });
    }

    function changeProtein(pdbId, btn) {
        document.querySelectorAll('.protein-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        viewerInstance.visual.update({
            moleculeId: pdbId,
            visualStyle: 'cartoon'
        });

        // 更換模型後需重新鎖定組件與渲染狀態
        setTimeout(() => {
            applyComponents();
            applySettings();
            viewerInstance.visual.focus();
            viewerInstance.canvas.setBgColor({r: 255, g: 255, b: 255});
        }, 1200);
    }
</script>

</body>
</html>
