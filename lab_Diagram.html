<html lang="zh-TW"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>水的三相圖：教學演示修正版</title>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --solid-color: #60a5fa;
            --liquid-color: #16a34a;
            --gas-color: #d946ef;
            --vapor-color: #fb923c;
            --accent-red: #ef4444;
            --panel-bg: #ffffff;
        }

        /* 關閉按鈕樣式 */
        .close-btn {
            position: fixed;
            top: 15px;
            right: 15px;
            z-index: 9999;
            width: 32px;
            height: 32px;
            background: rgba(0, 0, 0, 0.4);
            color: white;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            transition: background 0.2s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        .close-btn:hover {
            background: rgba(239, 68, 68, 0.8);
        }

        body {
            font-family: "Microsoft JhengHei", -apple-system, sans-serif;
            background: var(--bg-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            touch-action: none;
        }

        .header { display: none; }

        .main-container {
            display: flex;
            flex-direction: column;
            flex: 1;
            padding: 15px;
            gap: 20px;
            overflow: hidden;
        }

        /* 手機版：A 偏正方形，B/C 依線條高度；三相圖下方留白後再接粒子區 */
        @media (max-width: 991px) {
            body { height: auto; overflow-y: auto; touch-action: auto; }
            .main-container { padding: 5px; gap: 4px; height: auto; overflow: visible; }
            .canvas-section { flex: 0 0 auto; width: 100%; aspect-ratio: 1.3; min-height: 0; border-radius: 8px; margin-bottom: 2px; }
            .side-panel { margin-top: 2px; flex: 0 0 auto; flex-direction: column; min-width: 0; min-height: 0; gap: 4px; }
            .side-panel .card:first-child { order: 2; flex: 0 0 auto; min-height: 0; padding: 8px 10px; }
            .side-panel .card:last-child { order: 1; flex: 0 0 auto; min-height: 0; padding: 8px 10px; }
            .side-panel .status-badge { font-size: 1.2rem; padding: 6px; margin-bottom: 4px; }
            .side-panel .data-display { font-size: 0.95rem; margin-bottom: 4px; }
            .side-panel .input-row { gap: 4px; }
            .side-panel .input-row label { font-size: 0.8rem; margin-bottom: 1px; }
            .side-panel .input-row input { padding: 4px 6px; font-size: 0.9rem; }
            .side-panel #container-view { height: 85px; margin-top: 2px; border-radius: 6px; }
            .side-panel #particleDesc { font-size: 0.8rem; margin-top: 2px; }
            .side-panel .card:last-child > div:first-child { font-size: 0.9rem; }
        }

        @media (min-width: 992px) {
            .main-container { flex-direction: row; }
            .canvas-section { flex: 2.8; }
            .side-panel { flex: 1; min-width: 340px; }
        }

        .canvas-section {
            background: var(--panel-bg);
            border-radius: 12px;
            position: relative;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            min-height: 0;
            border: none;
            outline: none;
        }

        canvas#diagram { width: 100%; height: 100%; display: block; cursor: crosshair; touch-action: none; }

        .side-panel {
            display: flex;
            flex-direction: column;
            gap: 15px;
            min-height: 0;
        }

        .card {
            background: var(--panel-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .status-badge {
            font-size: 2.2rem;
            font-weight: bold;
            text-align: center;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            border: 3px solid transparent;
        }

        /* 狀態顏色 */
        .status-solid { background: #eff6ff; color: var(--solid-color); }
        .status-liquid { background: #dcfce7; color: var(--liquid-color); }
        .status-vapor { background: #ffedd5; color: var(--vapor-color); }
        .status-gas { background: #fae8ff; color: var(--gas-color); }
        .status-coexist { background: #f3e8ff; color: #6b21a8; border-color: #6b21a8; }
        .status-critical { background: #fee2e2; color: #b91c1c; border-color: #ef4444; border-style: dashed; }

        .data-display { font-size: 1.4rem; margin-bottom: 15px; font-weight: bold; color: #333; }
        .input-row { display: flex; gap: 10px; }
        .input-row div { flex: 1; }
        label { display: block; font-size: 1rem; color: #666; margin-bottom: 5px; }
        input { width: 90%; padding: 10px; border: 2px solid #ddd; border-radius: 8px; font-size: 1.2rem; font-weight: bold; }

        #container-view {
            width: 100%;
            height: 140px;
            background: #000;
            border-radius: 8px;
            margin-top: 10px;
        }

        #particleDesc { font-size: 1rem; color: #555; margin-top: 10px; }
    </style>
</head>
<body>

<button class="close-btn" onclick="closeLab()" title="關閉">✕</button>

<div class="main-container">
    <div class="canvas-section" id="chartArea">
        <canvas id="diagram" width="1840" height="1132"></canvas>
    </div>

    <div class="side-panel">
        <div class="card">
            <div id="statusBadge" class="status-badge status-gas">氣態</div>
            <div class="data-display">
                溫度：<span id="txtT">479</span> ℃　壓力：<span id="txtP">0.8</span> atm
            </div>
            <div class="input-row">
                <div>
                    <label>輸入溫度 ℃</label>
                    <input type="number" id="inputT" value="25">
                </div>
                <div>
                    <label>輸入壓力 atm</label>
                    <input type="number" id="inputP" value="1" step="0.1">
                </div>
            </div>
        </div>

        <div class="card">
            <div style="font-weight: bold; font-size: 1.1rem;">微觀粒子運動</div>
            <canvas id="container-view" width="486" height="140"></canvas>
            <div id="particleDesc">氣態：粒子快速混亂運動。</div>
        </div>
    </div>
</div>

<script>
    function closeLab() {
        // 發送訊息給父視窗以關閉 iframe
        window.parent.postMessage('closeDiagramLab', '*');
        // 如果不是在 iframe 中，則嘗試回上一頁
        if (window.self === window.top) {
            window.history.back();
        }
    }

    const canvas = document.getElementById('diagram');
    const ctx = canvas.getContext('2d');
    const pCanvas = document.getElementById('container-view');
    const pCtx = pCanvas.getContext('2d');
    const chartArea = document.getElementById('chartArea');
    
    // 壓力軸 0～2.5；三相點往右上、臨界點往右；橫坐標下方留白加大以分層顯示溫度
    const cfg = {
        marginLeft: 38,
        marginBottom: 35,
        marginRight: 52,
        marginTop: 28,
        minT: 0, maxT: 500,
        minP: 0, maxP: 2.5,
        tpT: 210, tpP: 0.8,
        cpT: 455, cpP: 2,      // 臨界點再往右
        hit: 15
    };

    let mouse = { x: 0, y: 0 };
    let isDragging = false;
    let w, h;
    let particles = [];
    function initParticlePositions() {
        const W = pCanvas.clientWidth || 200, H = pCanvas.clientHeight || 140;
        particles.forEach((p, i) => {
            if (p.x === 0 && p.y === 0) {
                p.x = 20 + (i % 10) * (W / 11);
                p.y = 20 + Math.floor(i / 10) * (H / 5);
            }
        });
    }
    for (let i = 0; i < 40; i++) {
        particles.push({ x: 0, y: 0, vx: (Math.random() - 0.5) * 0.8, vy: (Math.random() - 0.5) * 0.8 });
    }

    // 物理與畫布座標轉換
    function tToX(t) { return cfg.marginLeft + (t - cfg.minT) / (cfg.maxT - cfg.minT) * (w - cfg.marginLeft - cfg.marginRight); }
    function pToY(p) { return (h - cfg.marginBottom) - (p - cfg.minP) / (cfg.maxP - cfg.minP) * (h - cfg.marginBottom - cfg.marginTop); }
    function xToT(x) { return cfg.minT + (x - cfg.marginLeft) / (w - cfg.marginLeft - cfg.marginRight) * (cfg.maxT - cfg.minT); }
    function yToP(y) { return cfg.minP + ((h - cfg.marginBottom) - y) / (h - cfg.marginBottom - cfg.marginTop) * (cfg.maxP - cfg.minP); }

    // 精確的壓力映射 (內部 p -> 顯示 atm)
    function pToDisplayP(p) {
        if (p <= 0.8) return p * (0.006 / 0.8);
        if (p <= 0.95) return 0.006 + (p - 0.8) * (0.03 - 0.006) / (0.95 - 0.8);
        if (p <= 1.28) return 0.03 + (p - 0.95) * (1 - 0.03) / (1.28 - 0.95);
        if (p <= 1.6) return 1 + (p - 1.28) * (2 - 1) / (1.6 - 1.28);
        if (p <= 2.0) return 2 + (p - 1.6) * (218 - 2) / (2.0 - 1.6);
        return 218 + (p - 2.0) * 100;
    }
    function displayPToP(disp) {
        if (disp <= 0.006) return disp * (0.8 / 0.006);
        if (disp <= 0.03) return 0.8 + (disp - 0.006) * (0.95 - 0.8) / (0.03 - 0.006);
        if (disp <= 1) return 0.95 + (disp - 0.03) * (1.28 - 0.95) / (1 - 0.03);
        if (disp <= 2) return 1.28 + (disp - 1) * (1.6 - 1.28) / (2 - 1);
        if (disp <= 218) return 1.6 + (disp - 2) * (2.0 - 1.6) / 216;
        return 2.0 + (disp - 218) / 100;
    }

    // 精確的溫度映射 (內部 t -> 顯示 ℃)
    function tToDisplayT(t) {
        if (t <= 181.2) return (t - 181.2) * 0.1; // 1atm熔點以下
        if (t <= 210) return 0 + (t - 181.2) * (0.01 - 0) / (210 - 181.2); // 0度到三相點
        if (t <= 265) return 0.01 + (t - 210) * (25 - 0.01) / (265 - 210); // 三相點到25度
        if (t <= 337) return 25 + (t - 265) * (100 - 25) / (337 - 265); // 25度到100度
        if (t <= 455) return 100 + (t - 337) * (374 - 100) / (455 - 337); // 100度到臨界點
        return 374 + (t - 455);
    }
    function displayTToT(dt) {
        if (dt <= 0) return 181.2 + dt * 10;
        if (dt <= 0.01) return 181.2 + (dt - 0) * (210 - 181.2) / (0.01 - 0);
        if (dt <= 25) return 210 + (dt - 0.01) * (265 - 210) / (25 - 0.01);
        if (dt <= 100) return 265 + (dt - 25) * (337 - 265) / (100 - 25);
        if (dt <= 374) return 337 + (dt - 100) * (455 - 337) / (374 - 100);
        return 455 + (dt - 374);
    }

    // 教學用曲線（沿用之前圖的形狀）
    function getSubP(t) { return t > cfg.tpT ? null : cfg.tpP * Math.pow(t / cfg.tpT, 2); }
    function getVapP(t) {
        if (t < cfg.tpT || t > cfg.cpT) return null;
        const r = (t - cfg.tpT) / (cfg.cpT - cfg.tpT);
        return cfg.tpP + (cfg.cpP - cfg.tpP) * Math.pow(r, 1.4);
    }
    function getMeltT(p) { return p < cfg.tpP ? null : cfg.tpT - (p - cfg.tpP) * 60; }
    function getTForVapP(p) {
        if (p <= cfg.tpP || p >= cfg.cpP) return null;
        const r = Math.pow((p - cfg.tpP) / (cfg.cpP - cfg.tpP), 1 / 1.4);
        return cfg.tpT + (cfg.cpT - cfg.tpT) * r;
    }

    function getVapT(p) {
        if (p < cfg.tpP || p > cfg.cpP) return null;
        const r = Math.pow((p - cfg.tpP) / (cfg.cpP - cfg.tpP), 1 / 1.4);
        return cfg.tpT + (cfg.cpT - cfg.tpT) * r;
    }
    function getSubT(p) {
        if (p > cfg.tpP) return null;
        return cfg.tpT * Math.sqrt(p / cfg.tpP);
    }

    function resize() {
        w = chartArea.clientWidth; h = chartArea.clientHeight;
        
        // 修正：維持 0-500℃ 圖形大小不變，讓軸線向右延伸
        const isMobile = window.innerWidth < 992;
        const oldMarginRight = 52;
        const newMarginRight = isMobile ? 18 : 52;
        
        // 計算原始 500 度所需的像素比例，並動態調整 maxT 以延伸軸線
        const baseWidth = w - cfg.marginLeft - oldMarginRight;
        cfg.marginRight = newMarginRight;
        cfg.maxT = 500 * (w - cfg.marginLeft - newMarginRight) / baseWidth;

        canvas.width = w * devicePixelRatio; canvas.height = h * devicePixelRatio;
        ctx.scale(devicePixelRatio, devicePixelRatio);
        pCanvas.width = pCanvas.clientWidth; pCanvas.height = pCanvas.clientHeight;
        initParticlePositions();
        syncFromInputs();
    }

    function draw() {
        ctx.clearRect(0, 0, w, h);
        const isMobile = window.innerWidth < 992;
        const x0 = cfg.marginLeft;
        const y0 = h - cfg.marginBottom;
        const axisFont = isMobile ? "bold 14px Arial" : "bold 24px Arial";
        const smallFont = isMobile ? "bold 11px Arial" : "bold 20px Arial";
        const ref25P = 0.95;
        const ref25T = cfg.tpT + (cfg.cpT - cfg.tpT) * Math.pow((ref25P - cfg.tpP) / (cfg.cpP - cfg.tpP), 1 / 1.4);
        const y25 = pToY(ref25P);

        // 1. 座標軸
        ctx.strokeStyle = "#000"; ctx.lineWidth = isMobile ? 2 : 3;
        ctx.beginPath();
        ctx.moveTo(x0, cfg.marginTop); ctx.lineTo(x0, y0);
        ctx.lineTo(w - cfg.marginRight, y0);
        ctx.stroke();
        ctx.fillStyle = "#000"; ctx.font = axisFont;
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        const vStep = isMobile ? 14 : 20;
        let vY = cfg.marginTop + vStep * 0.6;
        const pressureX = Math.max(14, x0 - 18);
        ctx.fillText("壓", pressureX, vY);
        ctx.fillText("力", pressureX, vY + vStep);
        ctx.font = axisFont;
        ctx.font = axisFont;
        ctx.fillText("(P)", pressureX, vY + vStep * 2 + 2);
        
        // 1. 軸標題：溫度 (T) 移至橫軸下方右側 (藍框位置)
        ctx.fillStyle = "#000";
        ctx.textAlign = "right"; ctx.textBaseline = "top";
        ctx.fillText("溫度 (T)", w - cfg.marginRight, y0 + (isMobile ? 18 : 35));
        ctx.textAlign = "left";

        // 2. 溫度虛線與動態標籤（所有標籤皆滑到才顯示）
        const t1atmMelt = getMeltT(1.28), t1atmBoil = getTForVapP(1.28);
        const t2atmMelt = getMeltT(1.6), t2atmBoil = getTForVapP(1.6);
        const currentT = xToT(mouse.x);
        
        const tempItems = [
            { t: t2atmMelt, yEnd: pToY(1.6), lbl: "-0.01℃ (2atm熔點)" },
            { t: t1atmMelt, yEnd: pToY(1.28), lbl: "0℃ (1atm熔點)" },
            { t: cfg.tpT, yEnd: pToY(cfg.tpP), lbl: "三相點溫度: 0.01℃" },
            { t: ref25T, yEnd: y25, lbl: "25℃" },
            { t: t1atmBoil, yEnd: pToY(1.28), lbl: "100℃ (1atm沸點)" },
            { t: t2atmBoil, yEnd: pToY(1.6), lbl: "121℃ (2atm沸點)" },
            { t: cfg.cpT, yEnd: null, lbl: "臨界溫度 (Tc): 374℃" }
        ];

        ctx.setLineDash([5, 8]); ctx.strokeStyle = "#888"; ctx.lineWidth = isMobile ? 1.5 : 2;
        tempItems.forEach(item => {
            if (item.t == null) return;
            const xx = tToX(item.t);
            ctx.beginPath();
            if (item.yEnd == null) { ctx.moveTo(xx, cfg.marginTop); ctx.lineTo(xx, y0); }
            else { ctx.moveTo(xx, y0); ctx.lineTo(xx, item.yEnd); }
            ctx.stroke();
        });
        ctx.setLineDash([]);

        // 繪製標籤（精準對齊虛線正下方）
        tempItems.forEach((item) => {
            if (item.t == null) return;
            const xx = tToX(item.t);
            const dist = Math.abs(currentT - item.t);
            const isNear = dist < 10; 
            
            if (isNear) {
                ctx.font = isMobile ? "bold 12px Arial" : "bold 18px Arial";
                const ty = y0 + 8; // 微調距離

                // 靠近時才畫文字
                ctx.fillStyle = "#ef4444"; 
                ctx.textAlign = "center";
                ctx.textBaseline = "top";
                ctx.fillText(item.lbl, xx, ty);
            }
        });
        ctx.textAlign = "left";

        // 3. 水平參考線：1 atm / 2 atm 虛線止於液氣共存線；Pc 畫滿
        const p1atm = 1.28;
        const x1atmEnd = getTForVapP(p1atm), x2atmEnd = getTForVapP(1.6);
        drawRefToCurve(p1atm, "1 atm", true, 4, x1atmEnd);
        drawRefToCurve(1.6, "2 atm", true, 4, x2atmEnd);
        drawRef(2, "Pc: 218 atm", true, 4);

        // 4. 三相曲線（固液線通過三相點與 1/2 atm 熔點，無 offset）
        const meltTEnd = getMeltT(cfg.maxP);
        ctx.strokeStyle = "#2c3e50"; ctx.lineWidth = isMobile ? 3 : 5;
        ctx.beginPath(); for (let t = 0; t <= cfg.tpT; t += 2) ctx.lineTo(tToX(t), pToY(getSubP(t))); ctx.stroke();
        ctx.beginPath(); for (let t = cfg.tpT; t <= cfg.cpT; t += 2) ctx.lineTo(tToX(t), pToY(getVapP(t))); ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(tToX(cfg.tpT), pToY(cfg.tpP));
        ctx.lineTo(tToX(meltTEnd != null ? meltTEnd : cfg.tpT), pToY(cfg.maxP));
        ctx.stroke();

        // 4b. 三相點溫度／壓力虛線（灰線，不超過三相點）；壓力改 mmHg，標籤在線上方不重疊
        ctx.setLineDash([3, 6]); ctx.strokeStyle = "#888"; ctx.lineWidth = isMobile ? 1.5 : 2;
        ctx.beginPath();
        ctx.moveTo(tToX(cfg.tpT), y0); ctx.lineTo(tToX(cfg.tpT), pToY(cfg.tpP));
        ctx.moveTo(x0, pToY(cfg.tpP)); ctx.lineTo(tToX(cfg.tpT), pToY(cfg.tpP));
        ctx.stroke();
        ctx.setLineDash([]);

        const lblTpP = "約 0.006 atm";
        const yTpP = pToY(cfg.tpP);
        ctx.font = smallFont;
        const twTpP = ctx.measureText(lblTpP).width;
        const thTpP = isMobile ? 14 : 20;
        ctx.fillStyle = "white";
        ctx.fillRect(x0 + 6, yTpP + 4, twTpP + 4, thTpP);

        ctx.fillStyle = "#333";
        ctx.textAlign = "left"; ctx.textBaseline = "top";
        ctx.fillText(lblTpP, x0 + 8, yTpP + 4);

        // 4c. 25℃ 溫度線與對應蒸氣壓虛線（紅線位置），交於液氣共存線；壓力約 0.03 atm
        const x25 = tToX(ref25T);
        ctx.setLineDash([3, 6]); ctx.strokeStyle = "#888"; ctx.lineWidth = isMobile ? 1.5 : 2;
        ctx.beginPath();
        ctx.moveTo(x25, y0); ctx.lineTo(x25, y25);
        ctx.moveTo(x0, y25); ctx.lineTo(x25, y25);
        ctx.stroke();
        ctx.setLineDash([]);

        const lbl25P = "約 0.03 atm";
        ctx.font = smallFont;
        const tw25P = ctx.measureText(lbl25P).width;
        const th25P = isMobile ? 14 : 20;
        ctx.fillStyle = "white";
        ctx.fillRect(x0 + 6, y25 - th25P - 4, tw25P + 4, th25P);

        ctx.fillStyle = "#333";
        ctx.textAlign = "left"; ctx.textBaseline = "bottom";
        ctx.fillText(lbl25P, x0 + 8, y25 - 4);

        // 5. 區塊浮水印 s、l、g（避開曲線與標籤）（位置：tS/pS 左減右加、上減下加；大小：bigFont 數字）
        ctx.save();
        ctx.globalAlpha = 0.28;
        ctx.fillStyle = "#999";
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        const tS = 82, pS = 1.5, tL = 268, pL = 1.8, tG = 338, pG = 0.58;
        const bigFont = isMobile ? "bold 48px Arial" : "bold 72px Arial";
        ctx.font = bigFont;
        ctx.fillText("s", tToX(tS), pToY(pS));
        ctx.fillText("l", tToX(tL), pToY(pL));
        ctx.fillText("g", tToX(tG), pToY(pG));
        ctx.restore();

        // 6. 標註特殊點
        mark(cfg.tpT, cfg.tpP, "三相點 (T)");
        mark(cfg.cpT, cfg.cpP, "臨界點 (C)");

        drawUI();
        updateState();
    }

    function drawRef(p, txt, labelAbove, gapPx) {
        const isMobile = window.innerWidth < 992;
        const y = pToY(p);
        ctx.setLineDash([3, 6]); ctx.strokeStyle = "#888"; ctx.lineWidth = isMobile ? 1.5 : 2;
        ctx.beginPath(); ctx.moveTo(cfg.marginLeft, y); ctx.lineTo(w - cfg.marginRight, y); ctx.stroke();
        ctx.setLineDash([]);
        
        ctx.font = isMobile ? "bold 11px Arial" : "bold 18px Arial";
        const gap = gapPx != null ? gapPx : (isMobile ? 6 : 8);
        const ty = labelAbove ? y - gap : y + gap;
        
        // 白色背板
        const tw = ctx.measureText(txt).width;
        const th = isMobile ? 14 : 20;
        ctx.fillStyle = "white";
        ctx.fillRect(cfg.marginLeft + 4, labelAbove ? ty - th : ty, tw + 4, th);

        ctx.fillStyle = "#333";
        ctx.textAlign = "left";
        ctx.textBaseline = labelAbove ? "bottom" : "top";
        ctx.fillText(txt, cfg.marginLeft + 6, ty);
        ctx.textBaseline = "alphabetic";
    }

    function drawRefToCurve(p, txt, labelAbove, gapPx, endT) {
        const isMobile = window.innerWidth < 992;
        const y = pToY(p);
        const xEnd = endT != null ? tToX(endT) : (w - cfg.marginRight);
        ctx.setLineDash([3, 6]); ctx.strokeStyle = "#888"; ctx.lineWidth = isMobile ? 1.5 : 2;
        ctx.beginPath(); ctx.moveTo(cfg.marginLeft, y); ctx.lineTo(xEnd, y); ctx.stroke();
        ctx.setLineDash([]);

        ctx.font = isMobile ? "bold 11px Arial" : "bold 18px Arial";
        const gap = gapPx != null ? gapPx : (isMobile ? 6 : 8);
        const ty = labelAbove ? y - gap : y + gap;

        // 白色背板
        const tw = ctx.measureText(txt).width;
        const th = isMobile ? 14 : 20;
        ctx.fillStyle = "white";
        ctx.fillRect(cfg.marginLeft + 4, labelAbove ? ty - th : ty, tw + 4, th);

        ctx.fillStyle = "#333";
        ctx.textAlign = "left";
        ctx.textBaseline = labelAbove ? "bottom" : "top";
        ctx.fillText(txt, cfg.marginLeft + 6, ty);
        ctx.textBaseline = "alphabetic";
    }

    function mark(t, p, txt) {
        const isMobile = window.innerWidth < 992;
        const mx = tToX(t), my = pToY(p);
        const r = isMobile ? 5 : 8;
        ctx.fillStyle = "#000"; ctx.beginPath(); ctx.arc(mx, my, r, 0, 7); ctx.fill();
        ctx.fillStyle = "#000"; ctx.font = isMobile ? "bold 11px Arial" : "bold 20px Arial";
        ctx.textAlign = "left"; ctx.textBaseline = "middle";
        if (txt === "三相點 (T)") {
            if (isMobile) {
                ctx.fillText(txt, mx + 14, my + 10); // 手機版：左移並稍微下移
            } else {
                ctx.fillText(txt, mx + 30, my + 18); // 電腦版：右移並下移以避開曲線
            }
        } else {
            ctx.fillText(txt, mx + 14, my + 14);
        }
    }

    function drawUI() {
        const isMobile = window.innerWidth < 992;
        const dotR = isMobile ? 8 : 12;
        ctx.setLineDash([3, 3]); ctx.strokeStyle = "#ef4444"; ctx.lineWidth = isMobile ? 1.5 : 2;
        ctx.beginPath();
        ctx.moveTo(mouse.x, h - cfg.marginBottom); ctx.lineTo(mouse.x, mouse.y);
        ctx.moveTo(cfg.marginLeft, mouse.y); ctx.lineTo(mouse.x, mouse.y);
        ctx.stroke();
        ctx.setLineDash([]); ctx.fillStyle = "#ef4444";
        ctx.beginPath(); ctx.arc(mouse.x, mouse.y, dotR, 0, 7); ctx.fill();
        ctx.globalAlpha = 0.3; ctx.beginPath(); ctx.arc(mouse.x, mouse.y, dotR * 1.6, 0, 7); ctx.fill(); ctx.globalAlpha = 1.0;
    }

    function updateState() {
        const t = xToT(mouse.x); const p = yToP(mouse.y);
        const displayP = pToDisplayP(p);
        const displayT = tToDisplayT(t);
        document.getElementById('txtT').innerText = Math.round(displayT);
        document.getElementById('txtP').innerText = displayP >= 100 ? Math.round(displayP) : (displayP < 0.1 ? displayP.toFixed(3) : displayP.toFixed(2));
        
        const badge = document.getElementById('statusBadge');
        const vP = getVapP(t); const sP = getSubP(t); const mT = getMeltT(p);
        const dVap = vP ? Math.abs(mouse.y - pToY(vP)) : 999;
        const dSub = sP ? Math.abs(mouse.y - pToY(sP)) : 999;
        const dMelt = mT ? Math.abs(mouse.x - tToX(mT)) : 999;
        const dT = Math.hypot(mouse.x - tToX(cfg.tpT), mouse.y - pToY(cfg.tpP));
        const dC = Math.hypot(mouse.x - tToX(cfg.cpT), mouse.y - pToY(cfg.cpP));

        let state = ""; let cls = "";
        if (dT < cfg.hit) { state = "三相共存"; cls = "status-coexist"; }
        else if (dC < cfg.hit) { state = "臨界點"; cls = "status-critical"; }
        else if (t >= cfg.cpT && p >= cfg.cpP) { state = "超臨界流體"; cls = "status-critical"; }
        else {
            if (p > cfg.tpP) {
                // 高壓區 (P > 三相點壓力)
                const meltT = getMeltT(p);
                if (t < meltT) {
                    state = "固態"; cls = "status-solid";
                } else if (t < cfg.cpT) {
                    // 在臨界溫度左側，只要壓力夠高 (在 vapP 以上或超過 cpP) 就是液態
                    const vapP = getVapP(t);
                    if (p > vapP || p >= cfg.cpP) { state = "液態"; cls = "status-liquid"; }
                    else { state = "蒸氣"; cls = "status-vapor"; }
                } else {
                    // 超過臨界溫度但壓力不足
                    state = "氣體"; cls = "status-gas";
                }
            } else {
                // 低壓區 (P < 三相點壓力)
                const subT = getSubT(p);
                state = t < subT ? "固態" : "蒸氣";
                cls = t < subT ? "status-solid" : "status-vapor";
            }
        }
        badge.innerText = state; badge.className = "status-badge " + cls;
        updateParticles(state);
    }

    function updateParticles(state) {
        pCtx.clearRect(0, 0, pCanvas.width, pCanvas.height);
        const desc = document.getElementById('particleDesc');
        const W = pCanvas.width, H = pCanvas.height;
        let fillColor = "#60a5fa";
        let descText = "載入中...";
        
        // 設定各狀態的粒子顯示參數
        let particleCount = 40; // 預設粒子數
        let speedMult = 1;
        let mode = "gas"; // 預設運動模式
        
        if (state.includes("固態")) {
            fillColor = "#60a5fa";
            descText = "固態：粒子在固定位置微小振動。";
            mode = "solid";
        } else if (state.includes("液態")) {
            fillColor = "#16a34a";
            descText = "液態：粒子排列較緊密，且具備流動性。";
            mode = "liquid";
            particleCount = 40;
        } else if (state.includes("蒸氣")) {
            fillColor = "#fb923c";
            descText = "蒸氣：溫度低於臨界點，粒子較稀疏。";
            particleCount = 30;
            speedMult = 8; // 速度提升至 8 (液態 < 蒸氣 < 氣體)
        } else if (state.includes("氣體")) {
            fillColor = "#d946ef"; 
            descText = "氣體：極高能量，粒子極速運動。";
            particleCount = 30; // 與蒸氣一樣多
            speedMult = 12; 
        } else if (state.includes("超臨界")) {
            fillColor = "#b91c1c";
            descText = "超臨界：高密度且具備極高能量。";
            speedMult = 14; 
        } else if (state.includes("共存")) {
            fillColor = "#6b21a8";
            descText = "共存態：不同相態粒子動態平衡中。";
            speedMult = 2;
        }

        particles.forEach((p, i) => {
            // 只有 index 小於當前狀態粒子數的才繪製 (模擬密度變化)
            if (i >= particleCount) return;

            if (mode === "solid") {
                let r = Math.floor(i/10), c = i%10;
                let spacingX = (W - 40) / 9; // 根據容器寬度動態計算間距
                let spacingY = (H - 40) / 3; // 根據容器高度動態計算間距
                p.x = 20 + c * spacingX + Math.sin(Date.now()*0.02 + i)*2;
                p.y = 20 + r * spacingY + Math.cos(Date.now()*0.02 + i)*2;
            } else if (mode === "liquid") {
                // 液態：對標固態格點，但加上流動位移與較大振幅
                let r = Math.floor(i/10), c = i%10;
                let spacingX = (W - 40) / 9;
                let spacingY = (H - 40) / 3;
                let flowX = Math.sin(Date.now()*0.001 + i)*10;
                let flowY = Math.cos(Date.now()*0.001 + i)*5;
                p.x = 20 + c * spacingX + Math.sin(Date.now()*0.03 + i)*5 + flowX;
                p.y = 20 + r * spacingY + Math.cos(Date.now()*0.03 + i)*5 + flowY;
                // 限制在容器內
                p.x = Math.max(8, Math.min(W - 8, p.x));
                p.y = Math.max(8, Math.min(H - 8, p.y));
            } else {
                // 氣體/蒸氣/超臨界：直線反彈運動
                p.x += p.vx * speedMult;
                p.y += p.vy * speedMult;
                if(p.x < 5 || p.x > W - 5) p.vx *= -1;
                if(p.y < 5 || p.y > H - 5) p.vy *= -1;
                // 確保不卡在邊界
                p.x = Math.max(5, Math.min(W - 5, p.x));
                p.y = Math.max(5, Math.min(H - 5, p.y));
            }

            pCtx.fillStyle = fillColor;
            pCtx.beginPath(); pCtx.arc(p.x, p.y, 6, 0, 7); pCtx.fill();
        });
        desc.innerText = descText;
    }

    function syncFromInputs() {
        let tInput = parseFloat(document.getElementById('inputT').value);
        let pInput = parseFloat(document.getElementById('inputP').value);
        if (!isNaN(tInput) && !isNaN(pInput)) {
            mouse.x = tToX(displayTToT(tInput));
            mouse.y = pToY(displayPToP(pInput));
            draw();
        }
    }

    document.getElementById('inputT').onchange = syncFromInputs;
    document.getElementById('inputP').onchange = syncFromInputs;

    function handleMove(e) {
        if(!isDragging) return;
        const rect = canvas.getBoundingClientRect();
        let cx = e.touches ? e.touches[0].clientX : e.clientX;
        let cy = e.touches ? e.touches[0].clientY : e.clientY;
        mouse.x = Math.max(cfg.marginLeft, Math.min(w - cfg.marginRight, cx - rect.left));
        mouse.y = Math.max(cfg.marginTop, Math.min(h - cfg.marginBottom, cy - rect.top));
        draw();
        e.preventDefault();
    }

    canvas.addEventListener('mousedown', (e) => { isDragging = true; handleMove(e); });
    window.addEventListener('mousemove', handleMove);
    window.addEventListener('mouseup', () => isDragging = false);
    canvas.addEventListener('touchstart', (e) => { isDragging = true; handleMove(e); }, {passive:false});
    window.addEventListener('touchmove', handleMove, {passive:false});
    window.addEventListener('touchend', () => isDragging = false);
    window.addEventListener('resize', resize);

    resize();
    setInterval(draw, 16); // 提升至約 60fps
</script>

</body></html>
